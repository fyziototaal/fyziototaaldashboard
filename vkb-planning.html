<script>
  // ─── AUTO-VERSIECONTROLE ─────────────────────────────────────────
  // Checkt bij elke page load of er een nieuwere versie live staat.
  // Zo niet consequent verhogen bij elke aanpassing: fetch faalt stil.
  const APP_VERSION = "2026-11-27.2";
  (function(){
    try{
      if(location.search.indexOf("_v=")!==-1)return; // net al herladen, geen loop
      fetch(location.pathname, { cache: "no-store" })
        .then(r=>r.text())
        .then(html=>{
          const m=html.match(/<!--\s*APP_VERSION:\s*([^\s>]+)\s*-->/);
          if(m&&m[1]&&m[1]!==APP_VERSION){
            location.replace(location.pathname+"?_v="+Date.now());
          }
        })
        .catch(()=>{});
    }catch(e){}
  })();
</script>

// ─── PLANNING HELPERS ─────────────────────────────────────────────
function addWeeks(d,w){const dt=new Date(d);dt.setDate(dt.getDate()+w*7);return dt.toISOString().split("T")[0];}
function today(){return new Date().toISOString().split("T")[0];}
function dagenverschil(a,b){return Math.round((new Date(b)-new Date(a))/(1000*60*60*24));}
function nlDatum(s){if(!s)return"—";const[y,m,d]=s.split("-");return`${d}-${m}-${y}`;}
function weeksSinceOp(d){return Math.floor(dagenverschil(d,today())/7);}
function getMomentStatus(gepland,gedaan){if(gedaan)return"groen";const diff=dagenverschil(today(),gepland);if(diff<0)return"rood";if(diff<=14)return"oranje";return"grijs";}
function mijlpaalGedaanViaTest(patData,mijlpaalId){const mml=patData?.meetmomenten||[];return mml.find(m=>m.type==="mijlpaal"&&m.refId===mijlpaalId)||null;}

// ─── HULPFUNCTIES ─────────────────────────────────────────────────
function n2s(v){if(v===undefined||v===null||v==="")return"";return String(v).replace(",",".");}
function lsi(a,b){a=n2s(a);b=n2s(b);if(!a||!b||Number(b)===0)return"";return((Number(a)/Number(b))*100).toFixed(2);}
function rm1(g,r){g=n2s(g);r=n2s(r);if(!g||!r)return"";const rn=Number(r);if(rn<1)return"";return(Number(g)/(1.0278-0.0278*rn)).toFixed(2);}
function berekenACLRSI(w){let tot=0,cnt=0;ACLRSI_VRAGEN.forEach((_,i)=>{const v=w["aclrsi_"+i];if(v===undefined||v==="")return;cnt++;tot+=Number(v);});if(cnt===0)return null;return Math.round(tot/cnt);}

function calcW(id,w){
  const n={...w};
  if(id==="quadriceps_lag"){const a=n2s(n.actieve_extensie),b=n2s(n.passieve_extensie);if(a&&b)n.quad_lag=Math.abs(Number(b)-Number(a)).toFixed(2);}
  if(id==="beenomtrek")n.been_verschil=lsi(n.been_aangedaan,n.been_niet);
  if(id==="een_rm"){n.rm_qn_1rm=rm1(n.rm_qn_g,n.rm_qn_r);n.rm_qa_1rm=rm1(n.rm_qa_g,n.rm_qa_r);n.rm_hn_1rm=rm1(n.rm_hn_g,n.rm_hn_r);n.rm_ha_1rm=rm1(n.rm_ha_g,n.rm_ha_r);n.rm_q_lsi=lsi(n.rm_qa_1rm,n.rm_qn_1rm);n.rm_h_lsi=lsi(n.rm_ha_1rm,n.rm_hn_1rm);const ha=Number(n2s(n.rm_ha_1rm)),qa=Number(n2s(n.rm_qa_1rm));if(ha&&qa)n.rm_hq=((ha/qa)*100).toFixed(2);}
  if(id==="slh")n.slh_lsi=lsi(n.slh_aan,n.slh_niet);
  if(id==="thd")n.thd_lsi=lsi(n.thd_aan,n.thd_niet);
  if(id==="crossover_hop")n.ch_lsi=lsi(n.ch_aan,n.ch_niet);
  if(id==="sh")n.sh_lsi=lsi(n.sh_aan,n.sh_niet);
  if(id==="vj")n.vj_lsi=lsi(n.vj_aan,n.vj_niet);
  if(id==="hopping_spot")n.hs_lsi=lsi(n.hs_aan,n.hs_niet);
  return n;
}
function calcHHD(w){
  const n={...w};
  n.hhd_ham_lsi=lsi(n.hhd_ham_aan,n.hhd_ham_niet);
  n.hhd_quad_lsi=lsi(n.hhd_quad_aan,n.hhd_quad_niet);
  const ha=Number(n2s(n.hhd_ham_aan)),qa=Number(n2s(n.hhd_quad_aan));
  if(ha&&qa)n.hhd_hq=((ha/qa)*100).toFixed(2);
  return n;
}

// Mijlpalen hebben geen fasenummer: koppel ze aan de fase waarin ze vallen (voor de LSI-eis)
const MIJLPAAL_FASE={m_hardlopen:3,m_springen:3,m_rts:4,m_rtt:4,m_rtc:5};
function faseVan(m){return m.type==="fase"?m.refId:(MIJLPAAL_FASE[m.refId]||null);}
function lsiKleur(v,type,fase){if(v===""||v===undefined||v===null)return null;if(typeof fase==="string")fase=MIJLPAAL_FASE[fase];const n=Number(v),d=LSI_DREMPEL[type]?.[fase];if(d===undefined)return{bg:C.groenLight,col:C.groen};if(d===null)return{bg:C.groenLight,col:C.groen};if(n>=d)return{bg:C.okLight,col:C.ok};if(n>=d-10)return{bg:C.oranjeLight,col:C.oranje};return{bg:C.roodLight,col:C.rood};}
function hopSpotKleur(v){const n=Number(v);if(n>95)return{bg:C.okLight,col:C.ok,label:"Zeer goed (>95%)"};if(n>=90)return{bg:"#d1fae5",col:"#065f46",label:"Goed (90–95%)"};if(n>=70)return{bg:C.oranjeLight,col:C.oranje,label:"Matig (70–90%)"};return{bg:C.roodLight,col:C.rood,label:"Slecht (<70%)"};}
function plankKleur(v){const n=Number(v);if(n>=120)return{bg:C.okLight,col:C.ok,label:"Goed (≥120 sec)"};if(n>=60)return{bg:C.oranjeLight,col:C.oranje,label:"Matig (60–119 sec)"};return{bg:C.roodLight,col:C.rood,label:"Onvoldoende (<60 sec)"};}
function tijdNaarSec(s){if(!s)return null;const p=s.split(":");if(p.length===2){const m=parseInt(p[0]),sec=parseFloat(p[1]);if(!isNaN(m)&&!isNaN(sec))return m*60+sec;}return null;}
function roeiKleur(s){const sec=tijdNaarSec(s);if(sec===null)return null;if(sec<150)return{bg:C.okLight,col:C.ok,label:"Goed (<2:30)"};return{bg:C.oranjeLight,col:C.oranje,label:"Ruimte voor verbetering (≥2:30)"};}
function aclrsiKleur(sc){if(sc===null||sc===undefined)return null;if(sc>72)return{bg:C.okLight,col:C.ok,label:"Psychologisch klaar (>72)"};if(sc>=56)return{bg:C.oranjeLight,col:C.oranje,label:"Twijfelachtig (56–72)"};return{bg:C.roodLight,col:C.rood,label:"Niet klaar (<56)"};}
function badge(bg,col,tekst){return`<span class="badge" style="background:${bg};color:${col}">${tekst}</span>`;}
function lsiBadge(v,type,fase){const k=lsiKleur(v,type,fase);return k?badge(k.bg,k.col,Number(v).toFixed(2)+"%"):"";}

// ─── INVOER: stabiele input-componenten ───────────────────────────
// Bouwt een invoerveld dat NOOIT de hele pagina herrendert.
// Na blur wordt de waarde opgeslagen in S.waarden en worden alleen
// de computed-velden bijgewerkt via updateComputed().
function veldHTML(v,waarden,testId,fase){
  const val=waarden[v.id]||"";
  if(v.ber){
    // Berekend veld: alleen weergave
    let disp="<span style='color:#5a5a56'>—</span>";
    if(val!==""){
      if(v.lsiType){const k=lsiKleur(val,v.lsiType,fase);if(k)disp=badge(k.bg,k.col,Number(val).toFixed(2)+"%");}
      else if(v.isHopSpot){const k=hopSpotKleur(val);disp=badge(k.bg,k.col,Number(val).toFixed(2)+"% – "+k.label);}
      else disp=`<strong style="color:${C.groen}">${val}${v.een||""}</strong>`;
    }
    return`<div class="ft-veld-wrap"><div class="ft-veld-label">${v.label}${v.een?" ("+v.een+")":""}</div><div class="ft-computed" id="computed_${v.id}">${disp}<span style="font-size:12px;color:#5a5a56">automatisch</span></div></div>`;
  }
  if(v.isRoeien){
    const k=roeiKleur(val);
    return`<div class="ft-veld-wrap"><div class="ft-veld-label">${v.label}</div>
      <input class="ft-input" type="text" inputmode="text" placeholder="bijv. 2:15" value="${val}"
        onblur="S.waarden['${v.id}']=this.value;updateComputed('${testId}')"
        style="margin-bottom:4px"/>
      <div id="computed_${v.id}">${val&&k?badge(k.bg,k.col,k.label):""}</div></div>`;
  }
  if(v.isPlank){
    const k=val?plankKleur(val):null;
    return`<div class="ft-veld-wrap"><div class="ft-veld-label">${v.label} (${v.een})</div>
      <input class="ft-input" type="text" inputmode="numeric" placeholder="seconden" value="${val}"
        onblur="S.waarden['${v.id}']=this.value.replace(',','.');updateComputed('${testId}')"
        style="margin-bottom:4px"/>
      <div id="computed_${v.id}">${val&&k?badge(k.bg,k.col,k.label):""}</div></div>`;
  }
  if(v.sel){
    const opts=v.opties.map(([w,l])=>`<option value="${w}" ${val===w?"selected":""}>${l}</option>`).join("");
    return`<div class="ft-veld-wrap"><div class="ft-veld-label">${v.label}</div>
      <select class="ft-input" onchange="S.waarden['${v.id}']=this.value;S.waarden=calcW('${testId}',S.waarden);updateAllComputed('${testId}')">${opts}</select></div>`;
  }
  // Standaard decimaal invoerveld
  return`<div class="ft-veld-wrap"><div class="ft-veld-label">${v.label}${v.een?" ("+v.een+")":""}</div>
    <input class="ft-input" type="text" inputmode="decimal" value="${val}"

    /></div>`;
}

function hhdVeldHTML(v,waarden,fase){

    /></div>`;

// Update alleen de berekende velden zonder volledige re-render
function updateComputed(testId){
  S.waarden=calcW(testId,S.waarden);
  updateAllComputed(testId);
}
function updateAllComputed(testId){
  const t=ALLE_TESTEN.find(x=>x.id===testId);if(!t)return;
  t.velden.filter(v=>v.ber).forEach(v=>{
    const el=document.getElementById("computed_"+v.id);if(!el)return;
    const val=S.waarden[v.id]||"";
    let disp="<span style='color:#5a5a56'>—</span>";
    if(val!==""){
      if(v.lsiType){const k=lsiKleur(val,v.lsiType,S.mm?.refId);if(k)disp=badge(k.bg,k.col,Number(val).toFixed(2)+"%");}
      else if(v.isHopSpot){const k=hopSpotKleur(val);disp=badge(k.bg,k.col,Number(val).toFixed(2)+"% – "+k.label);}
      else disp=`<strong style="color:${C.groen}">${val}${v.een||""}</strong>`;
    }
    el.innerHTML=disp+(v.ber?`<span style="font-size:12px;color:#5a5a56">automatisch</span>`:"");
  });
  // Roeien / plank badge
  t.velden.filter(v=>v.isRoeien||v.isPlank).forEach(v=>{
    const el=document.getElementById("computed_"+v.id);if(!el)return;
    const val=S.waarden[v.id]||"";
    if(v.isRoeien){const k=roeiKleur(val);el.innerHTML=val&&k?badge(k.bg,k.col,k.label):"";}
    if(v.isPlank){const k=val?plankKleur(val):null;el.innerHTML=val&&k?badge(k.bg,k.col,k.label):"";}
  });
}
function updateAllHHDComputed(){
  const sub=HHD_STAPPEN[S.hhdStap];if(!sub||sub.type!=="invoer")return;
  sub.velden.filter(v=>v.ber).forEach(v=>{
    const el=document.getElementById("computed_"+v.id);if(!el)return;
    const val=S.waarden[v.id]||"";
    let disp="<span style='color:#5a5a56'>—</span>";
    if(val!==""){const k=v.lsiType?lsiKleur(val,v.lsiType,S.mm?.refId):null;if(k)disp=badge(k.bg,k.col,Number(val).toFixed(2)+"%");else disp=`<strong style="color:${C.groen}">${val}${v.een||""}</strong>`;}
    el.innerHTML=disp+`<span style="font-size:12px;color:#5a5a56">automatisch</span>`;
  });
}

function renderMeetmoment(){
  const mm=S.mm;if(!mm)return"";
  const isFase=mm.type==="fase";
  const criteria=isFase?(FASE_CRITERIA[mm.refId]||[]):[];
  const allJa=criteria.length>0&&criteria.every(c=>S.crit[c]==="ja");
  const testenIds=isFase?(TESTEN_PER_FASE[mm.refId]||[]):(TESTEN_PER_MIJLPAAL[mm.refId]||[]);
  const testen=ALLE_TESTEN.filter(t=>testenIds.includes(t.id));
  const cats=[...new Set(testen.map(t=>t.cat))];
  const vl=isFase?FASE_VLAGGEN[mm.refId]:null;
  const heeftVl=(vl?.geel?.length||0)+(vl?.rood?.length||0)>0;
  const vlagHTML=S.toonVlaggen&&vl?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
    ${vl.geel.length?`<div class="vlag-blok" style="background:${C.geelLight};border:1px solid #fcd34d"><div style="font-size:12px;font-weight:500;color:${C.geel};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">🟡 Gele vlaggen</div>${vl.geel.map(g=>`<div style="font-size:13px;color:#78350f;margin-bottom:2px">· ${g}</div>`).join("")}</div>`:""}
    ${vl.rood.length?`<div class="vlag-blok" style="background:${C.roodLight};border:1px solid #fca5a5"><div style="font-size:12px;font-weight:500;color:${C.rood};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">🔴 Rode vlaggen</div>${vl.rood.map(r=>`<div style="font-size:13px;color:#7f1d1d;margin-bottom:2px">· ${r}</div>`).join("")}</div>`:""}</div>`:"";
  const critHTML=criteria.length?`<div class="ft-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:15px;font-weight:500;color:${C.groen}">Fase-criteria checklist</div>
      ${allJa?`<span class="badge" style="background:${C.okLight};color:${C.ok}">Alle criteria behaald ✓</span>`:""}
    </div>
    ${criteria.map((c,i)=>`<div class="ft-crit-row"><span style="font-size:14px;flex:1;padding-right:8px">${c}</span><div style="display:flex;gap:6px;flex-shrink:0"><button class="${S.crit[c]==="ja"?"ft-ja":"ft-neutral"}" onclick='setCrit(${JSON.stringify(c)},"ja")'>Ja</button><button class="${S.crit[c]==="nee"?"ft-nee":"ft-neutral"}" onclick='setCrit(${JSON.stringify(c)},"nee")'>Nee</button></div></div>`).join("")}
    <div style="margin-top:12px;display:flex;align-items:center;gap:10px"><button class="ft-btn-p" onclick="saveCrit()">Opslaan</button>${S.ok?`<span class="ok-msg">Opgeslagen!</span>`:""}</div>
  </div>`:"";
  const testenHTML=cats.map(cat=>{
    const rijen=testen.filter(t=>t.cat===cat).map(t=>{
      const ged=!!mm.testen?.[t.id];
      const lsiV=t.velden.find(v=>v.ber&&v.lsiType);
      const lsiVal=ged&&lsiV?mm.testen[t.id]?.waarden?.[lsiV.id]:"";
      const plankVal=ged&&t.isPlank?mm.testen[t.id]?.waarden?.plank_sec:null;
      const roeiVal=ged&&t.isRoeien?mm.testen[t.id]?.waarden?.roei_tijd:null;
      const aclVal=ged&&t.isACLRSI?berekenACLRSI(mm.testen[t.id]?.waarden||{}):null;
      const hsVal=ged&&t.velden.find(v=>v.isHopSpot)?mm.testen[t.id]?.waarden?.hs_lsi:null;
      let extra="";
      if(lsiVal)extra=` ${lsiBadge(lsiVal,lsiV.lsiType,mm.refId)}`;
      else if(hsVal){const k=hopSpotKleur(hsVal);extra=` ${badge(k.bg,k.col,"LSI "+Number(hsVal).toFixed(2)+"%")}`;}
      else if(plankVal){const k=plankKleur(plankVal);extra=` ${badge(k.bg,k.col,k.label)}`;}
      else if(roeiVal){const k=roeiKleur(roeiVal);if(k)extra=` ${badge(k.bg,k.col,roeiVal)}`;}
      else if(aclVal!==null&&aclVal!==undefined){const k=aclrsiKleur(aclVal);if(k)extra=` ${badge(k.bg,k.col,aclVal+" – "+k.label)}`;}
      else if(ged)extra=` <span style="font-size:12px;color:${C.ok};font-weight:500">✓</span>`;
      return`<div class="ft-test-row"><div style="flex:1;margin-right:8px"><span style="font-size:14px;font-weight:500">${t.naam}</span>${extra}</div><button class="ft-btn-sm" onclick="startTest('${t.id}')">${ged?"Bewerken":"Starten"}</button></div>`;
    }).join("");
    return`<div class="sectie-label">${cat}</div><div class="ft-card" style="padding:.25rem 1rem">${rijen}</div>`;
  }).join("");
  return`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <button class="ft-btn-s" style="padding:7px 14px;font-size:13px" onclick="S.sc='dashboard';render()">← Dashboard</button>
      <div style="flex:1"><div style="font-size:16px;font-weight:500;color:${C.groen}">${mm.naam}</div><div style="font-size:13px;color:${C.muted};display:flex;align-items:center;gap:6px">${S.mmDatumBewerken?`<input type="date" id="mm-datum-inp" class="ft-input" style="width:auto;padding:4px 8px;font-size:13px" value="${mm.datum}"/><button class="ft-btn-sm" style="padding:3px 8px;font-size:12px" onclick="opslaanMmDatum()">✓</button><button class="ft-btn-sm" style="padding:3px 8px;font-size:12px" onclick="S.mmDatumBewerken=false;render()">✗</button>`:`<span>${mm.datum}</span><button class="ft-btn-sm" style="padding:2px 7px;font-size:11px" onclick="S.mmDatumBewerken=true;render()">✎</button>`}${mm.timing?" · "+mm.timing:""} · ${patLabel()}</div></div>
      ${heeftVl?`<button class="ft-btn-sm" style="${S.toonVlaggen?`background:${C.roodLight};border-color:${C.rood}`:""}" onclick="S.toonVlaggen=!S.toonVlaggen;render()">⚑ Vlaggen</button>`:""}
    </div>
    ${vlagHTML}${critHTML}${testenHTML}
    <div style="margin-top:20px"><button class="ft-btn-p" onclick="S.rapMm=S.mm;S.sc='rapport';render()">Rapport genereren →</button></div>`;
}

function renderChecklist(){
  const t=S.test;if(!t)return"";
  const isGALN=t.isGALN,isCrit=t.isCriteria;
  const items=isGALN?GALN_ITEMS:(t.items||[]);
  const cats=isGALN?GALN_CATS:(t.cats||[]);
  const critItems=isCrit?(t.criteriaItems||[]):[];
  const aangevinkt=isGALN?items.filter(i=>S.checkW[i.id]==="ja").length:0;
  const critHTML=isCrit?`<div class="ft-card">${critItems.map((c,i)=>`<div class="ft-check-row"><span style="font-size:14px;flex:1;line-height:1.5">${c}</span><div style="display:flex;gap:6px;flex-shrink:0"><button class="${S.checkW["crit_"+i]==="ja"?"ft-ja":"ft-neutral"}" onclick="S.checkW['crit_${i}']='ja';render()">Ja</button><button class="${S.checkW["crit_"+i]==="nee"?"ft-nee":"ft-neutral"}" onclick="S.checkW['crit_${i}']='nee';render()">Nee</button></div></div>`).join("")}</div>`:"";
  const lijstHTML=!isCrit?cats.map(cat=>`<div class="ft-card" style="margin-bottom:10px"><div style="font-size:12px;font-weight:500;color:${C.groenAccent};text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px">${cat}</div>${items.filter(i=>i.cat===cat).map(item=>`<div class="ft-check-row"><span style="font-size:14px;flex:1;line-height:1.5">${item.label}</span><div style="display:flex;gap:6px;flex-shrink:0"><button class="${S.checkW[item.id]==="ja"?"ft-ja":"ft-neutral"}" onclick="S.checkW['${item.id}']='ja';render()">Ja</button><button class="${S.checkW[item.id]==="nee"?"ft-nee":"ft-neutral"}" onclick="S.checkW['${item.id}']='nee';render()">Nee</button></div></div>`).join("")}</div>`).join(""):"";

function renderRapport(){
  const m=S.rapMm;if(!m)return"";
  const isFase=m.type==="fase";
  const criteria=isFase?(FASE_CRITERIA[m.refId]||[]):[];
  const jaC=criteria.filter(c=>m.criteria?.[c]==="ja").length;
  const testenIds=isFase?(TESTEN_PER_FASE[m.refId]||[]):(TESTEN_PER_MIJLPAAL[m.refId]||[]);
  const rapTesten=ALLE_TESTEN.filter(t=>testenIds.includes(t.id));
  const critHTML=criteria.length?`<div class="ft-card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="font-size:15px;font-weight:500;color:${C.groen}">Fase-criteria</div><span style="font-size:13px;color:${C.muted}">${jaC}/${criteria.length} behaald</span></div>${criteria.map((c,i)=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:${i<criteria.length-1?"1px solid "+C.grijsBorder:"none"}"><span>${c}</span><span style="font-weight:500;color:${m.criteria?.[c]==="ja"?C.ok:m.criteria?.[c]==="nee"?C.rood:C.muted}">${m.criteria?.[c]==="ja"?"Ja":m.criteria?.[c]==="nee"?"Nee":"—"}</span></div>`).join("")}</div>`:"";
  const testenHTML=rapTesten.map(t=>{
    const r=m.testen?.[t.id];if(!r)return"";
    const w=t.isHHD?calcHHD({...(r.waarden||{})}):calcW(t.id,{...(r.waarden||{})}); // berekende velden (LSI) altijd actueel tonen
    if(t.isGALN){const jaI=GALN_ITEMS.filter(i=>w[i.id]==="ja").length;return`<div class="ft-card"><div style="font-size:14px;font-weight:500;color:${C.groen};margin-bottom:8px">${t.naam}</div><div style="font-size:13px;margin-bottom:6px"><span style="color:${C.muted}">Aanwezig: </span><strong>${jaI}/${GALN_ITEMS.length}</strong>${w.galn_normaal?`<span style="margin-left:12px;color:${C.muted}">Genormaliseerd: <strong style="color:${w.galn_normaal==="ja"?C.ok:C.rood}">${w.galn_normaal==="ja"?"Ja":"Nee"}</strong></span>`:""}</div>${r.notitie?`<div style="font-size:13px;color:${C.muted}">Notitie: ${r.notitie}</div>`:""}</div>`;}
    if(t.isKwal){const items=t.items||[];const cats=t.cats||[];return`<div class="ft-card"><div style="font-size:14px;font-weight:500;color:${C.groen};margin-bottom:8px">${t.naam}</div>${cats.map(cat=>{const ci=items.filter(i=>i.cat===cat&&(w[i.id]==="ja"||w[i.id]==="nee"));if(!ci.length)return"";return`<div style="margin-bottom:6px"><div style="font-size:12px;color:${C.groenAccent};font-weight:500;margin-bottom:2px">${cat}</div>${ci.map(item=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span>${item.label}</span><span style="font-weight:500;color:${w[item.id]==="ja"?C.ok:C.rood};margin-left:8px">${w[item.id]==="ja"?"Ja":"Nee"}</span></div>`).join("")}</div>`;}).join("")}${r.notitie?`<div style="font-size:13px;color:${C.muted};margin-top:6px">Notitie: ${r.notitie}</div>`:""}</div>`;}
    if(t.isCriteria){const ci=t.criteriaItems||[];return`<div class="ft-card"><div style="font-size:14px;font-weight:500;color:${C.groen};margin-bottom:8px">${t.naam}</div>${ci.map((c,i)=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid ${C.grijsBorder}"><span>${c}</span><span style="font-weight:500;color:${w["crit_"+i]==="ja"?C.ok:w["crit_"+i]==="nee"?C.rood:C.muted}">${w["crit_"+i]==="ja"?"Ja":w["crit_"+i]==="nee"?"Nee":"—"}</span></div>`).join("")}${r.notitie?`<div style="font-size:13px;color:${C.muted};margin-top:6px">Notitie: ${r.notitie}</div>`:""}</div>`;}
    if(t.isACLRSI){const score=berekenACLRSI(w);const k=aclrsiKleur(score);return`<div class="ft-card"><div style="font-size:14px;font-weight:500;color:${C.groen};margin-bottom:8px">ACL-RSI</div>${score!==null&&k?`<div style="margin-bottom:8px"><span style="font-size:13px;color:${C.muted}">Score: </span>${badge(k.bg,k.col,score+" – "+k.label)}</div>`:""}${r.notitie?`<div style="font-size:13px;color:${C.muted};margin-top:6px">Notitie: ${r.notitie}</div>`:""}</div>`;}
    if(t.isSLS){const cw=w.checkW||{};return`<div class="ft-card"><div style="font-size:14px;font-weight:500;color:${C.groen};margin-bottom:8px">${t.naam}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:8px">${[{id:"sls_niet",l:"Niet-aangedaan"},{id:"sls_aan",l:"Aangedaan"}].map(v=>{const val=w[v.id];if(!val)return"<div/>";const goed=Number(val)>22;return`<div style="font-size:13px"><span style="color:${C.muted}">${v.l}: </span><strong>${val}</strong><span style="color:${goed?C.ok:C.rood};margin-left:4px">${goed?"✓":"✗"}</span></div>`;}).join("")}</div>${r.notitie?`<div style="font-size:13px;color:${C.muted}">Notitie: ${r.notitie}</div>`:""}</div>`;}
    const vRows=t.velden.map(v=>{const val=w[v.id];if(!val&&val!==0)return"";let disp;if(v.lsiType)disp=lsiBadge(val,v.lsiType,m.refId);else if(v.isHopSpot){const k=hopSpotKleur(val);disp=badge(k.bg,k.col,Number(val).toFixed(2)+"% – "+k.label);}else if(v.isPlank){const k=plankKleur(val);disp=badge(k.bg,k.col,val+" sec – "+k.label);}else if(v.isRoeien){const k=roeiKleur(val);disp=k?`<strong>${val}</strong> ${badge(k.bg,k.col,k.label)}`:`<strong>${val}</strong>`;}else disp=`<strong>${val}${v.een&&!v.lsiType?v.een:""}</strong>`;return`<div style="font-size:13px;padding:3px 0;margin-bottom:2px"><span style="color:${C.muted}">${v.label}: </span>${disp}</div>`;}).join("");
    return`<div class="ft-card"><div style="font-size:14px;font-weight:500;color:${C.groen};margin-bottom:8px">${t.naam}</div>${vRows}${r.notitie?`<div style="font-size:13px;color:${C.muted};margin-top:6px">Notitie: ${r.notitie}</div>`:""}</div>`;
  }).join("");
  return`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="ft-btn-s" style="padding:7px 14px;font-size:13px" onclick="S.sc='meetmoment';render()">← Terug</button>
      <div><div style="font-size:16px;font-weight:500;color:${C.groen}">Rapport</div><div style="font-size:13px;color:${C.muted}">${patLabel()} · ${m.datum}</div></div>
    </div>
    <div style="background:${C.groen};border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px;color:#fff">
      <div style="font-size:13px;opacity:.75">Fyzio Totaal · UMOOOVE</div>
      <div style="font-size:17px;font-weight:500;margin-top:2px">${m.naam}</div>
      <div style="font-size:13px;color:${C.mint};margin-top:4px">${patLabel()} · ${m.datum}${m.timing?" · "+m.timing:""} · Aangedaan been: ${S.patData?.been||S.been}</div>
    </div>
    ${critHTML}${testenHTML}
    ${renderVerslagBlok(m)}
    <div style="margin-top:16px;padding:10px 0;border-top:1px solid ${C.grijsBorder};font-size:12px;color:${C.muted}">Gegenereerd op ${new Date().toLocaleDateString("nl-NL")} · Fyzio Totaal Wierden · UMOOOVE</div>`;
}

  const nieuwHTML=`<div style="font-size:15px;font-weight:500;color:${C.groen};margin-bottom:8px;margin-top:${sorted.length?16:0}px">Patiënt toevoegen</div><div class="ft-card">
    <div class="ft-veld-label">Patiëntnummer</div><input id="pl-nr" class="ft-input" placeholder="bijv. 12345" style="margin-bottom:10px"/>
    <div class="ft-veld-label" style="margin-top:4px">Voornaam patiënt</div><input id="pl-naam" class="ft-input" placeholder="bijv. Jan" style="margin-bottom:10px"/>

function renderPlPatient(){
  const d=S.plPatData;if(!d)return"";
  const opDat=d.operatiedatum;
  const wekenNu=weeksSinceOp(opDat);
  const planning=d.planning||{};
  const naam=d.voornaam||"";
  const items=[];
  PERIODIEK_DEF.forEach(p=>{
    const status=planning[p.id]||{};
    const gedaan=status.gedaan||false;
    const uitgesteldDatum=status.uitgesteldDatum||null;
    const basisDatum=addWeeks(opDat,p.week);
    const gepland=uitgesteldDatum||basisDatum;
    items.push({id:p.id,label:p.label,type:"periodiek",gepland,basisDatum,uitgesteldDatum,gedaan,gedaanDatum:status.gedaanDatum,reden:status.reden||"",st:getMomentStatus(gepland,gedaan),richtlijnWeek:p.week});
  });
  MIJLPALEN_DEF.forEach(m=>{
    const status=planning[m.id]||{};
    const mmGedaan=mijlpaalGedaanViaTest(d,m.id);
    const gedaan=status.gedaan||!!mmGedaan;
    const gedaanDatum=status.gedaanDatum||(mmGedaan?.datum)||null;
    const uitgesteldDatum=status.uitgesteldDatum||null;
    const richtlijn=m.richtlijnWeek?addWeeks(opDat,m.richtlijnWeek):null;
    const gepland=uitgesteldDatum||richtlijn;
    const st=gedaan?"groen":gepland?getMomentStatus(gepland,false):"grijs";
    items.push({id:m.id,label:m.kort,type:"mijlpaal",richtlijn,gepland,uitgesteldDatum,gedaan,gedaanDatum,reden:status.reden||"",st,richtlijnWeek:m.richtlijnWeek,viaTest:!!mmGedaan});
  });
  items.sort((x,y)=>(x.richtlijnWeek??999)-(y.richtlijnWeek??999));
  const rttGedaan=items.find(i=>i.id==="m_rtt")?.gedaan;
  const rtcGedaan=items.find(i=>i.id==="m_rtc")?.gedaan;
  const rttReminder=rttGedaan&&!rtcGedaan?`<div style="background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;padding:12px 14px;margin-bottom:12px"><div style="font-size:13px;font-weight:500;color:#92400e;margin-bottom:2px">🏃 RTT testen voltooid</div><div style="font-size:13px;color:#78350f">RTC nog niet gepland — vergeet de 8 trainingen niet te registreren.</div></div>`:"";
  const tijdlijnHTML=items.map(item=>{
    const geplandTekst=item.gepland?`${nlDatum(item.gepland)}${item.richtlijnWeek?" (richtlijn: w"+item.richtlijnWeek+")":""}`:item.id==="m_rtc"?"Na 8 trainingen met eigen team":"—";
    const statusTekst=item.gedaan?`✓ Gedaan op ${nlDatum(item.gedaanDatum)}${item.viaTest?" (via testen)":""}`:item.st==="rood"?"Over tijd":item.st==="oranje"?"Binnenkort":"Gepland";
    const statusKleur=item.gedaan?C.ok:item.st==="rood"?C.rood:item.st==="oranje"?"#92400e":C.muted;
    const uitstellenForm=S.plUitstellenId===item.id?`
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid #e0e0da">
        <div class="ft-veld-label">Nieuwe datum:</div>
        <input type="date" class="ft-input" style="margin-bottom:8px" id="uitstel-datum" value="${S.plNieuwDatum}" oninput="S.plNieuwDatum=this.value"/>
        <div class="ft-veld-label" style="margin-top:4px">Reden (optioneel):</div>
        <input type="text" class="ft-input" style="margin-bottom:10px" id="uitstel-reden" placeholder="bijv. klachten, vakantie, niet belastbaar..." value="${S.plNieuwReden||""}" oninput="S.plNieuwReden=this.value"/>
        <div style="display:flex;gap:8px">
          <button class="ft-btn-p" style="font-size:13px;padding:8px 16px" onclick="slaUitstelOp('${item.id}')">Opslaan</button>
          <button class="ft-btn-sm" onclick="S.plUitstellenId=null;renderPlanning()">Annuleren</button>
        </div>
      </div>`:"";
    const redenBadge=item.uitgesteldDatum&&item.reden?`<div style="font-size:12px;color:#92400e;margin-top:2px">Reden: ${item.reden}</div>`:"";
    const datumAanpassenForm=S.plDatumAanpassenId===item.id?`
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid #e0e0da">
        <div class="ft-veld-label">Datum waarop getest is:</div>
        <input type="date" class="ft-input" style="margin-bottom:8px" id="gedaan-datum" value="${S.plNieuwGedaanDatum}" oninput="S.plNieuwGedaanDatum=this.value"/>
        <div style="display:flex;gap:8px">
          <button class="ft-btn-p" style="font-size:13px;padding:8px 16px" onclick="slaGedaanDatumOp('${item.id}')">Opslaan</button>
          <button class="ft-btn-sm" onclick="S.plDatumAanpassenId=null;renderPlanning()">Annuleren</button>
        </div>
      </div>`:"";
    const actieBtns=!item.gedaan?`
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <button class="ft-btn-sm" style="font-size:12px;padding:5px 12px;background:${C.okLight};border-color:${C.ok};color:${C.ok}" onclick="markeerGedaan('${item.id}')">✓ Gedaan</button>
        <button class="ft-btn-sm" style="font-size:12px;padding:5px 12px" onclick="S.plUitstellenId='${item.id}';S.plNieuwDatum='';S.plNieuwReden='';renderPlanning()">Uitstellen</button>
      </div>${redenBadge}${uitstellenForm}`:`
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <button class="ft-btn-sm" style="font-size:12px;padding:4px 10px" onclick="S.plDatumAanpassenId='${item.id}';S.plNieuwGedaanDatum='${item.gedaanDatum||today()}';renderPlanning()">Datum aanpassen</button>
        <button class="ft-btn-sm" style="font-size:12px;padding:4px 10px;color:${C.muted}" onclick="markeerOngedaan('${item.id}')">Ongedaan maken</button>
      </div>${datumAanpassenForm}`;
    return`<div class="pl-moment ${item.gedaan?"groen":item.st}"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div style="font-size:14px;font-weight:500;color:${C.groen}">${item.label}</div><div style="font-size:12px;color:${C.muted};margin-top:2px">${item.type==="periodiek"?"Periodiek":"Mijlpaal"}${item.uitgesteldDatum?" · <span style='color:#92400e'>Uitgesteld</span>":""}</div><div style="font-size:13px;margin-top:4px;color:${C.muted}">${geplandTekst}</div></div><div style="font-size:12px;font-weight:500;color:${statusKleur};text-align:right;flex-shrink:0;padding-top:2px">${statusTekst}</div></div>${actieBtns}</div>`;
  }).join("");
  return`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="ft-btn-s" style="padding:7px 14px;font-size:13px" onclick="S.plSc='overzicht';renderPlanning()">← Overzicht</button>
      <div style="flex:1">
        <div style="font-size:16px;font-weight:500;color:${C.groen};display:flex;align-items:center;gap:6px">${S.plNaamBewerken?`<input type="text" id="pl-naam-inp" class="ft-input" style="width:auto;padding:4px 8px;font-size:15px" value="${naam}" placeholder="Voornaam"/><button class="ft-btn-sm" style="padding:3px 8px;font-size:12px" onclick="opslaanPlVoornaam()">✓</button><button class="ft-btn-sm" style="padding:3px 8px;font-size:12px" onclick="S.plNaamBewerken=false;renderPlanning()">✗</button>`:`<span>${naam||"Naam onbekend"}</span><button style="background:transparent;border:none;color:${C.groenAccent};cursor:pointer;font-size:13px" onclick="S.plNaamBewerken=true;renderPlanning()">✎</button>`}</div>
        <div style="font-size:12px;color:${C.muted}">#${S.plPatNr} · ${d.been} · w${wekenNu} post-op</div>
      </div>
    </div>
    <div style="background:${C.groen};border-radius:12px;padding:1rem 1.25rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:13px;color:${C.mint}">Operatiedatum</div><div style="font-size:17px;font-weight:500;color:#fff">${nlDatum(opDat)}</div><div style="font-size:13px;color:${C.mint};margin-top:2px">Week ${wekenNu} · ${d.been} been</div></div>
      <div style="text-align:right"><div style="font-size:12px;color:${C.mint};margin-bottom:4px">Voortgang</div><div style="font-size:22px;font-weight:500;color:#fff">${items.filter(i=>i.gedaan).length}<span style="font-size:14px;opacity:.7">/${items.length}</span></div><div style="font-size:12px;color:${C.mint}">testen gedaan</div></div>
    </div>
    ${rttReminder}
    <div style="font-size:15px;font-weight:500;color:${C.groen};margin-bottom:10px">Testmomenten</div>
    ${tijdlijnHTML}
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid ${C.grijsBorder}">
      <button class="ft-btn-sm" style="color:${C.rood};border-color:${C.roodLight}" onclick="if(confirm('${naam} verwijderen uit planning?'))verwijderPat()">Verwijderen uit planning</button>
    </div>`;
}

async function zoekStart(){
  const term=document.getElementById("start-zoek")?.value.trim();
  if(!term){S.fout="Voer een voornaam of patiëntnummer in.";render();return;}
  S.fout="";S.startMatches=[];S.startIsNieuw=false;S.laden=true;render();

  // Doorzoek alle patiënten op nummer én voornaam (hoofdletter- en diakriet-ongevoelig)
  const rows=await dbList();
  const termNorm=normNaam(term);
  const matches=[];
  rows.forEach(row=>{
    try{
      const dd=JSON.parse(row.value);
      const nr=row.key.replace("vkb_","");
      if(normNaam(nr)===termNorm||(dd.voornaam&&normNaam(dd.voornaam)===termNorm))matches.push({nr,...dd});
    }catch(e){}
  });

  if(matches.length===1){openGevondenPatient(matches[0].nr,matches[0]);return;}
  if(matches.length>1){S.startMatches=matches;S.laden=false;render();return;}

  // Niet gevonden → nieuwe patiënt. Alleen cijfers = patiëntnummer, anders = voornaam.
  const isNr=/^\d+$/.test(term);
  S.patNr=isNr?term:"";S.voornaam=isNr?"":term;
  S.been="Links";S.opDatum="";S.patData={meetmomenten:[]};
  S.startIsNieuw=true;S.startNeedsExtra=true;S.laden=false;render();
}

function openGevondenPatient(nr,d){
  S.patNr=nr;
  S.patData=d||{meetmomenten:[]};
  S.voornaam=d?.voornaam||"";
  S.been=d?.been||"";
  S.opDatum=d?.operatiedatum||"";
  if(S.been&&S.opDatum){S.laden=false;S.sc="dashboard";render();}
  else{S.startNeedsExtra=true;S.laden=false;render();}
}

function kiesMatch(nr){
  const m=S.startMatches.find(x=>x.nr===nr);
  if(m)openGevondenPatient(nr,m);
}

async function bevestigExtra(){
  const b=document.getElementById("extra-been")?.value;
  const od=document.getElementById("extra-opdat")?.value;
  const naamInp=document.getElementById("extra-naam")?.value.trim();
  const nrInp=document.getElementById("extra-nr")?.value.trim();
  if(S.startIsNieuw){
    if(!nrInp){S.fout="Vul het patiëntnummer in.";render();return;}
    if(!naamInp){S.fout="Vul de voornaam in.";render();return;}
  }
  if(!b||!od){S.fout="Vul aangedaan been en operatiedatum in.";render();return;}
  if(S.startIsNieuw){
    S.patNr=nrInp;
    const bestaand=await loadData(nrInp);
    if(bestaand)S.patData=bestaand;
  }
  if(naamInp)S.voornaam=naamInp;
  S.been=b;S.opDatum=od;
  const nd={...S.patData,meetmomenten:S.patData?.meetmomenten||[]};
  nd.been=b;nd.operatiedatum=od;if(S.voornaam)nd.voornaam=S.voornaam;
  S.patData=nd;
  await saveData(S.patNr,nd);
  S.startNeedsExtra=false;S.startIsNieuw=false;S.fout="";S.sc="dashboard";render();
}

async function opslaanVoornaam(){
  const nn=document.getElementById("naam-inp")?.value.trim();
  S.voornaam=nn||"";
  const nd={...S.patData};nd.voornaam=S.voornaam;
  S.patData=nd;

function nieuwMm(type,refId,naam,timing){
  const datum=new Date().toISOString().split("T")[0];
  const mmId=type+"_"+refId+"_"+datum+"_"+Date.now();
  S.mm={datum,mmId,type,refId,naam,timing,testen:{},criteria:{}};
  S.crit={};S.toonVlaggen=false;S.dashTab=type==="fase"?"fasen":"mijlpalen";
  S.sc="meetmoment";render();
}
function openMm(m){S.mm=m;S.crit=m.criteria||{};S.toonVlaggen=false;S.mmDatumBewerken=false;S.sc="meetmoment";render();}
function openRap(m){S.rapMm=m;S.sc="rapport";render();}
function setCrit(c,v){S.crit[c]=v;render();}
function toonOk(){S.ok=true;render();setTimeout(()=>{S.ok=false;render();},2000);}

async function opslaanMmDatum(){
  const nd=document.getElementById("mm-datum-inp")?.value;
  if(!nd)return;
  const oudeDatum=S.mm.datum;
  S.mm={...S.mm,datum:nd};
  const nieuweMmId=S.mm.mmId.replace(oudeDatum,nd);
  const oudeMmId=S.mm.mmId;
  S.mm.mmId=nieuweMmId;
  const nd2={...S.patData};
  const idx=nd2.meetmomenten.findIndex(x=>x.mmId===oudeMmId);
  if(idx>=0)nd2.meetmomenten[idx]=S.mm;
  S.patData=nd2;
  await saveData(S.patNr,nd2);
  S.mmDatumBewerken=false;render();
}

async function persisteer(testId,w){
  const nm={...S.mm};if(!nm.testen)nm.testen={};
  nm.testen[testId]={waarden:w,notitie:w._notitie||""};
  const nd={...S.patData};nd.been=S.been;if(S.opDatum)nd.operatiedatum=S.opDatum;if(S.voornaam)nd.voornaam=S.voornaam;
  const idx=nd.meetmomenten.findIndex(x=>x.mmId===nm.mmId);
  if(idx>=0)nd.meetmomenten[idx]=nm;else nd.meetmomenten.push(nm);
  S.mm=nm;S.patData=nd;
  await saveData(S.patNr,nd);
}
async function saveCrit(){
  const nm={...S.mm,criteria:S.crit};
  const nd={...S.patData};nd.been=S.been;if(S.opDatum)nd.operatiedatum=S.opDatum;if(S.voornaam)nd.voornaam=S.voornaam;
  const idx=nd.meetmomenten.findIndex(x=>x.mmId===nm.mmId);
  if(idx>=0)nd.meetmomenten[idx]=nm;else nd.meetmomenten.push(nm);
  S.mm=nm;S.patData=nd;
  await saveData(S.patNr,nd);toonOk();
}
function startTest(id){
  const t=ALLE_TESTEN.find(x=>x.id===id);if(!t)return;
  if(t.isGALN||t.isKwal||t.isCriteria){S.checkW=S.mm?.testen?.[t.id]?.waarden||{};S.test=t;S.sc="checklist";render();}
  else if(t.isACLRSI){S.waarden=S.mm?.testen?.[t.id]?.waarden||{};S.test=t;S.sc="aclrsi";render();}
  else if(t.isHHD){S.waarden=S.mm?.testen?.hhd?.waarden||{};S.test=t;S.hhdStap=0;S.sc="hhd";render();}
  else if(t.isSLS){S.waarden=S.mm?.testen?.[t.id]?.waarden||{};S.checkW=S.mm?.testen?.[t.id]?.waarden?.checkW||{};S.test=t;S.stap=0;S.sc="sls";render();}
  else{S.waarden=S.mm?.testen?.[t.id]?.waarden||{};S.test=t;S.stap=0;S.sc="test";render();}
}
async function saveTest(terug){
  const notitie=document.getElementById("test-not")?.value||"";
  // Lees huidige invoervelden uit DOM voor opslaan
  document.querySelectorAll(".ft-input[onblur]").forEach(el=>{if(el.dataset&&el.dataset.id)S.waarden[el.dataset.id]=el.value.replace(",",".");});
  S.waarden._notitie=notitie;
  S.waarden=calcW(S.test.id,S.waarden);
  await persisteer(S.test.id,S.waarden);
  if(terug){S.sc="meetmoment";render();}else toonOk();
}
async function saveChecklist(terug){

async function saveACLRSI(terug){

async function saveHHD(terug){

async function saveSLS(terug){

// ─── PLANNING ACTIES ──────────────────────────────────────────────
async function laadOverzicht(){
  S.plLaden=true;renderPlanning();
  const rows=await dbList();
  S.plPatienten=[];
  for(const row of rows){
    try{
      const d=JSON.parse(row.value);
      if(!d.operatiedatum)continue;
      const nr=row.key.replace("vkb_","");
      const wekenNu=weeksSinceOp(d.operatiedatum);
      const planning=d.planning||{};
      const allItems=[];
      PERIODIEK_DEF.forEach(p=>{const gepland=addWeeks(d.operatiedatum,p.week);const gedaan=planning[p.id]?.gedaan||false;if(!gedaan)allItems.push({label:p.label,gepland,st:getMomentStatus(gepland,false)});});
      MIJLPALEN_DEF.forEach(m=>{const status=planning[m.id]||{};const mmGedaan=mijlpaalGedaanViaTest(d,m.id);const gedaan=status.gedaan||!!mmGedaan;const richtlijn=m.richtlijnWeek?addWeeks(d.operatiedatum,m.richtlijnWeek):null;const gepland=status.uitgesteldDatum||richtlijn;if(!gedaan&&gepland)allItems.push({label:m.kort,gepland,st:getMomentStatus(gepland,false)});});
      allItems.sort((a,b)=>a.gepland.localeCompare(b.gepland));
      const volgend=allItems[0];
      const urgentie=volgend?volgend.st:"groen";
      const naam=d.voornaam||"";
      S.plPatienten.push({nr,naam,been:d.been,opDatum:d.operatiedatum,wekenGeleden:wekenNu,volgendLabel:volgend?`Volgende: ${volgend.label} (${nlDatum(volgend.gepland)})`:"Alle testen gedaan",urgentie});
    }catch(e){}
  }
  S.plLaden=false;renderPlanning();
}
async function voegPatToe(){
  const nr=document.getElementById("pl-nr")?.value.trim();
  const naam=document.getElementById("pl-naam")?.value.trim();
  const opdat=document.getElementById("pl-opdat")?.value;
  const been=document.getElementById("pl-been")?.value;
  S.plFout="";
  if(!nr){S.plFout="Voer een patiëntnummer in.";renderPlanning();return;}
  if(!opdat){S.plFout="Voer een operatiedatum in.";renderPlanning();return;}
  let d=await loadData(nr)||{meetmomenten:[]};
  d.operatiedatum=opdat;d.been=been;if(naam)d.voornaam=naam;
  if(!d.planning)d.planning={};
  await saveData(nr,d);
  await laadOverzicht();
}

const VG_KLEUREN = ['#82176D', '#00B6E8', '#E8833A', '#2E9D5B', '#6B4FBB', '#C2185B'];
const VG_GROEPEN = [
  {id:'kracht', titel:'Kracht', uitleg:'Kracht van je geopereerde been, als percentage van je andere been (LSI).', een:'%', doel:90, doelLabel:'90%', lsi:true, lijnen:[

function vgData(g, tot){
  const ms = mmSorted(tot), op = S.patData?.operatiedatum, t0 = op || (ms[0] && ms[0].datum);
  const lijnen = g.lijnen.map((L, i) => ({...L, kleur:VG_KLEUREN[i % VG_KLEUREN.length], pts:ms.map(m => {
    const v = L.f ? L.f(m) : getal((waardenVan(m, L.t) || {})[L.k]);
    return v === null || v === undefined || isNaN(v) ? null : {x:dagenverschil(t0, m.datum) / 7, v:Number(v), datum:m.datum, wk:wkPostOp(m.datum)};
  }).filter(Boolean)})).filter(L => L.pts.length);

function vgSchaal(g, d){
  const alle = d.lijnen.flatMap(L => L.pts.map(p => p.v)).concat([g.doel]);
  let lo = g.lsi ? Math.min(60, Math.floor(Math.min(...alle) / 10) * 10) : 0, hi = g.lsi ? Math.max(110, Math.ceil(Math.max(...alle) / 10) * 10) : 100;
  const xs = d.lijnen.flatMap(L => L.pts.map(p => p.x)); let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if(x1 - x0 < 1){ x0 -= 1; x1 += 1; }
  const stap = (hi - lo) > 60 ? 20 : 10, ticks = []; for(let v = lo; v <= hi; v += stap) ticks.push(v);
  const xt = [...new Map(d.lijnen.flatMap(L => L.pts).map(p => [p.datum, p])).values()].sort((a,b) => a.x - b.x);
  return {lo, hi, x0, x1, ticks, xt};
}
const xLabel = (p, d) => d.metOp && p.wk !== null ? 'wk ' + p.wk : nlDatum(p.datum).slice(0, 5);
function vgSVG(g, d){
  const W = 460, H = 230, L = 38, R = 60, T = 12, B = 26, sc = vgSchaal(g, d);
  const X = x => L + (x - sc.x0) / (sc.x1 - sc.x0) * (W - L - R), Y = v => T + (1 - (v - sc.lo) / (sc.hi - sc.lo)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="vg-svg" role="img" aria-label="${esc(g.titel)}">`;
  s += `<rect x="${L}" y="${Y(sc.hi)}" width="${W - L - R}" height="${Y(g.doel) - Y(sc.hi)}" fill="#e7f6ec"/>`;
  sc.ticks.forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee6ec"/><text x="${L - 7}" y="${Y(v) + 4}" text-anchor="end" class="vg-ax">${v}${g.een}</text>`; });
  s += `<line x1="${L}" x2="${W - R}" y1="${Y(g.doel)}" y2="${Y(g.doel)}" stroke="#2E9D5B" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - R + 5}" y="${Y(g.doel) + 4}" class="vg-ax" fill="#2E9D5B" style="fill:#2E9D5B;font-weight:600">doel ${g.doelLabel}</text>`;
  let lastX = -99; sc.xt.forEach(p => { const x = X(p.x); if(x - lastX < 30) return; lastX = x; s += `<text x="${x}" y="${H - 9}" text-anchor="middle" class="vg-ax">${esc(xLabel(p, d))}</text>`; });
  d.lijnen.forEach(Ln => {
    if(Ln.pts.length > 1) s += `<polyline fill="none" stroke="${Ln.kleur}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${Ln.pts.map(p => X(p.x).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}"/>`;
    Ln.pts.forEach(p => { s += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="#fff" stroke="${Ln.kleur}" stroke-width="2.5"><title>${esc(Ln.l)} · ${esc(xLabel(p, d))}: ${Math.round(p.v)}${g.een}</title></circle>`; });
  });
  return s + '</svg>';
}
function vgLaatste(Ln){ const p = Ln.pts[Ln.pts.length - 1], q = Ln.pts[Ln.pts.length - 2]; return {p, delta:q ? p.v - q.v : null}; }
function renderVoortgang(){

      <div class="vg-legend">${d.lijnen.map(Ln => { const {p, delta} = vgLaatste(Ln); return `<span class="vg-chip"><i style="background:${Ln.kleur}"></i>${esc(Ln.l)} <b>${Math.round(p.v)}${g.een}</b>${delta !== null && Math.round(delta) !== 0 ? `<em class="${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '▲' : '▼'} ${Math.abs(Math.round(delta))}</em>` : ''}</span>`; }).join('')}</div></div>`).join('')}

function pdfGrafiek(doc, g, d, x, y, w, h, font){
  const L = 13, R = 16, T = 4, B = 8, sc = vgSchaal(g, d);
  const X = v => x + L + (v - sc.x0) / (sc.x1 - sc.x0) * (w - L - R), Y = v => y + T + (1 - (v - sc.lo) / (sc.hi - sc.lo)) * (h - T - B);
  doc.setFillColor(231, 246, 236); doc.rect(x + L, Y(sc.hi), w - L - R, Y(g.doel) - Y(sc.hi), 'F');
  sc.ticks.forEach(v => { doc.setDrawColor(238, 230, 236); doc.setLineWidth(0.2); doc.line(x + L, Y(v), x + w - R, Y(v)); font('normal', 7, [122,100,120]); doc.text(v + g.een, x + L - 2, Y(v) + 1.2, {align:'right'}); });
  doc.setDrawColor(46, 157, 91); doc.setLineWidth(0.45); doc.setLineDashPattern([1.6, 1.2], 0); doc.line(x + L, Y(g.doel), x + w - R, Y(g.doel)); doc.setLineDashPattern([], 0);
  font('bold', 7, [46,157,91]); doc.text('doel ' + g.doelLabel, x + w - R + 1.5, Y(g.doel) + 1.2);
  let lastX = -99; sc.xt.forEach(p => { const px = X(p.x); if(px - lastX < 10) return; lastX = px; font('normal', 7, [122,100,120]); doc.text(xLabel(p, d), px, y + h - 2, {align:'center'}); });
  d.lijnen.forEach(Ln => {
    const rgb = [1,3,5].map(i => parseInt(Ln.kleur.substr(i, 2), 16));
    doc.setDrawColor(...rgb); doc.setLineWidth(0.7);
    for(let i = 1; i < Ln.pts.length; i++) doc.line(X(Ln.pts[i-1].x), Y(Ln.pts[i-1].v), X(Ln.pts[i].x), Y(Ln.pts[i].v));
    Ln.pts.forEach(p => { doc.setFillColor(255,255,255); doc.setLineWidth(0.6); doc.circle(X(p.x), Y(p.v), 1.1, 'FD'); });
  });
  // legenda
  let lx = x + L, ly = y + h + 4;
  d.lijnen.forEach(Ln => {
    const {p} = vgLaatste(Ln), t = Ln.l + '  ' + Math.round(p.v) + g.een; font('normal', 8, [42,22,38]);
    const tw = doc.getTextWidth(t) + 8; if(lx + tw > x + w){ lx = x + L; ly += 5; }
    const rgb = [1,3,5].map(i => parseInt(Ln.kleur.substr(i, 2), 16)); doc.setFillColor(...rgb); doc.circle(lx + 1.3, ly - 1.1, 1.2, 'F');
    doc.text(t, lx + 4, ly); lx += tw;
  });
  return ly - y + 2;
}

/* ---------- testresultaten als tekst (voor de AI) ---------- */
function lsiOordeel(v, type, m){
  const d = LSI_DREMPEL[type]?.[faseVan(m)]; if(v === null) return '';
  if(d === null || d === undefined) return ' (geen LSI-eis in deze fase)';
  return v >= d ? ' (voldoet aan de eis van minimaal ' + d + '% voor deze fase)' : v >= d - 10 ? ' (iets onder de eis van ' + d + '% voor deze fase)' : ' (duidelijk onder de eis van ' + d + '% voor deze fase)';
}
function testRegels(t, m){
  const r = m.testen?.[t.id]; if(!r) return null;
  const w = waardenVan(m, t.id) || {}, nee = items => items.filter(i => w[i.id] === 'nee').map(i => i.label.toLowerCase()), ja = items => items.filter(i => w[i.id] === 'ja').length;
  let s = '- ' + t.naam + ': ';
  if(t.isGALN){ const n = nee(GALN_ITEMS); s += ja(GALN_ITEMS) + ' van de ' + GALN_ITEMS.length + ' kenmerken van een normaal looppatroon aanwezig' + (w.galn_normaal ? '; looppatroon genormaliseerd: ' + w.galn_normaal : '') + (n.length ? '; nog niet goed: ' + n.join('; ') : ''); }
  else if(t.isKwal){ const n = nee(t.items || []); s += ja(t.items || []) + ' van de ' + (t.items || []).length + ' kwaliteitskenmerken goed' + (n.length ? '; nog niet goed: ' + n.join('; ') : ''); }
  else if(t.isCriteria){ const ci = t.criteriaItems || []; s += ci.filter((c, i) => w['crit_' + i] === 'ja').length + ' van de ' + ci.length + ' criteria behaald' + (ci.some((c, i) => w['crit_' + i] === 'nee') ? '; nog niet behaald: ' + ci.filter((c, i) => w['crit_' + i] === 'nee').map(c => c.replace(/\?$/, '').toLowerCase()).join('; ') : ''); }
  else if(t.isACLRSI){ const sc = berekenACLRSI(r.waarden || {}); if(sc === null) return null; s += 'score ' + sc + ' van 100 (vanaf 72 mentaal klaar voor de sport, 56–72 twijfelachtig, onder 56 nog niet klaar)'; }
  else if(t.isSLS){ const cw = (r.waarden || {}).checkW || {}; const n = SLS_ITEMS.filter(i => cw[i.id] === 'nee').map(i => i.label.toLowerCase());
    s += 'niet-geopereerde been ' + (w.sls_niet || '-') + ' herhalingen, geopereerde been ' + (w.sls_aan || '-') + ' herhalingen in 1 minuut (norm: meer dan 22)' + (n.length ? '; kwaliteit nog niet goed: ' + n.join('; ') : ''); }
  else {
    const delen = t.velden.map(v => {
      const val = getal(w[v.id]); if(val === null && !(v.sel && w[v.id])) return null;
      if(v.sel){ const o = (v.opties || []).find(x => x[0] === w[v.id]); return v.label + ': ' + (o ? o[1] : w[v.id]); }
      let x = v.label + ': ' + (Math.round(val * 10) / 10) + (v.een ? ' ' + v.een : '');
      if(v.lsiType) x += lsiOordeel(val, v.lsiType, m);
      if(v.isHopSpot) x += ' (' + hopSpotKleur(val).label.toLowerCase() + ')';
      if(v.isPlank) x += ' (' + plankKleur(val).label.toLowerCase() + ')';
      return x;
    }).filter(Boolean);
    if(t.isRoeien && w.roei_tijd){ const k = roeiKleur(w.roei_tijd); delen.unshift('tijd ' + w.roei_tijd + (k ? ' (' + k.label.toLowerCase() + ')' : '')); }
    if(!delen.length) return null;
    s += delen.join(', ');
  }
  if(r.notitie) s += ' | notitie therapeut: ' + r.notitie;
  return s;
}
function hhdRegel(m){
  const w = waardenVan(m, 'hhd'); if(!w) return null;
  const d = [];
  if(getal(w.hhd_quad_aan) !== null) d.push('quadriceps geopereerde been ' + w.hhd_quad_aan + ' kg, andere been ' + (w.hhd_quad_niet || '-') + ' kg' + (getal(w.hhd_quad_lsi) !== null ? ', LSI ' + Math.round(getal(w.hhd_quad_lsi)) + '%' + lsiOordeel(getal(w.hhd_quad_lsi), 'kracht', m) : ''));
  if(getal(w.hhd_ham_aan) !== null) d.push('hamstrings geopereerde been ' + w.hhd_ham_aan + ' kg, andere been ' + (w.hhd_ham_niet || '-') + ' kg' + (getal(w.hhd_ham_lsi) !== null ? ', LSI ' + Math.round(getal(w.hhd_ham_lsi)) + '%' + lsiOordeel(getal(w.hhd_ham_lsi), 'kracht', m) : ''));
  if(getal(w.hhd_hq) !== null) d.push('verhouding hamstrings/quadriceps geopereerde been ' + Math.round(getal(w.hhd_hq)) + '%');

}
function mmTekst(m){
  const ids = Object.keys(m.testen || {});
  const regels = ALLE_TESTEN.filter(t => ids.includes(t.id)).map(t => t.isHHD ? hhdRegel(m) : testRegels(t, m)).filter(Boolean);
  const crit = m.type === 'fase' ? (FASE_CRITERIA[m.refId] || []) : [], cj = crit.filter(c => m.criteria?.[c] === 'ja'), cn = crit.filter(c => m.criteria?.[c] === 'nee');
  const wk = wkPostOp(m.datum);
  return 'TESTMOMENT ' + nlDatum(m.datum) + ' | ' + m.naam + (wk !== null ? ' | week ' + wk + ' na de operatie' : '') +
    (cj.length || cn.length ? '\nCriteria van deze fase: ' + cj.length + ' van de ' + crit.length + ' behaald' + (cn.length ? '; nog niet behaald: ' + cn.map(c => c.replace(/\?$/, '')).join('; ') : '') : '') +
    '\n' + (regels.length ? regels.join('\n') : '(geen testresultaten ingevuld)');
}

/* ---------- AI-tekst opschonen en controleren ---------- */
function cleanAi(t){ return String(t || '').replace(/\r/g, '').split('\n').map(l => l.replace(/^\s*#{1,6}\s*/, '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1').replace(/^\s*[-•–]\s+/, '* ').replace(/^\s*\*\s+/, '* ').replace(/\s+$/, '')).join('\n').replace(/\n{3,}/g, '\n\n').trim(); }
function isHeadingLine(l){ const s = l.trim(); return s && s.length < 60 && !/[.:!?]$/.test(s) && !s.startsWith('*') && !/^\d/.test(s); }
function stripMarks(t){ return String(t || '').replace(/\[B\]\s*/g, ''); }
const AI_BANNED = [[/\bzwabber\w*/i, 'zwabberen'], [/\bkuitmeter\w*/i, 'kuitmeter'], [/\bbenedenlichaam\w*/i, 'benedenlichaam'], [/\buithouding\b/i, 'uithouding']];
const bannedIn = t => AI_BANNED.filter(([re]) => re.test(t)).map(x => x[1]);
const PHYSITRACK_ZIN = '* Op basis van je testresultaten krijg je via Physitrack een oefenschema, zodat je thuis gericht aan de slag kunt.';
function fixAi(t){
  t = cleanAi(t).replace(/^(\*\s+)\s*\[\s*b\s*\]\s*/gim, '$1[B] ').replace(/\b([Uu])ithouding\b/g, (m, u) => u + 'ithoudingsvermogen');
  if(!/physitrack/i.test(t)){ const L = t.split('\n'), i = L.findIndex(l => /^aan de slag$/i.test(l.trim())); if(i >= 0){ let j = i + 1; while(j < L.length && !L[j].trim()) j++; L.splice(j, 0, PHYSITRACK_ZIN); } else L.push('', 'Aan de slag', PHYSITRACK_ZIN); t = L.join('\n'); }
  return t;
}
const LOAD_RE = /(opbouw|opbouwen|bouw\w* .{0,40}\bop\b|belast|wandel|hardlo|loop|fiets|sport|train\w* .{0,20}(per week|keer|minuten)|afstand|kilometer|\bkm\b|minuten|uur per|rust|pijngrens|pijn|werk|hervat|frequentie|per week|dagelijks|intensiteit|wedstrijd|springen|spring)/i;
const normAdv = l => stripMarks(l).replace(/^\s*\*\s+/, '').replace(/\s+/g, ' ').trim();
const advFrom = t => String(t || '').split('\n').filter(l => /\[B\]/.test(l)).map(normAdv);
function loadItems(t, adv){
  const set = new Set((adv || []).map(normAdv)), L = String(t || '').split('\n'); let sec = '';
  return L.map((l, i) => { if(isHeadingLine(l)) sec = l.trim().toLowerCase(); return {i, l, sec}; })
    .filter(x => x.l.trim() && !isHeadingLine(x.l) && (/\[B\]/.test(x.l) || set.has(normAdv(x.l)) || (x.sec === 'aan de slag' && /^\s*\*\s/.test(x.l) && LOAD_RE.test(x.l) && !/physitrack/i.test(x.l))));
}
function aiTextHTML(t){ return esc(stripMarks(cleanAi(t))).split('\n').map(l => isHeadingLine(l) ? '<span class="h">' + l + '</span>' : l).join('\n'); }

/* ---------- prompts ---------- */
function buildPrompt(m, context){
  const ms = mmSorted(m.datum), eerder = ms.filter(x => x.mmId !== m.mmId);
  const been = (S.patData?.been || S.been || '').toLowerCase(), wk = wkPostOp(m.datum);
  return `Je bent een fysiotherapeut bij Fyzio Totaal en schrijft een persoonlijk testverslag voor een patiënt die revalideert na een voorste kruisbandreconstructie (VKB). Het verslag gaat over het testmoment van ${nlDatum(m.datum)} (${m.naam}) en laat ook de voortgang ten opzichte van eerdere testmomenten zien.

HARDE REGEL - GEEN VERZONNEN RESULTATEN:
Gebruik uitsluitend de testresultaten hieronder. Verzin NOOIT een score, percentage, afstand, aantal of observatie voor een test die daar niet in staat. Schrijf alleen over onderdelen die daadwerkelijk getest zijn. Dit is de belangrijkste regel en gaat boven alle stijlvoorkeuren.

TAAL EN STIJL:
- Informeel, jij-vorm ("je/jij"), nooit "u". Warm maar nuchter en compact.
- SCHRIJF ZOALS DE THERAPEUT HET ZELF IN DE BEHANDELKAMER ZOU ZEGGEN: natuurlijke, lopende zinnen. Wissel de zinsbouw af; begin niet elke zin met "Je" of met de testnaam. Hooguit één of twee getallen per zin.
- Correct Nederlands, geen Engelse woorden waar een goed Nederlands alternatief bestaat. Geen spreektaal als "qua".
- SPELLING EN GRAMMATICA: controleer elke zin. Let speciaal op de buigings-e bij bijvoeglijke naamwoorden, ook in de vergrotende trap ("een sterkere quadriceps", "een stabielere knie"), op d/t en op enkelvoud/meervoud.
- WOORDKEUS: alleen bestaande woorden die een fysiotherapeut hardop zou zeggen. Schrijf "uithoudingsvermogen", nooit "uithouding". Nooit "zwabberen", "wiebelen", "kuitmeter" of "benedenlichaam". Verzin geen samenstellingen of namen voor testen.
- TESTNAMEN: gebruik de testnaam zoals die in de resultaten staat (bijv. "Single Leg Hop for Distance", "Triple Hop for Distance", "Side Hop Test", "ACL-RSI") en leg daarna in gewone taal uit wat de test meet.
- Behoud correcte medische termen waar dat gepast is ("quadriceps", "hamstrings", "voorste kruisband"). Vertaal alleen termen die echt niets zeggen (niet "valgus" maar "je knie zakt naar binnen", niet "hydrops" maar "vocht in je knie").
- "Niet-aangedaan" is het niet-geopereerde been; "aangedaan" is het geopereerde been (${been || 'onbekend'}). Gebruik in de tekst "je geopereerde been" of "je ${been === 'links' ? 'linker' : been === 'rechts' ? 'rechter' : ''}been", en verwissel links en rechts nooit.
- LSI uitleggen in gewone taal: "je geopereerde been haalt 84% van de kracht van je andere been".
- Geen gedachtestreepjes als opsommingsteken of in de lopende tekst.
- OPMAAK: gewone platte tekst. NOOIT markdown: geen hekjes, geen dubbele sterretjes, geen liggende streepjes als opsomming. Kopjes zijn losse regels zonder leesteken aan het eind. Alleen de opsommingen bij "Belangrijkste punten" en "Aan de slag" beginnen met een asterisk en een spatie (* ).
- Geen medische diagnoses of risico's toevoegen, geen nocebo-taal (niet "kans op een nieuwe scheur"). Leg geen oorzakelijke verbanden die niet uit de gegevens of de context blijken.
- VERBANDEN EN VERBINDINGSWOORDEN: "maar" alleen bij een echte tegenstelling, "dus" alleen als het volgende werkelijk uit het voorgaande volgt, "en" alleen om gelijkwaardige zaken te verbinden. Trek een conclusie als de resultaten die ondersteunen. Is een verband aannemelijk maar niet aangetoond, formuleer het dan voorzichtig ("kan leiden tot", "kan erop wijzen", "past bij"). Gebruik "dus", "geeft aan dat" of "komt door" alleen als de resultaten het verband echt aantonen.
- Gele en rode vlaggen, interne criteria-namen en vaktermen uit checklists neem je niet letterlijk over; vertaal ze naar wat het voor de patiënt betekent.
- Bij een jongere: motiverend en eenvoudig.

NORMEN EN FASES:
- Achter LSI-waarden staat of ze voldoen aan de eis voor deze fase. Maak per test in een lopende zin duidelijk hoe de patiënt ervoor staat ten opzichte van die eis. Noem alleen normen die in de resultaten staan; verzin er geen.
- Behaalde criteria mag je positief benoemen als stap richting de volgende fase; niet-behaalde criteria formuleer je als waar we nu aan werken. Beloof geen termijn voor terugkeer naar de sport.
- ACL-RSI: vanaf 72 ben je mentaal klaar voor je sport; benoem een lagere score begripvol, als iets waar we samen aandacht aan geven.

VOORTGANG:
${eerder.length ? '- Er zijn ' + eerder.length + ' eerdere testmomenten. Beschrijf concreet wat er sinds de vorige keer en sinds het begin is verbeterd, wat gelijk is gebleven en wat nog aandacht vraagt. Gebruik daarbij de echte getallen (bijv. "van 68% naar 84%"). Wees eerlijk maar bemoedigend.' : '- Dit is het eerste testmoment; er is nog geen verloop te beschrijven. Leg uit dat dit de uitgangssituatie is waar we de volgende metingen mee vergelijken.'}
- Onder het verslag staan in de PDF grafieken van de LSI en de ACL-RSI. Je mag daar kort naar verwijzen ("in de grafieken zie je...").

ADVIESTOON:
- Goed is goed: als een score aan de eis voldoet, benoem dat positief zonder vervolgadvies voor dat onderdeel.
- Aandachtspunten formuleer je als kansen met een concrete richting, nooit als tekortkomingen.

PATIËNT:
Voornaam: ${S.voornaam || S.patData?.voornaam || ''} | Geopereerde been: ${been || 'onbekend'}${S.patData?.operatiedatum ? ' | Operatiedatum: ' + nlDatum(S.patData.operatiedatum) + (wk !== null ? ' (nu week ' + wk + ')' : '') : ''}
${context ? 'Context van de therapeut: ' + context : ''}

TESTRESULTATEN (de ENIGE gegevens die je mag gebruiken; het laatste testmoment is het moment waar dit verslag over gaat):
${ms.map(mmTekst).join('\n\n')}

STRUCTUUR - volg dit patroon:

Testverslag ${S.voornaam || S.patData?.voornaam || ''} — ${nlDatum(m.datum)}

Waar sta je nu
[2 tot 3 zinnen: welke fase van de revalidatie, hoeveel weken na de operatie, en de hoofdlijn van dit testmoment.]

Maak daarna per getest onderdeel een eigen kopje, alleen voor onderdelen die in de resultaten voorkomen, bijvoorbeeld: Beweeglijkheid en zwelling, Looppatroon, Kracht, Springen en landen, Vertrouwen in je knie, Conditie. Beschrijf per onderdeel de scores, de vergelijking met de eis en eventueel advies in dezelfde alinea.
${eerder.length ? '\nJe voortgang\n[2 tot 4 zinnen over het verloop sinds de eerdere testmomenten.]\n' : ''}
Belangrijkste punten
Opsomming waarbij elke regel begint met een asterisk en een spatie (* ). 3 tot 5 volledige zinnen, een mix van sterke punten en aandachtspunten als kansen.

Aan de slag
Concrete actielijst, elke actie begint met een asterisk en een spatie (* ). 2 tot 4 uitvoerbare acties op basis van de testresultaten.
- De eerste actie is altijd: op basis van je testresultaten krijg je via Physitrack een oefenschema. Bedenk geen eigen oefenprogramma; noem hooguit kort waar het schema zich op richt.
- ADVIEZEN OVER BELASTING: elk advies over belasting of belastbaarheid (bijv. hardlopen, springen of sporten opbouwen, afstand, duur, frequentie, rust, werk, omgaan met pijn of zwelling) begin je met de markering [B] direct na de asterisk, dus "* [B] ...". De therapeut controleert deze adviezen voordat het verslag naar de patiënt gaat. Geef zo'n advies alleen als het aansluit bij de context van de therapeut en verzin geen getallen of schema's.

Maximaal 600 woorden. Schrijf in het Nederlands, in platte tekst zonder markdown. Zorg dat elke sectie volledig is afgerond.`;
}
function buildReviewPrompt(tekst, m, context){
  return `Je bent een zorgvuldige Nederlandse eindredacteur met kennis van fysiotherapie. Hieronder staat een concept-testverslag voor een patiënt van Fyzio Totaal die revalideert na een voorste kruisbandreconstructie, met de testgegevens waarop het gebaseerd is. Controleer het verslag en verbeter het waar nodig.

Controleer zin voor zin:
1. Spelling en grammatica. Let vooral op de buigings-e bij bijvoeglijke naamwoorden, ook in de vergrotende trap, op d/t, op enkelvoud/meervoud en op aaneengeschreven samenstellingen.
2. Woordkeus. Alleen bestaande, gangbare Nederlandse woorden die een fysiotherapeut hardop tegen een patiënt zou zeggen. Vervang "uithouding" door "uithoudingsvermogen". Nooit "zwabberen", "kuitmeter" of "benedenlichaam". Herschrijf stijve of krom lopende zinnen tot natuurlijk Nederlands.
3. Verbanden. Volgt elk oorzakelijk verband uit de testgegevens of de context? Is het aannemelijk maar niet aangetoond, formuleer het dan voorzichtig ("kan leiden tot", "kan erop wijzen", "past bij"). Is het niet aannemelijk, schrap het. "Maar" alleen bij een echte tegenstelling, "dus" alleen als het volgende werkelijk uit het voorgaande volgt.
4. Feiten. Elk getal, elk percentage, elke vergelijking met een eerder testmoment, het geopereerde been en elke norm moet kloppen met de testgegevens. Herstel afwijkingen en verwijder alles wat er niet in staat.
5. Onder "Aan de slag" staat als eerste actie dat de patiënt op basis van de testresultaten via Physitrack een oefenschema krijgt.
6. Elk advies over belasting of belastbaarheid begint met "[B] " direct na de asterisk. Voeg die markering toe waar ze ontbreekt en laat bestaande markeringen staan.

Verander niets wat niet nodig is: behoud de toon, de structuur, de kopjes en de opsommingen met "* ". Geef ALLEEN het verbeterde verslag terug, in platte tekst zonder markdown en zonder toelichting.

${context ? 'CONTEXT VAN DE THERAPEUT: ' + context + '\n\n' : ''}GEOPEREERDE BEEN: ${(S.patData?.been || S.been || 'onbekend').toLowerCase()}

TESTGEGEVENS:
${mmSorted(m.datum).map(mmTekst).join('\n\n')}

CONCEPT-VERSLAG:
${tekst}`;
}
async function callClaude(key, prompt){
  const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-5', max_tokens:2800, messages:[{role:'user', content:prompt}]})});
  const j = await r.json(); if(!r.ok) throw new Error(j.error?.message || r.status);
  return (j.content || []).map(c => c.text || '').join('');
}

function lcUpdate(){

function loadOk(){
  const P = LOADCHECK; if(!P) return;
  const L = P.tekst.split('\n'), drop = new Set(), adv = [];

async function sharePdf(doc, name, extra){
  const file = new File([doc.output('blob')], name, {type:'application/pdf'});
  if(!(navigator.canShare && navigator.canShare({files:[file]}))) return 'unsupported';

    PENDING_SHARE = data;
    openModal2(`<h2>De PDF staat klaar</h2><p>Tik op de knop om het deelmenu te openen${extra && extra.text ? ' en kies je mail-app' : ''}.</p><div class="m-actions"><button class="ft-btn-s" onclick="closeModal2()">Annuleren</button><button class="ft-btn-p" onclick="sharePending()">${extra && extra.text ? '📧 Open mail' : '📤 Delen / bewaren'}</button></div>`);

function mailTekst(voornaam, datum){
  return {subject:'Je testverslag van Fyzio Totaal',
    body:'Hoi ' + voornaam + ',\n\nIn de bijlage vind je het verslag van je testmoment van ' + datum + '. Je leest hierin hoe je scoorde, hoe je je sinds de vorige metingen hebt ontwikkeld en waar we de komende tijd samen aan gaan werken. Je oefenschema ontvang je via Physitrack.\n\nHeb je vragen over het verslag? Stel ze gerust tijdens je volgende afspraak of neem contact met ons op.\n\nMet sportieve groet,'};
}
function uploadNaarDrive(doc, bestandsnaam){
  if(!DRIVE_UPLOAD_URL) return false;
  try{ const b64 = doc.output('datauristring').split(',')[1]; fetch(DRIVE_UPLOAD_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({bestandsnaam, pdfBase64:b64})}).catch(() => {}); return true; } catch(e){ return false; }
}
let LOGO = null;
async function loadLogo(){
  if(LOGO !== null) return LOGO;
  try{
    const r = await fetch('logo.png'); if(!r.ok) throw 0;
    const data = await new Promise(async res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(await r.blob()); });
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = data; });
    const c = document.createElement('canvas'), sc = Math.min(1, 600 / img.naturalWidth); c.width = img.naturalWidth * sc; c.height = img.naturalHeight * sc;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    LOGO = {data:c.toDataURL('image/jpeg', 0.9), ar:img.naturalWidth / img.naturalHeight};
  } catch(e){ LOGO = false; }
  return LOGO;
}

/* ---------- PDF ---------- */
async function aiPdf(tekst, m, mode){
  if(!tekst){ toast('Er is nog geen tekst', true); return; }
  const win = mode === 'mail' && !IS_TOUCH ? window.open('', '_blank') : null;
  try{
    if(!window.jspdf) throw new Error('PDF-bibliotheek niet geladen, controleer de internetverbinding');
    const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:'mm', format:'a4'});
    const ps = x => String(x).replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/→/g,'->').replace(/−/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g, "'");
    const _text = doc.text.bind(doc); doc.text = (t, ...a) => _text(Array.isArray(t) ? t.map(ps) : ps(t), ...a);
    const _split = doc.splitTextToSize.bind(doc); doc.splitTextToSize = (t, ...a) => _split(ps(t), ...a);
    const W = 210, H = 297, M = 18, CW = W - 2*M, BOTTOM = H - 20;
    const PUR = [130,23,109], CY = [0,182,232], TXT = [42,22,38], MUT = [122,100,120], LINE = [226,213,223], SOFT = [248,243,247];
    const font = (st, sz, col) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(...(col || TXT)); };
    const logo = await loadLogo(), voornaam = S.voornaam || S.patData?.voornaam || '', datum = nlDatum(m.datum), wk = wkPostOp(m.datum);
    if(logo){ try{ doc.addImage(logo.data, 'JPEG', M, 12, 11 * logo.ar, 11); } catch(e){} }
    font('bold', 17, PUR); doc.text('Testverslag', W - M, 18, {align:'right'});
    font('normal', 9, MUT); doc.text('Revalidatie voorste kruisband', W - M, 23.5, {align:'right'});
    doc.setFillColor(...PUR); doc.rect(M, 29, CW * 0.72, 1.1, 'F'); doc.setFillColor(...CY); doc.rect(M + CW * 0.72, 29, CW * 0.28, 1.1, 'F');
    let y = 36;
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, 17, 3, 3, 'F');
    [['Naam', voornaam || '-'], ['Testdatum', datum], ['Geopereerde been', S.patData?.been || S.been || '-'], ['Na de operatie', wk !== null ? 'week ' + wk : '-']].forEach(([l, v], i) => {
      const x = M + 6 + i * (CW - 8) / 4; font('bold', 7, MUT); doc.text(l.toUpperCase(), x, y + 6.5); font('bold', 10.5); doc.text(doc.splitTextToSize(String(v), (CW - 8) / 4 - 4)[0], x, y + 12.5);
    });
    y += 27;
    const newPage = () => { doc.addPage(); y = 24; };
    // tekst in hoofdstukken; een hoofdstuk dat niet meer past begint op een nieuwe pagina
    const lines = tekst.split('\n'); if(lines.length && /^testverslag/i.test(lines[0].trim())) lines.shift();
    const secs = []; let cur = [];
    lines.forEach(l => { if(isHeadingLine(l) && cur.some(x => x.trim())){ secs.push(cur); cur = []; } cur.push(l); }); if(cur.some(x => x.trim())) secs.push(cur);
    const isBul = l => /^\*\s/.test(l);
    const lineH = l => { if(!l.trim()) return 2.5; if(isHeadingLine(l)) return 9; font('normal', 10.5); const b = isBul(l); return doc.splitTextToSize(b ? l.replace(/^\*\s/, '') : l, CW - (b ? 6 : 0)).length * 5.2 + (b ? 1 : 1.5); };
    const heading = t => { if(y + 16 > BOTTOM) newPage(); y += 2; doc.setFillColor(...PUR); doc.rect(M, y - 4.4, 1.5, 5.8, 'F'); font('bold', 12.5, PUR); doc.text(t, M + 4, y); y += 7; };
    const drawLine = line => {
      if(!line.trim()){ y += 2.5; return; }
      if(isHeadingLine(line)){ heading(line.trim()); return; }
      const b = isBul(line); font('normal', 10.5);
      doc.splitTextToSize(b ? line.replace(/^\*\s/, '') : line, CW - (b ? 6 : 0)).forEach((w, k) => {
        if(y > BOTTOM){ newPage(); font('normal', 10.5); }
        if(b && k === 0){ doc.setFillColor(...PUR); doc.circle(M + 1.6, y - 1.3, 0.9, 'F'); }
        doc.text(w, M + (b ? 6 : 0), y); y += 5.2;
      });
      y += b ? 1 : 1.5;
    };
    secs.forEach(sec => {
      const s = sec.slice(); while(s.length && !s[s.length-1].trim()) s.pop();
      const h = s.reduce((a, l) => a + lineH(l), 0) - 2;
      if(y + h > BOTTOM){ if(h <= BOTTOM - 24) newPage(); else if(y + lineH(s[0]) + (s[1] ? lineH(s[1]) : 0) > BOTTOM) newPage(); }
      sec.forEach(drawLine);
    });
    // grafieken (alleen metingen tot en met dit testmoment); elke grafiek blijft heel
    const blokken = VG_GROEPEN.map(g => ({g, d:vgData(g, m.datum)})).filter(x => x.d.lijnen.length);
    if(blokken.length){
      const gh = 46, blokH = b => 14 + gh + 6 + Math.ceil(b.d.lijnen.length / 3) * 5 + 6;
      if(y + 18 + blokH(blokken[0]) > BOTTOM) newPage(); else y += 4;
      heading('Je voortgang in grafieken');
      font('normal', 9.5, MUT); doc.splitTextToSize((S.patData?.operatiedatum ? 'Onderaan staat het aantal weken na je operatie. ' : '') + 'Het groene vlak is het doel. Bij kracht en springen geldt: hoe dichter bij 100%, hoe meer je geopereerde been gelijk is aan je andere been.', CW).forEach(w => { doc.text(w, M, y); y += 4.6; });
      y += 3;
      blokken.forEach(b => {
        if(y + blokH(b) > BOTTOM) newPage();
        font('bold', 11, TXT); doc.text(b.g.titel, M, y); font('normal', 8.5, MUT); doc.text(b.g.uitleg, M, y + 4.5); y += 8;
        y += pdfGrafiek(doc, b.g, b.d, M, y, CW, gh, font) + 6;
      });
    }
    const n = doc.getNumberOfPages();
    for(let i = 1; i <= n; i++){
      doc.setPage(i);
      if(i > 1){ if(logo){ try{ doc.addImage(logo.data, 'JPEG', M, 8, 6.5 * logo.ar, 6.5); } catch(e){} } font('normal', 8, MUT); doc.text('Testverslag ' + voornaam, W - M, 13, {align:'right'}); doc.setFillColor(...LINE); doc.rect(M, 17, CW, 0.3, 'F'); }
      doc.setFillColor(...LINE); doc.rect(M, H - 13, CW, 0.3, 'F'); font('normal', 7.5, MUT);
      doc.text('Fyzio Totaal  ·  Nijverheidsstraat 7, Wierden', M, H - 8.5); doc.text('Pagina ' + i + ' van ' + n, W - M, H - 8.5, {align:'right'});
    }
    const name = 'Testverslag_VKB_' + (voornaam || 'patient').replace(/\W+/g, '_') + '_' + S.patNr + '_' + datum + '.pdf';
    const drive = uploadNaarDrive(doc, name), dTxt = drive ? ' en naar de Drive verstuurd' : '';
    if(mode === 'mail'){
      const mt = mailTekst(voornaam, datum);
      if(IS_TOUCH){ const r = await sharePdf(doc, name, {title:mt.subject, text:mt.body}); if(r === 'shared') toast('PDF gedeeld' + dTxt); if(r !== 'unsupported') return; }
      doc.save(name);
      const gmail = 'https://mail.google.com/mail/?view=cm&fs=1&su=' + encodeURIComponent(mt.subject) + '&body=' + encodeURIComponent(mt.body);
      const mailto = 'mailto:?subject=' + encodeURIComponent(mt.subject) + '&body=' + encodeURIComponent(mt.body);
      if(win) win.location.href = gmail; else window.open(gmail, '_blank');
      openModal2(`<h2>📧 Bijna klaar</h2><p>De PDF <b>${esc(name)}</b> is gedownload${dTxt} en er staat een mail met begeleidende tekst klaar in Gmail.</p><p><b>Nog doen:</b> vul het e-mailadres van ${esc(voornaam || 'de patiënt')} in, sleep de PDF uit je downloads in de mail (of klik op de paperclip) en verstuur.</p><p class="small" style="color:${C.muted}">Gebruik je een ander mailprogramma? <a href="${esc(mailto)}">Open in je standaard mail-app</a>.</p><div class="m-actions"><button class="ft-btn-p" onclick="closeModal2()">Sluiten</button></div>`);
      return;
    }
    if(IS_IOS){ const r = await sharePdf(doc, name); if(r === 'shared') toast('PDF gedeeld' + dTxt); if(r !== 'unsupported') return; }
    doc.save(name);
    toast('PDF gedownload' + dTxt);
  } catch(e){ if(win) win.close(); console.error(e); toast('PDF maken mislukt: ' + e.message, true); }
}

render();
</script>
