<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schouderrapportage – Fyzio Totaal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', 'Segoe UI', sans-serif; background: #f3eef2; min-height: 100vh; color: #1a1a1a; }

    .wrap { max-width: 680px; margin: 0 auto; }

    /* ── Hero ── */
    .hero {
      position: relative;
      background: linear-gradient(120deg, #4a0f42 0%, #82176D 45%, #a8368f 100%);
      padding: 36px 28px 40px;
      text-align: center;
      color: #fff;
      overflow: hidden;
    }
    .hero::after { content:''; position:absolute; bottom:0; left:0; right:0; height:4px; background:#00B6E8; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
      padding: 7px 16px; border-radius: 20px; margin-bottom: 18px; color: #fff;
    }
    .hero-ring {
      width: 68px; height: 68px; border-radius: 50%;
      background: #fff; border: 3px solid #00B6E8;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    .hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; letter-spacing: -0.3px; }
    .hero p { font-size: 13px; color: rgba(255,255,255,0.78); margin-bottom: 16px; }
    .hero-pill {
      display: inline-block; background: #00B6E8;
      color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; padding: 7px 18px; border-radius: 20px;
    }

    /* ── API bar ── */
    .api-bar {
      background: #fff; border-bottom: 1px solid #e2d5df;
      padding: 10px 20px; display: flex; align-items: center; gap: 10px;
    }
    .api-bar label { font-size: 12px; font-weight: 600; color: #82176D; white-space: nowrap; }
    .api-bar input {
      flex: 1; font-family: 'Poppins', sans-serif; font-size: 13px;
      border: 1px solid #d8c7d4; border-radius: 8px; padding: 6px 10px; color: #1a1a1a; outline: none;
    }
    .api-bar input:focus { border-color: #82176D; }
    .api-bar .save-btn {
      font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600;
      padding: 6px 14px; border-radius: 8px; border: none;
      background: linear-gradient(120deg, #4a0f42, #82176D);
      color: #fff; cursor: pointer; white-space: nowrap;
    }
    .api-saved { font-size: 12px; color: #aaa; }
    .api-change {
      font-size: 11px; padding: 4px 10px; border-radius: 6px;
      border: 1px solid #d8c7d4; background: #fff; color: #82176D; cursor: pointer;
    }

    /* ── Body ── */
    .body { padding: 24px 20px 48px; }

    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.4px; color: #82176D; margin-bottom: 10px; display: block;
    }
    .section { margin-bottom: 18px; }

    /* ── Cards ── */
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 2px 14px rgba(130,23,109,0.07);
      padding: 16px 18px; overflow: hidden;
    }

    select, textarea, input[type=text] {
      width: 100%; font-family: 'Poppins', sans-serif;
      font-size: 13.5px; color: #1a1a1a; background: transparent;
      border: none; outline: none; line-height: 1.6;
    }
    select { cursor: pointer; }
    textarea { resize: vertical; }

    /* ── Fields ── */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      font-size: 11.5px; font-weight: 600; color: #82176D;
      margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
    }
    .tag-req  { font-size: 10px; background: #f3e3ef; color: #82176D; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .tag-mis  { font-size: 10px; background: #fde8f4; color: #c0328a; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .tag-opt  { font-size: 10px; background: #f0f0f0; color: #999;    padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .field-input {
      background: #faf7fb; border-radius: 10px;
      border: 1px solid #e2d5df; padding: 9px 13px;
    }
    .field-input.missing { border-color: #f5b8d8; background: #fdf5fa; }

    /* ── Warning ── */
    .warning {
      font-size: 13px; color: #7a4f00; margin-bottom: 14px;
      padding: 10px 14px; background: #fff8e6;
      border-radius: 10px; border: 1px solid #f0d080;
    }
    .error-msg {
      font-size: 13px; color: #82176D; margin-bottom: 12px;
      padding: 10px 14px; background: #fdf0f7;
      border-radius: 10px; border: 1px solid #e8c2da;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 13px 0;
      font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700;
      border: none; border-radius: 12px;
      background: linear-gradient(120deg, #4a0f42 0%, #82176D 100%);
      color: #fff; cursor: pointer; letter-spacing: 0.3px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.91; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      width: 100%; padding: 11px 0;
      font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 600;
      border: 1.5px solid #d8c7d4; border-radius: 12px;
      background: #fff; color: #82176D; cursor: pointer; transition: background 0.15s;
    }
    .btn-secondary:hover { background: #f8f0f6; }

    /* ── Result ── */
    .result-card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 2px 14px rgba(130,23,109,0.08);
      overflow: hidden; margin-bottom: 18px;
    }
    .result-header {
      background: linear-gradient(120deg, #4a0f42 0%, #82176D 100%);
      padding: 11px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .result-header span { font-size: 13px; font-weight: 600; color: #fff; }
    .result-btns { display: flex; gap: 6px; }
    .result-btn {
      font-family: 'Poppins', sans-serif; font-size: 11.5px; font-weight: 600;
      padding: 5px 14px; border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.13); color: #fff; cursor: pointer; transition: background 0.15s;
    }
    .result-btn:hover { background: rgba(255,255,255,0.25); }
    .result-btn.editing { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.85); }
    .result-body {
      padding: 18px 20px; font-size: 13.5px; line-height: 1.8;
      color: #1a1a1a; white-space: pre-wrap;
      font-family: 'Poppins', sans-serif;
    }
    .result-edit {
      width: 100%; min-height: 230px; font-size: 13.5px; line-height: 1.8;
      color: #1a1a1a; font-family: 'Poppins', sans-serif;
      padding: 18px 20px; border: none; outline: none;
      resize: vertical; background: #faf7fb; display: block;
    }

    .badge-ready {
      display: inline-block; font-size: 10.5px; font-weight: 700;
      padding: 4px 12px; border-radius: 20px;
      background: #dcf4fb; color: #00728e;
      letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px;
    }
    .divider { height: 1px; background: #e2d5df; margin: 18px 0; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 15px; height: 15px;
      border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState } = React;

  const TYPEN = [
    "Huisarts – vraag over mogelijke medische interventie",
    "Huisarts – verzoek beoordeling/verwijzing orthopeed",
    "Orthopeed – vraag indicatie doorverwijzing",
    "Orthopeed – evaluatie na conservatief traject",
    "Orthopeed – postoperatief voortgangsverslag",
    "Tussenevaluatie langdurig traject",
    "Spoed / afwijkend beloop",
  ];

  const VELDEN = [
    { key:"leeftijd",    label:"Leeftijd" },
    { key:"startdatum",  label:"Startdatum traject" },
    { key:"vraag",       label:"Vraag / reden van contact" },
    { key:"klacht",      label:"Klacht & anamnese" },
    { key:"onderzoek",   label:"Bevindingen lichamelijk onderzoek" },
    { key:"behandeling", label:"Behandeling tot nu toe" },
  ];

  const PLACEHOLDER = {
    leeftijd:    "bijv. 42 jaar",
    startdatum:  "bijv. maart 2025",
    vraag:       "Wat is de concrete vraag aan de ontvanger?",
    klacht:      "Ontstaanswijze, beloop, pijnscore, ADL-beperkingen, relevante voorgeschiedenis...",
    onderzoek:   "ROM, kracht, klinische tests (geen echo/röntgen)...",
    behandeling: "Type behandeling, frequentie, duur, effect, aantal sessies...",
  };

  const GROOT = ["vraag","klacht","onderzoek","behandeling"];

  const SYSTEM = `Je bent een medische rapportage-assistent voor fysiotherapeuten in Nederland. Je schrijft collegiaal, informeel en direct — zoals fysiotherapeuten met elkaar en met huisartsen/orthopeden communiceren. Denk aan de toon van een Siilo-bericht tussen collega's.

STRIKTE REGELS:
- Geen diagnoses stellen — gebruik "beeld passend bij", "vermoeden van", of benoem enkel klinische bevindingen
- Geen echografische of radiologische bevindingen opnemen — dit is een fysiotherapeutische rapportage
- Geen medische interpretaties die buiten fysiotherapeutische competentie vallen
- Gebruik ALLEEN informatie die letterlijk in de aangeleverde tekst staat
- Geen markdown, geen sterretjes, geen vetgedrukte tekst — gewone platte tekst
- Informele maar professionele toon (zoals collega's onderling)
- Sluit af met een concrete vraag of verzoek aan de ontvanger

STRUCTUUR (UMOOOVE-conform):
Aanhef: Hallo [naam ontvanger indien bekend, anders weglaten],

Openingszin met reden van contact en patiëntgegevens (leeftijd, startdatum).
Beloop: kort de voorgeschiedenis en het klachtbeloop.
Klinisch beeld: anamnestische bevindingen + lichamelijk onderzoek (ROM, kracht, klinische tests). Geen echo/röntgen.
Behandeling: wat gedaan, hoeveel sessies, met welk effect.
Vraag/verzoek: concrete vraag aan de ontvanger.
Afsluiting: Groet, [therapeutnaam indien bekend]

VERBODEN: echo/MSU-bevindingen, radiologie, harde diagnoses, formele taal, bullets in output.`;

  function buildPrompt(type, v, extra) {
    return `Rapportagetype: ${type}
Leeftijd: ${v.leeftijd}
Start traject: ${v.startdatum}
Vraag/reden contact: ${v.vraag}
Klacht/anamnese: ${v.klacht}
Lichamelijk onderzoek: ${v.onderzoek}
Behandeling: ${v.behandeling}
${extra ? `Aanvullend: ${extra}` : ""}

Schrijf een informele, collegiale Siilo-rapportage. Geen diagnoses, geen echo- of röntgenbevindingen. Sluit af met een concrete vraag aan de ontvanger.`;
  }

  function App() {
    const [apiKey, setApiKey]     = useState(localStorage.getItem("ft_apikey") || "");
    const [apiInput, setApiInput] = useState("");
    const [fase, setFase]         = useState("invoer");
    const [type, setType]         = useState(TYPEN[0]);
    const [v, setV]               = useState({leeftijd:"",startdatum:"",vraag:"",klacht:"",onderzoek:"",behandeling:""});
    const [extra, setExtra]       = useState("");
    const [resultaat, setRes]     = useState("");
    const [loading, setLoading]   = useState(false);
    const [error, setError]       = useState("");
    const [copied, setCopied]     = useState(false);
    const [bewerk, setBewerk]     = useState(false);
    const [geprobeerd, setGep]    = useState(false);

    const ontbrekend = VELDEN.filter(f => !v[f.key]?.trim());

    function setVeld(key, val) { setV(p => ({...p, [key]: val})); }

    function slaKeyOp() {
      localStorage.setItem("ft_apikey", apiInput);
      setApiKey(apiInput); setApiInput("");
    }

    async function genereer() {
      setGep(true);
      if (ontbrekend.length > 0) return;
      if (!apiKey) { setError("Sla eerst je API-sleutel op."); return; }
      setError(""); setRes(""); setLoading(true);
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-5",
            max_tokens: 1000,
            temperature: 0,
            system: SYSTEM,
            messages: [{ role:"user", content: buildPrompt(type, v, extra) }],
          }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const tekst = data.content?.map(b => b.text||"").join("\n") || "";
        if (!tekst) throw new Error("Geen resultaat ontvangen.");
        setRes(`${type}\n\n${tekst}`);
        setBewerk(false); setFase("resultaat");
      } catch(e) {
        setError("Er ging iets mis: " + e.message);
      } finally { setLoading(false); }
    }

    function kopieer() {
      const el = document.createElement("textarea");
      el.value = resultaat; document.body.appendChild(el);
      el.select(); document.execCommand("copy");
      document.body.removeChild(el);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    }

    function reset() {
      setFase("invoer"); setRes(""); setError(""); setGep(false);
      setType(TYPEN[0]); setV({leeftijd:"",startdatum:"",vraag:"",klacht:"",onderzoek:"",behandeling:""});
      setExtra(""); setBewerk(false);
    }

    return (
      <div className="wrap">
        {/* API balk */}
        {!apiKey ? (
          <div className="api-bar">
            <label>API-sleutel</label>
            <input type="password" placeholder="sk-ant-..." value={apiInput}
              onChange={e => setApiInput(e.target.value)}
              onKeyDown={e => e.key==="Enter" && slaKeyOp()} />
            <button className="save-btn" onClick={slaKeyOp}>Opslaan</button>
          </div>
        ) : (
          <div className="api-bar" style={{justifyContent:"flex-end", gap:8}}>
            <span className="api-saved">API-sleutel opgeslagen</span>
            <button className="api-change" onClick={() => { localStorage.removeItem("ft_apikey"); setApiKey(""); }}>Wijzigen</button>
          </div>
        )}

        {/* Hero */}
        <div className="hero">
          <div className="hero-badge">📨 Siilo · Rapportage</div>
          <div className="hero-ring">🫀</div>
          <h1>Schouderrapportage</h1>
          <p>UMOOOVE-conform · Informeel · Klaar voor Siilo</p>
          <span className="hero-pill">Fyzio Totaal</span>
        </div>

        <div className="body">
          {fase === "invoer" ? (
            <>
              {/* Type */}
              <div className="section">
                <span className="section-label">Rapportagetype</span>
                <div className="card">
                  <select value={type} onChange={e => setType(e.target.value)}>
                    {TYPEN.map(t => <option key={t}>{t}</option>)}
                  </select>
                </div>
              </div>

              {/* Waarschuwing */}
              {geprobeerd && ontbrekend.length > 0 && (
                <div className="warning">
                  Vul eerst de ontbrekende velden in (rood gemarkeerd) voordat de rapportage gegenereerd kan worden.
                </div>
              )}

              {/* Velden */}
              <div className="section">
                <span className="section-label">Klinische informatie</span>
                <div className="card" style={{display:"flex", flexDirection:"column", gap:14}}>
                  {VELDEN.map(f => {
                    const mis = geprobeerd && !v[f.key]?.trim();
                    return (
                      <div key={f.key} className="field">
                        <div className="field-label">
                          {f.label}
                          {mis
                            ? <span className="tag-mis">Vereist — vul in</span>
                            : <span className="tag-req">Verplicht</span>}
                        </div>
                        <div className={"field-input" + (mis ? " missing" : "")}>
                          {GROOT.includes(f.key)
                            ? <textarea value={v[f.key]} onChange={e => setVeld(f.key, e.target.value)}
                                placeholder={PLACEHOLDER[f.key]}
                                style={{minHeight: ["klacht","onderzoek"].includes(f.key) ? 88 : 58}} />
                            : <input type="text" value={v[f.key]} onChange={e => setVeld(f.key, e.target.value)}
                                placeholder={PLACEHOLDER[f.key]} />}
                        </div>
                      </div>
                    );
                  })}
                  {/* Optioneel */}
                  <div className="field">
                    <div className="field-label" style={{color:"#aaa"}}>
                      Aanvullende informatie <span className="tag-opt">Optioneel</span>
                    </div>
                    <div className="field-input">
                      <textarea value={extra} onChange={e => setExtra(e.target.value)}
                        placeholder="PROMs, 3S-score, context, specifieke wensen voor de ontvanger..."
                        style={{minHeight:56}} />
                    </div>
                  </div>
                </div>
              </div>

              {error && <div className="error-msg">{error}</div>}

              <button className="btn-primary" onClick={genereer} disabled={loading}>
                {loading ? <><span className="spinner"></span>Rapportage genereren...</> : "Genereer rapportage →"}
              </button>
            </>
          ) : (
            <>
              <span className="badge-ready">✓ Siilo-ready</span>
              <div className="result-card">
                <div className="result-header">
                  <span>{type.split("–")[0].trim()}</span>
                  <div className="result-btns">
                    <button className={"result-btn" + (bewerk ? " editing" : "")}
                      onClick={() => setBewerk(b => !b)}>
                      {bewerk ? "✓ Klaar" : "Bewerken"}
                    </button>
                    <button className="result-btn" onClick={kopieer}>
                      {copied ? "✓ Gekopieerd" : "Kopieer"}
                    </button>
                  </div>
                </div>
                {bewerk
                  ? <textarea className="result-edit" value={resultaat} onChange={e => setRes(e.target.value)} />
                  : <div className="result-body">{resultaat}</div>}
              </div>
              <div className="divider"></div>
              <button className="btn-secondary" onClick={reset}>+ Nieuwe rapportage</button>
            </>
          )}
        </div>
      </div>
    );
  }

  ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
