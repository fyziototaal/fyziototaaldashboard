<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schouderrapportage – Fyzio Totaal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: #f7f5fc; min-height: 100vh; color: #1a1030; }
    .ft-wrap { max-width: 680px; margin: 0 auto; }
    .ft-header { background: linear-gradient(135deg, #6c3fc5 0%, #c0328a 100%); padding: 28px 28px 24px; border-radius: 0 0 20px 20px; }
    .ft-logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .ft-logo-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.6); }
    .ft-logo-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
    .ft-header h1 { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 4px; }
    .ft-header p { font-size: 13px; color: rgba(255,255,255,0.75); }
    .ft-apikey-bar { background: #fff; border-bottom: 1px solid #ede8f8; padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
    .ft-apikey-bar label { font-size: 12px; font-weight: 600; color: #8b6bcc; white-space: nowrap; }
    .ft-apikey-bar input { flex: 1; font-family: 'Outfit', sans-serif; font-size: 13px; border: 1px solid #d6c8f5; border-radius: 8px; padding: 6px 10px; color: #1a1030; outline: none; }
    .ft-apikey-bar input:focus { border-color: #6c3fc5; }
    .ft-apikey-btn { font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: none; background: linear-gradient(135deg, #6c3fc5, #c0328a); color: #fff; cursor: pointer; white-space: nowrap; }
    .ft-apikey-saved { font-size: 12px; color: #aaa; }
    .ft-apikey-change { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid #d6c8f5; background: #fff; color: #8b6bcc; cursor: pointer; }
    .ft-body { padding: 20px 20px 40px; }
    .ft-section { margin-bottom: 14px; }
    .ft-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8b6bcc; margin-bottom: 7px; display: block; }
    .ft-card { background: #fff; border-radius: 14px; border: 1px solid #ede8f8; padding: 14px 16px; overflow: hidden; }
    .ft-field { margin-bottom: 12px; }
    .ft-field:last-child { margin-bottom: 0; }
    .ft-field-label { font-size: 12px; font-weight: 600; color: #6c3fc5; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .ft-required { font-size: 10px; background: #f5f0ff; color: #8b6bcc; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
    .ft-missing { font-size: 10px; background: #fde8f4; color: #c0328a; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
    .ft-optional { font-size: 10px; background: #f5f5f5; color: #aaa; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
    .ft-input-wrap { background: #faf8ff; border-radius: 10px; border: 1px solid #ede8f8; padding: 10px 14px; }
    .ft-input-wrap.missing { border-color: #f5c8e4; background: #fdf8fb; }
    select, textarea, input[type=text] { width: 100%; font-family: 'Outfit', sans-serif; font-size: 14px; color: #1a1030; background: transparent; border: none; outline: none; line-height: 1.6; }
    select { background: #fff; }
    textarea { resize: vertical; min-height: 70px; }
    .ft-btn { width: 100%; padding: 13px 0; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; border: none; border-radius: 12px; background: linear-gradient(135deg, #6c3fc5, #c0328a); color: #fff; cursor: pointer; transition: opacity 0.15s; }
    .ft-btn:hover { opacity: 0.92; }
    .ft-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .ft-btn-secondary { width: 100%; padding: 11px 0; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500; border: 1.5px solid #d6c8f5; border-radius: 12px; background: #fff; color: #6c3fc5; cursor: pointer; transition: all 0.15s; }
    .ft-btn-secondary:hover { background: #f0eaff; }
    .ft-result-card { background: #fff; border-radius: 14px; border: 1px solid #ede8f8; overflow: hidden; margin-bottom: 16px; }
    .ft-result-header { background: linear-gradient(135deg, #6c3fc5 0%, #c0328a 100%); padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; }
    .ft-result-header span { font-size: 13px; font-weight: 600; color: #fff; }
    .ft-result-btns { display: flex; gap: 6px; }
    .ft-copy-btn { font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; transition: background 0.15s; }
    .ft-copy-btn:hover { background: rgba(255,255,255,0.28); }
    .ft-copy-btn.active-edit { background: rgba(255,255,255,0.35); border-color: rgba(255,255,255,0.9); }
    .ft-result-body { padding: 16px 18px; font-size: 13.5px; line-height: 1.75; color: #1a1030; white-space: pre-wrap; font-family: 'Outfit', sans-serif; }
    .ft-result-edit { width: 100%; min-height: 220px; font-size: 13.5px; line-height: 1.75; color: #1a1030; font-family: 'Outfit', sans-serif; padding: 16px 18px; border: none; outline: none; resize: vertical; background: #faf8ff; display: block; }
    .ft-divider { height: 1px; background: #ede8f8; margin: 16px 0; }
    .ft-error { font-size: 13px; color: #c0328a; margin-bottom: 10px; padding: 10px 14px; background: #fdf0f7; border-radius: 10px; border: 1px solid #f5c8e4; }
    .ft-warning { font-size: 13px; color: #7a4f00; margin-bottom: 14px; padding: 10px 14px; background: #fff8e6; border-radius: 10px; border: 1px solid #f0d080; }
    .ft-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: #f0eaff; color: #6c3fc5; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }
    .ft-spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const RAPPORTAGE_TYPEN = [
      "Huisarts – vraag over mogelijke medische interventie",
      "Huisarts – verzoek beoordeling/verwijzing orthopeed",
      "Orthopeed – vraag indicatie doorverwijzing",
      "Orthopeed – evaluatie na conservatief traject",
      "Orthopeed – postoperatief voortgangsverslag",
      "Tussenevaluatie langdurig traject",
      "Spoed / afwijkend beloop",
    ];

    const VERPLICHTE_VELDEN = [
      { key: "naam",       label: "Naam patiënt" },
      { key: "leeftijd",   label: "Leeftijd" },
      { key: "startdatum", label: "Startdatum traject" },
      { key: "vraag",      label: "Vraag / reden van contact" },
      { key: "klacht",     label: "Klacht & anamnese" },
      { key: "onderzoek",  label: "Bevindingen lichamelijk onderzoek" },
      { key: "behandeling",label: "Behandeling tot nu toe" },
    ];

    const PLACEHOLDERS = {
      naam:        "bijv. J. de Vries",
      leeftijd:    "bijv. 42 jaar",
      startdatum:  "bijv. maart 2025",
      vraag:       "Wat is de concrete vraag aan de ontvanger?",
      klacht:      "Ontstaanswijze, beloop, pijnscore, ADL-beperkingen, relevante voorgeschiedenis...",
      onderzoek:   "ROM, kracht, klinische tests (geen echo/röntgen)...",
      behandeling: "Type behandeling, frequentie, duur, effect, aantal sessies...",
    };

    const SYSTEM_PROMPT = `Je bent een medische rapportage-assistent voor fysiotherapeuten in Nederland. Je schrijft collegiaal, informeel en direct — zoals fysiotherapeuten met elkaar en met huisartsen/orthopeden communiceren. Denk aan de toon van een Siilo-bericht tussen collega's.

STRIKTE REGELS:
- Geen diagnoses stellen — gebruik "beeld passend bij", "vermoeden van", of benoem enkel klinische bevindingen
- Geen echografische of radiologische bevindingen opnemen — dit is een fysiotherapeutische rapportage
- Geen medische interpretaties die buiten fysiotherapeutische competentie vallen
- Gebruik ALLEEN informatie die letterlijk in de aangeleverde tekst staat
- Geen markdown, geen sterretjes, geen vetgedrukte tekst — gewone platte tekst
- Informele maar professionele toon (zoals collega's onderling)
- Sluit af met een concrete vraag of verzoek aan de ontvanger

STRUCTUUR (UMOOOVE-conform):
Aanhef: Hallo [naam ontvanger indien bekend, anders weglaten],

Openingszin met reden van contact en patiëntgegevens (naam, leeftijd).

Beloop: Kort de voorgeschiedenis en het klachtbeloop (onset, duur, verloop).

Klinisch beeld: Relevante anamnestische bevindingen + lichamelijk onderzoek (ROM, kracht, klinische tests). Geen echo/röntgen.

Behandeling: Wat is er gedaan, hoeveel sessies, met welk effect.

Vraag/verzoek: Sluit af met de concrete vraag aan de ontvanger.

Afsluiting: Groet, [therapeutnaam indien bekend]

VERBODEN:
- Echo- of MSU-bevindingen
- Radiologische bevindingen
- Diagnoses zonder voorbehoud
- Formele/bureaucratische taal
- Opsommingstekens of bullets in de output`;

    function buildPrompt(type, v, extra) {
      return `Rapportagetype: ${type}

Naam: ${v.naam}
Leeftijd: ${v.leeftijd}
Start traject: ${v.startdatum}
Vraag/reden contact: ${v.vraag}
Klacht/anamnese: ${v.klacht}
Lichamelijk onderzoek: ${v.onderzoek}
Behandeling: ${v.behandeling}
${extra ? `Aanvullend: ${extra}` : ""}

Schrijf een informele, collegiale Siilo-rapportage. Geen diagnoses, geen echo- of röntgenbevindingen. Sluit af met een concrete vraag aan de ontvanger.`;
    }

    function App() {
      const [apiKey, setApiKey]       = useState(localStorage.getItem("ft_apikey") || "");
      const [apiInput, setApiInput]   = useState("");
      const [fase, setFase]           = useState("invoer");
      const [type, setType]           = useState(RAPPORTAGE_TYPEN[0]);
      const [velden, setVelden]       = useState({ naam:"", leeftijd:"", startdatum:"", vraag:"", klacht:"", onderzoek:"", behandeling:"" });
      const [extra, setExtra]         = useState("");
      const [resultaat, setResultaat] = useState("");
      const [loading, setLoading]     = useState(false);
      const [error, setError]         = useState("");
      const [copied, setCopied]       = useState(false);
      const [bewerk, setBewerk]       = useState(false);
      const [geprobeerd, setGeprobeerd] = useState(false);

      const ontbrekend = VERPLICHTE_VELDEN.filter(v => !velden[v.key]?.trim());

      function setVeld(key, val) { setVelden(p => ({ ...p, [key]: val })); }

      function slaKeyOp() {
        localStorage.setItem("ft_apikey", apiInput);
        setApiKey(apiInput);
        setApiInput("");
      }

      async function genereer() {
        setGeprobeerd(true);
        if (ontbrekend.length > 0) return;
        if (!apiKey) { setError("Sla eerst je API-sleutel op."); return; }
        setError(""); setResultaat(""); setLoading(true);
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true",
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-5",
              max_tokens: 1000,
              temperature: 0,
              system: SYSTEM_PROMPT,
              messages: [{ role: "user", content: buildPrompt(type, velden, extra) }],
            }),
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          const tekst = data.content?.map(b => b.text || "").join("\n") || "";
          if (!tekst) throw new Error("Geen resultaat ontvangen.");
          setResultaat(`${type}\n\n${tekst}`);
          setBewerk(false);
          setFase("resultaat");
        } catch(e) {
          setError("Er ging iets mis: " + e.message);
        } finally {
          setLoading(false);
        }
      }

      function kopieer() {
        const el = document.createElement("textarea");
        el.value = resultaat;
        document.body.appendChild(el);
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }

      function reset() {
        setFase("invoer"); setResultaat(""); setError(""); setGeprobeerd(false);
        setType(RAPPORTAGE_TYPEN[0]);
        setVelden({ naam:"", leeftijd:"", startdatum:"", vraag:"", klacht:"", onderzoek:"", behandeling:"" });
        setExtra(""); setBewerk(false);
      }

      return (
        <div className="ft-wrap">
          {!apiKey ? (
            <div className="ft-apikey-bar">
              <label>API-sleutel</label>
              <input type="password" placeholder="sk-ant-..." value={apiInput}
                onChange={e => setApiInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && slaKeyOp()} />
              <button className="ft-apikey-btn" onClick={slaKeyOp}>Opslaan</button>
            </div>
          ) : (
            <div className="ft-apikey-bar" style={{justifyContent:"flex-end", gap:8}}>
              <span className="ft-apikey-saved">API-sleutel opgeslagen</span>
              <button className="ft-apikey-change" onClick={() => { localStorage.removeItem("ft_apikey"); setApiKey(""); }}>Wijzigen</button>
            </div>
          )}

          <div className="ft-header">
            <div className="ft-logo-row">
              <div className="ft-logo-dot"></div>
              <span className="ft-logo-label">Fyzio Totaal · Siilo</span>
            </div>
            <h1>Schouderrapportage</h1>
            <p>UMOOOVE-conform · Informeel · Klaar voor Siilo</p>
          </div>

          <div className="ft-body">
            {fase === "invoer" ? (
              <>
                <div className="ft-section">
                  <span className="ft-label">Rapportagetype</span>
                  <div className="ft-card">
                    <select value={type} onChange={e => setType(e.target.value)}>
                      {RAPPORTAGE_TYPEN.map(t => <option key={t}>{t}</option>)}
                    </select>
                  </div>
                </div>

                {geprobeerd && ontbrekend.length > 0 && (
                  <div className="ft-warning">
                    Vul eerst de ontbrekende velden in (rood gemarkeerd) voordat de rapportage gegenereerd kan worden.
                  </div>
                )}

                <div className="ft-section">
                  <span className="ft-label">Patiëntgegevens & klinische informatie</span>
                  <div className="ft-card" style={{display:"flex", flexDirection:"column", gap:12}}>
                    {VERPLICHTE_VELDEN.map(v => {
                      const mis = geprobeerd && !velden[v.key]?.trim();
                      const grootVeld = ["klacht","onderzoek","behandeling","vraag"].includes(v.key);
                      return (
                        <div key={v.key} className="ft-field">
                          <div className="ft-field-label">
                            {v.label}
                            {mis
                              ? <span className="ft-missing">Vereist — vul in</span>
                              : <span className="ft-required">Verplicht</span>}
                          </div>
                          <div className={"ft-input-wrap" + (mis ? " missing" : "")}>
                            {grootVeld
                              ? <textarea value={velden[v.key]} onChange={e => setVeld(v.key, e.target.value)}
                                  placeholder={PLACEHOLDERS[v.key]}
                                  style={{minHeight: ["klacht","onderzoek"].includes(v.key) ? 90 : 60}} />
                              : <input type="text" value={velden[v.key]} onChange={e => setVeld(v.key, e.target.value)}
                                  placeholder={PLACEHOLDERS[v.key]} />}
                          </div>
                        </div>
                      );
                    })}
                    <div className="ft-field">
                      <div className="ft-field-label" style={{color:"#aaa"}}>
                        Aanvullende informatie <span className="ft-optional">Optioneel</span>
                      </div>
                      <div className="ft-input-wrap">
                        <textarea value={extra} onChange={e => setExtra(e.target.value)}
                          placeholder="Bijv. PROMs, 3S-score, context, specifieke wensen voor de ontvanger..."
                          style={{minHeight:60}} />
                      </div>
                    </div>
                  </div>
                </div>

                {error && <div className="ft-error">{error}</div>}

                <button className="ft-btn" onClick={genereer} disabled={loading}>
                  {loading
                    ? <span><span className="ft-spinner"></span>Rapportage genereren...</span>
                    : "Genereer rapportage →"}
                </button>
              </>
            ) : (
              <>
                <span className="ft-badge">Siilo-ready</span>
                <div className="ft-result-card">
                  <div className="ft-result-header">
                    <span>{type.split("–")[0].trim()}</span>
                    <div className="ft-result-btns">
                      <button className={"ft-copy-btn" + (bewerk ? " active-edit" : "")}
                        onClick={() => setBewerk(b => !b)}>
                        {bewerk ? "✓ Klaar" : "Bewerken"}
                      </button>
                      <button className="ft-copy-btn" onClick={kopieer}>
                        {copied ? "✓ Gekopieerd" : "Kopieer"}
                      </button>
                    </div>
                  </div>
                  {bewerk
                    ? <textarea className="ft-result-edit" value={resultaat} onChange={e => setResultaat(e.target.value)} />
                    : <div className="ft-result-body">{resultaat}</div>}
                </div>
                <div className="ft-divider"></div>
                <button className="ft-btn-secondary" onClick={reset}>+ Nieuwe rapportage</button>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
