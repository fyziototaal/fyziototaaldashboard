  <script>
    const APP_VERSION = "2026-09-14.2";
    (function () {
      if (!location.search.includes("_v=")) {
        fetch(location.pathname + "?_nocache=" + Date.now(), { cache: "no-store" })
          .then(r => r.text())
          .then(html => {
            const m = html.match(/<!--\s*APP_VERSION:\s*([^\s-]+(?:\.\d+)?)\s*-->/);
            if (m && m[1] !== APP_VERSION) {
              location.replace(location.pathname + "?_v=" + Date.now());
            }
          })
          .catch(() => {});
      }
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  <style>

    select, textarea, input[type=text] {
      width: 100%; font-family: 'Poppins', sans-serif;

      border: none; outline: none; line-height: 1.6;

    select { cursor: pointer; }
    textarea { resize: vertical; }

    /* Toggle */
    .toggle { display: flex; gap: 6px; margin-bottom: 14px; }
    .toggle-btn {
      flex: 1; padding: 9px 0; font-family: 'Poppins', sans-serif;

    /* PDF upload zone */
    .pdf-zone {
      border: 2px dashed #d8c7d4; border-radius: 12px;

    .pdf-zone:hover { border-color: #82176D; background: #f8f0f6; }
    .pdf-zone.has-file { border-color: #82176D; border-style: solid; background: #f8f0f6; }
    .pdf-icon { font-size: 30px; margin-bottom: 8px; }

    .pdf-hint { font-size: 12px; color: #aaa; }

    /* Fields */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      font-size: 11.5px; font-weight: 600; color: #82176D;
      margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
    }
    .field-label.opt { color: #999; }
    .tag-req { font-size: 10px; background: #f3e3ef; color: #82176D; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .tag-mis { font-size: 10px; background: #fde8f4; color: #c0328a; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .tag-opt { font-size: 10px; background: #f0f0f0; color: #999; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .field-input {
      background: #faf7fb; border-radius: 10px;
      border: 1px solid #e2d5df; padding: 9px 13px;
    }
    .field-input.missing { border-color: #f5b8d8; background: #fdf5fa; }

    .warning {
      font-size: 13px; color: #7a4f00; margin-bottom: 14px;
      padding: 10px 14px; background: #fff8e6;
      border-radius: 10px; border: 1px solid #f0d080;
    }
    .error-msg {
      font-size: 13px; color: #82176D; margin-bottom: 12px;
      padding: 10px 14px; background: #fdf0f7;

    }

    .btn-primary {
      width: 100%; padding: 13px 0;
      font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700;
      border: none; border-radius: 12px;
      background: linear-gradient(120deg, #4a0f42 0%, #82176D 100%);
      color: #fff; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.91; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      width: 100%; padding: 11px 0;
      font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 600;
      border: 1.5px solid #d8c7d4; border-radius: 12px;
      background: #fff; color: #82176D; cursor: pointer; transition: background 0.15s;
    }
    .btn-secondary:hover { background: #f8f0f6; }

    .result-card {
      background: #fff; border-radius: 16px;

    .result-header {

      padding: 11px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .result-header span { font-size: 13px; font-weight: 600; color: #fff; }
    .result-btns { display: flex; gap: 6px; }
    .result-btn {
      font-family: 'Poppins', sans-serif; font-size: 11.5px; font-weight: 600;
      padding: 5px 14px; border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.13); color: #fff; cursor: pointer; transition: background 0.15s;
    }
    .result-btn:hover { background: rgba(255,255,255,0.25); }
    .result-btn.editing { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.85); }
    .result-body {
      padding: 18px 20px; font-size: 13.5px; line-height: 1.8;
      color: #1a1a1a; white-space: pre-wrap; font-family: 'Poppins', sans-serif;
    }
    .result-edit {
      width: 100%; min-height: 230px; font-size: 13.5px; line-height: 1.8;
      color: #1a1a1a; font-family: 'Poppins', sans-serif;
      padding: 18px 20px; border: none; outline: none;
      resize: vertical; background: #faf7fb; display: block;
    }
    .badge-ready {
      display: inline-block; font-size: 10.5px; font-weight: 700;
      padding: 4px 12px; border-radius: 20px;
      background: #dcf4fb; color: #00728e;
      letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px;

    .divider { height: 1px; background: #e2d5df; margin: 18px 0; }

      display: inline-block; width: 15px; height: 15px;

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {

      font-size: 11.5px; font-family: 'Poppins', sans-serif;
    }
    footer strong { color: rgba(255,255,255,0.75); }
    .ver { color: #00B6E8; font-weight: 600; }
  </style>
</head>
<body>
<div id="root"></div>
<footer>
  <strong>Fyzio Totaal</strong> · Schouderrapportage · <span class="ver">v2026-09-14.2</span>
</footer>

<script type="text/babel">
  const { useState } = React;

  const TYPEN = [
    "Huisarts – vraag over mogelijke medische interventie",
    "Huisarts – verzoek beoordeling/verwijzing orthopeed",
    "Orthopeed – vraag indicatie doorverwijzing",
    "Orthopeed – evaluatie na conservatief traject",
    "Orthopeed – postoperatief voortgangsverslag",
    "Tussenevaluatie langdurig traject",
    "Spoed / afwijkend beloop",
  ];

  const SYSTEM = `Je bent een medische rapportage-assistent voor fysiotherapeuten in Nederland. Je schrijft collegiaal, informeel en direct — zoals fysiotherapeuten met elkaar en met huisartsen/orthopeden communiceren. Denk aan de toon van een Siilo-bericht tussen collega's.

STRIKTE REGELS:
- Geen diagnoses stellen — gebruik "beeld passend bij", "vermoeden van", of benoem enkel klinische bevindingen
- Geen echografische of radiologische bevindingen opnemen — dit is een fysiotherapeutische rapportage
- Geen medische interpretaties die buiten fysiotherapeutische competentie vallen
- Gebruik ALLEEN informatie die letterlijk in de aangeleverde tekst staat
- Geen markdown, geen sterretjes, geen vetgedrukte tekst — gewone platte tekst
- Informele maar professionele toon (zoals collega's onderling)
- Sluit af met een concrete vraag of verzoek aan de ontvanger

STRUCTUUR (UMOOOVE-conform):
Aanhef: Hallo [naam ontvanger indien bekend, anders weglaten],
Openingszin met reden van contact en patiëntgegevens (leeftijd, startdatum).
Beloop: kort de voorgeschiedenis en het klachtbeloop.
Klinisch beeld: anamnestische bevindingen + lichamelijk onderzoek (ROM, kracht, klinische tests). Geen echo/röntgen.
Behandeling: wat gedaan, hoeveel sessies, met welk effect.
Vraag/verzoek: concrete vraag aan de ontvanger.
Afsluiting: Groet, [therapeutnaam indien bekend]

VERBODEN: echo/MSU-bevindingen, radiologie, harde diagnoses, formele taal, bullets in output.`;

  function App() {
    const [apiKey, setApiKey]     = useState(localStorage.getItem("ft_apikey") || "");
    const [apiInput, setApiInput] = useState("");
    const [fase, setFase]         = useState("invoer");
    const [type, setType]         = useState(TYPEN[0]);
    const [invoer, setInvoer]     = useState("pdf"); // "pdf" | "tekst"
    const [pdfData, setPdfData]   = useState(null);
    const [pdfNaam, setPdfNaam]   = useState("");
    const [leeftijd, setLeeftijd] = useState("");
    const [startdatum, setStart]  = useState("");
    const [vraag, setVraag]       = useState("");
    const [klacht, setKlacht]     = useState("");
    const [onderzoek, setOnderz]  = useState("");
    const [behandeling, setBeh]   = useState("");
    const [extra, setExtra]       = useState("");
    const [resultaat, setRes]     = useState("");
    const [loading, setLoading]   = useState(false);
    const [error, setError]       = useState("");
    const [copied, setCopied]     = useState(false);
    const [bewerk, setBewerk]     = useState(false);
    const [geprobeerd, setGep]    = useState(false);

    // Alleen leeftijd en startdatum zijn verplicht
    const misLeeftijd  = geprobeerd && !leeftijd.trim();
    const misStart     = geprobeerd && !startdatum.trim();
    // Bij PDF-modus: PDF verplicht
    const misPdf       = geprobeerd && invoer === "pdf" && !pdfData;
    const ontbrekend   = [misLeeftijd, misStart, misPdf].some(Boolean);

    function handlePdf(e) {
      const file = e.target.files[0];
      if (!file) return;
      setPdfNaam(file.name);
      const reader = new FileReader();
      reader.onload = () => setPdfData(reader.result.split(",")[1]);
      reader.readAsDataURL(file);
    }

    function slaKeyOp() {
      localStorage.setItem("ft_apikey", apiInput);
      setApiKey(apiInput); setApiInput("");
    }

    function buildMessages() {
      const pdfPrompt = `Rapportagetype: ${type}
Leeftijd: ${leeftijd}
Start traject: ${startdatum}
${vraag       ? `Vraag/reden contact: ${vraag}` : ""}
${extra       ? `Aanvullend: ${extra}` : ""}

Haal de klinische informatie (klacht, anamnese, lichamelijk onderzoek, behandeling) uit het bijgevoegde dossier. Geen echo- of röntgenbevindingen. Schrijf een informele, collegiale Siilo-rapportage. Sluit af met een concrete vraag aan de ontvanger.`;

      const tekstPrompt = `Rapportagetype: ${type}
Leeftijd: ${leeftijd}
Start traject: ${startdatum}
${vraag       ? `Vraag/reden contact: ${vraag}`       : ""}
${klacht      ? `Klacht/anamnese: ${klacht}`           : ""}
${onderzoek   ? `Lichamelijk onderzoek: ${onderzoek}`  : ""}
${behandeling ? `Behandeling: ${behandeling}`          : ""}
${extra       ? `Aanvullend: ${extra}`                 : ""}

Schrijf een informele, collegiale Siilo-rapportage. Geen echo- of röntgenbevindingen. Sluit af met een concrete vraag aan de ontvanger.`;

      if (invoer === "pdf") {
        return [{ role:"user", content:[
          { type:"document", source:{ type:"base64", media_type:"application/pdf", data: pdfData } },
          { type:"text", text: pdfPrompt }
        ]}];
      }
      return [{ role:"user", content: tekstPrompt }];
    }

    async function genereer() {
      setGep(true);
      if (ontbrekend) return;
      if (!apiKey) { setError("Sla eerst je API-sleutel op."); return; }
      setError(""); setRes(""); setLoading(true);
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-5",
            max_tokens: 1000,
            temperature: 0,
            system: SYSTEM,
            messages: buildMessages(),
          }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const tekst = data.content?.map(b => b.text||"").join("\n") || "";
        if (!tekst) throw new Error("Geen resultaat ontvangen.");
        setRes(`${type}\n\n${tekst}`);
        setBewerk(false); setFase("resultaat");
      } catch(e) {
        setError("Er ging iets mis: " + e.message);
      } finally { setLoading(false); }
    }

    function kopieer() {
      const el = document.createElement("textarea");
      el.value = resultaat; document.body.appendChild(el);
      el.select(); document.execCommand("copy");
      document.body.removeChild(el);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    }

    function reset() {
      setFase("invoer"); setRes(""); setError(""); setGep(false);
      setType(TYPEN[0]); setInvoer("pdf");
      setPdfData(null); setPdfNaam("");
      setLeeftijd(""); setStart(""); setVraag("");
      setKlacht(""); setOnderz(""); setBeh(""); setExtra("");
      setBewerk(false);
    }

    const FI = ({mis, children}) => (
      <div className={"field-input" + (mis ? " missing" : "")}>{children}</div>
    );

    return (
      <div className="wrap">
        {!apiKey ? (
          <div className="api-bar">
            <label>API-sleutel</label>
            <input type="password" placeholder="sk-ant-..." value={apiInput}
              onChange={e => setApiInput(e.target.value)}
              onKeyDown={e => e.key==="Enter" && slaKeyOp()} />
            <button className="save-btn" onClick={slaKeyOp}>Opslaan</button>
          </div>
        ) : (
          <div className="api-bar" style={{justifyContent:"flex-end", gap:8}}>
            <span className="api-saved">API-sleutel opgeslagen</span>
            <button className="api-change" onClick={() => { localStorage.removeItem("ft_apikey"); setApiKey(""); }}>Wijzigen</button>
          </div>
        )}

        <div className="hero">
          <div className="hero-badge">📨 Siilo · Rapportage</div>
          <div className="hero-ring">🫀</div>
          <h1>Schouderrapportage</h1>
          <p>UMOOOVE-conform · Informeel · Klaar voor Siilo</p>
          <span className="hero-pill">Fyzio Totaal</span>
        </div>

        <div className="body">
          {fase === "invoer" ? (
            <>
              {/* Rapportagetype */}
              <div className="section">
                <span className="section-label">Rapportagetype</span>
                <div className="card">
                  <select value={type} onChange={e => setType(e.target.value)}>
                    {TYPEN.map(t => <option key={t}>{t}</option>)}
                  </select>
                </div>
              </div>

              {/* Verplichte basisvelden */}
              <div className="section">
                <span className="section-label">Basisgegevens</span>
                <div className="card" style={{display:"flex", flexDirection:"column", gap:14}}>
                  <div className="field">
                    <div className="field-label">
                      Leeftijd {misLeeftijd ? <span className="tag-mis">Vereist — vul in</span> : <span className="tag-req">Verplicht</span>}
                    </div>
                    <FI mis={misLeeftijd}>
                      <input type="text" value={leeftijd} onChange={e => setLeeftijd(e.target.value)} placeholder="bijv. 42 jaar" />
                    </FI>
                  </div>
                  <div className="field">
                    <div className="field-label">
                      Startdatum traject {misStart ? <span className="tag-mis">Vereist — vul in</span> : <span className="tag-req">Verplicht</span>}
                    </div>
                    <FI mis={misStart}>
                      <input type="text" value={startdatum} onChange={e => setStart(e.target.value)} placeholder="bijv. maart 2025" />
                    </FI>
                  </div>
                  <div className="field">
                    <div className="field-label opt">Vraag / reden van contact <span className="tag-opt">Optioneel</span></div>
                    <FI>
                      <textarea value={vraag} onChange={e => setVraag(e.target.value)}
                        placeholder="Wat is de concrete vraag aan de ontvanger?" style={{minHeight:56}} />
                    </FI>
                  </div>
                </div>
              </div>

              {/* Dossierbron */}
              <div className="section">
                <span className="section-label">Klinische informatie</span>
                <div className="toggle">
                  <button className={"toggle-btn " + (invoer==="pdf" ? "active" : "inactive")}
                    onClick={() => { setInvoer("pdf"); setKlacht(""); setOnderz(""); setBeh(""); }}>
                    📄 PDF uploaden
                  </button>
                  <button className={"toggle-btn " + (invoer==="tekst" ? "active" : "inactive")}
                    onClick={() => { setInvoer("tekst"); setPdfData(null); setPdfNaam(""); }}>
                    ✏️ Zelf invullen
                  </button>
                </div>

                {invoer === "pdf" ? (
                  <div className={"pdf-zone" + (pdfNaam ? " has-file" : "") + (misPdf ? " missing" : "")}
                    style={misPdf ? {borderColor:"#f5b8d8"} : {}}>
                    <label style={{display:"block", cursor:"pointer"}}>
                      <input type="file" accept="application/pdf" style={{display:"none"}} onChange={handlePdf} />
                      <div className="pdf-icon">{pdfNaam ? "📄" : "⬆️"}</div>
                      {pdfNaam
                        ? <><div className="pdf-name">{pdfNaam}</div><div className="pdf-hint">Klik om een ander bestand te kiezen</div></>
                        : <><div className="pdf-name" style={{color: misPdf ? "#c0328a" : "#82176D"}}>
                            {misPdf ? "Vereist — upload een PDF" : "Klik om dossier te uploaden"}
                          </div>
                          <div className="pdf-hint">EPD-export of brief als PDF</div></>
                      }
                    </label>
                  </div>
                ) : (
                  <div className="card" style={{display:"flex", flexDirection:"column", gap:14}}>
                    {[
                      { val:klacht,     set:setKlacht, label:"Klacht & anamnese",                    ph:"Ontstaanswijze, beloop, pijnscore, ADL-beperkingen...", h:88 },
                      { val:onderzoek,  set:setOnderz, label:"Bevindingen lichamelijk onderzoek",    ph:"ROM, kracht, klinische tests (geen echo/röntgen)...",   h:88 },
                      { val:behandeling,set:setBeh,    label:"Behandeling tot nu toe",               ph:"Type behandeling, frequentie, duur, effect, aantal sessies...", h:66 },
                    ].map(f => (
                      <div key={f.label} className="field">
                        <div className="field-label opt">{f.label} <span className="tag-opt">Optioneel</span></div>
                        <FI>
                          <textarea value={f.val} onChange={e => f.set(e.target.value)}
                            placeholder={f.ph} style={{minHeight:f.h}} />
                        </FI>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Aanvullend */}
              <div className="section">
                <span className="section-label">Aanvullend</span>
                <div className="card">
                  <div className="field-label opt" style={{marginBottom:8}}>Extra context <span className="tag-opt">Optioneel</span></div>
                  <FI>
                    <textarea value={extra} onChange={e => setExtra(e.target.value)}
                      placeholder="PROMs, 3S-score, specifieke wensen voor de ontvanger..."
                      style={{minHeight:52}} />
                  </FI>
                </div>
              </div>

              {geprobeerd && ontbrekend && (
                <div className="warning">Vul de verplichte velden in voordat je de rapportage genereert.</div>
              )}
              {error && <div className="error-msg">{error}</div>}

              <button className="btn-primary" onClick={genereer} disabled={loading}>
                {loading ? <><span className="spinner"></span>Rapportage genereren...</> : "Genereer rapportage →"}
              </button>
            </>
          ) : (
            <>
              <span className="badge-ready">✓ Siilo-ready</span>
              <div className="result-card">
                <div className="result-header">
                  <span>{type.split("–")[0].trim()}</span>
                  <div className="result-btns">
                    <button className={"result-btn" + (bewerk ? " editing" : "")} onClick={() => setBewerk(b => !b)}>
                      {bewerk ? "✓ Klaar" : "Bewerken"}
                    </button>
                    <button className="result-btn" onClick={kopieer}>
                      {copied ? "✓ Gekopieerd" : "Kopieer"}
                    </button>
                  </div>
                </div>
                {bewerk
                  ? <textarea className="result-edit" value={resultaat} onChange={e => setRes(e.target.value)} />
                  : <div className="result-body">{resultaat}</div>}
              </div>
              <div className="divider"></div>
              <button className="btn-secondary" onClick={reset}>+ Nieuwe rapportage</button>
            </>
          )}
        </div>
      </div>
    );
  }

  ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
