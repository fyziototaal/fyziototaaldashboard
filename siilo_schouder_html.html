    footer { max-width: 680px; width: 100%; background: #4a0f42; color: rgba(255,255,255,0.45);
      text-align: center; padding: 14px 1rem;

<body>
<div id="root"></div>
<footer>
  <strong>Fyzio Totaal</strong> · Schouderrapportage · <span class="ver">v2026-09-15.4</span>
</footer>

<script>
// ── Staat ──────────────────────────────────────────────────────────────────
var state = {
  apiKey:      localStorage.getItem("ft_apikey") || "",
  apiInput:    "",
  fase:        "invoer",
  type:        0,
  formaat:     "opsommend",
  invoer:      "pdf",
  pdfData:     null,
  pdfNaam:     "",
  leeftijd:    "",
  start:       "",
  vraag:       "",
  klacht:      "",
  onderzoek:   "",
  behandeling: "",
  extra:       "",
  resultaat:   "",
  loading:     false,
  error:       "",
  copied:      false,
  bewerk:      false,
  geprobeerd:  false
};

var TYPEN = [
  "Huisarts \u2013 vraag over mogelijke medische interventie",
  "Huisarts \u2013 verzoek beoordeling/verwijzing orthopeed",
  "Orthopeed \u2013 vraag indicatie doorverwijzing",
  "Orthopeed \u2013 evaluatie na conservatief traject",
  "Orthopeed \u2013 postoperatief voortgangsverslag",
  "Tussenevaluatie langdurig traject",
  "Spoed / afwijkend beloop"
];

var SYSTEM = "Je bent een medische rapportage-assistent voor fysiotherapeuten in Nederland. Je schrijft collegiaal, informeel en direct.\n\nSTRIKTE REGELS:\n- Gebruik ALLEEN informatie die letterlijk in de aangeleverde tekst of het dossier staat\n- Geen diagnoses stellen \u2014 gebruik \"beeld passend bij\" of \"vermoeden van\"\n- Geen echografische of radiologische bevindingen\n- Geen markdown, geen sterretjes, geen vetgedrukte tekst \u2014 gewone platte tekst\n- Informele maar professionele toon\n- Geen naam onder de afsluiting \u2014 sluit af met alleen \"Groet,\"\n- Gebruik NOOIT het woord \"schermutseling\" \u2014 omschrijf als bijv. \"fysiek incident op het werk\"\n\nOPMAAK OPSOMMEND:\nGebruik kopjes per onderdeel. Elk kopje op eigen regel, daarna inhoud op volgende regel(s).\n\nVraag:\n[exact uit tekst / Niet bekend]\n\nPati\u00ebnt:\n[leeftijd] | start traject [datum]\n\nWerkdiagnose:\n[alleen indien letterlijk in tekst, anders: Niet beschikbaar]\n\nObjectief:\n[gemelde bevindingen + PROMs indien vermeld, per bevinding een nieuwe regel met \u2022]\n\nFunctie/ADL:\n[beperkingen zoals benoemd, per punt een nieuwe regel met \u2022]\n\nBehandeling:\n[type behandelingen, per onderdeel een nieuwe regel met \u2022]\nAantal behandelingen: [x]\n\nAanvullend:\n[alleen indien vermeld]\n\nGroet,\n\nOPMAAK VERHALEND:\nZelfde kopjes maar vloeiende zinnen zonder bullets.\n\nVraag:\n[exact uit tekst of Niet bekend]\n\nPati\u00ebnt:\n[leeftijd], start traject [datum], werkdiagnose: [alleen indien letterlijk in tekst].\n\nObjectief:\n[bevindingen in zinnen + PROMs]\n\nFunctie/ADL:\n[beperkingen in zinnen]\n\nBehandeling:\n[in zinnen]; aantal behandelingen: [x].\n\nAanvullend:\n[alleen indien vermeld]\n\nGroet,";

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  var root = document.getElementById("root");
  root.innerHTML = buildHTML();
  bindEvents();
}

function buildHTML() {
  if (state.fase === "resultaat") return buildResultaat();
  return buildInvoer();
}

function buildInvoer() {
  var apiBar = state.apiKey
    ? '<div class="api-bar" style="justify-content:flex-end;gap:8px"><span class="api-saved">API-sleutel opgeslagen</span><button class="api-change" onclick="wijzigKey()">Wijzigen</button></div>'
    : '<div class="api-bar"><label>API-sleutel</label><input type="password" id="apiInput" placeholder="sk-ant-..." value="' + esc(state.apiInput) + '"><button class="save-btn" onclick="slaKeyOp()">Opslaan</button></div>';

  var typeOpties = TYPEN.map(function(t, i) {
    return '<option value="' + i + '"' + (state.type === i ? " selected" : "") + '>' + esc(t) + '</option>';
  }).join("");

  var formaatToggle = '<div class="toggle">'
    + '<button class="toggle-btn ' + (state.formaat === "opsommend" ? "active" : "inactive") + '" onclick="setFormaat(\'opsommend\')">Opsommend</button>'
    + '<button class="toggle-btn ' + (state.formaat === "verhalend" ? "active" : "inactive") + '" onclick="setFormaat(\'verhalend\')">Verhalend</button>'
    + '</div>';

  var invoerToggle = '<div class="toggle" style="margin-bottom:12px">'
    + '<button class="toggle-btn ' + (state.invoer === "pdf" ? "active" : "inactive") + '" onclick="setInvoer(\'pdf\')">&#128196; PDF uploaden</button>'
    + '<button class="toggle-btn ' + (state.invoer === "tekst" ? "active" : "inactive") + '" onclick="setInvoer(\'tekst\')">&#9999; Zelf invullen</button>'
    + '</div>';

  var misLeeftijd = state.geprobeerd && !state.leeftijd.trim();
  var misStart    = state.geprobeerd && !state.start.trim();
  var misPdf      = state.geprobeerd && state.invoer === "pdf" && !state.pdfData;

  var klinisch;
  if (state.invoer === "pdf") {
    var pdfClass = "pdf-zone" + (state.pdfNaam ? " has-file" : "") + (misPdf ? " missing" : "");
    var pdfInner = state.pdfNaam
      ? '<div class="pdf-icon">&#128196;</div><div class="pdf-name">' + esc(state.pdfNaam) + '</div><div class="pdf-hint">Klik om een ander bestand te kiezen</div>'
      : '<div class="pdf-icon">&#11014;</div><div class="pdf-name" style="color:' + (misPdf ? "#c0328a" : "#82176D") + '">' + (misPdf ? "Vereist \u2014 upload een PDF" : "Klik om dossier te uploaden") + '</div><div class="pdf-hint">EPD-export of brief als PDF</div>';
    klinisch = '<div class="' + pdfClass + '" onclick="document.getElementById(\'pdfInput\').click()">'
      + '<input type="file" id="pdfInput" accept="application/pdf" style="display:none">'
      + pdfInner + '</div>';
  } else {
    klinisch = '<div class="card" style="display:flex;flex-direction:column;gap:14px">'
      + veld("klacht", "Klacht &amp; anamnese", state.klacht, "Ontstaanswijze, beloop, pijnscore, ADL-beperkingen...", true, false, 88)
      + veld("onderzoek", "Bevindingen lichamelijk onderzoek", state.onderzoek, "ROM, kracht, klinische tests (geen echo/r\u00f6ntgen)...", true, false, 88)
      + veld("behandeling", "Behandeling tot nu toe", state.behandeling, "Type, frequentie, duur, effect, aantal sessies...", true, false, 66)
      + '</div>';
  }

  var waarschuwing = (state.geprobeerd && (misLeeftijd || misStart || misPdf))
    ? '<div class="warning">Vul de verplichte velden in voordat je de rapportage genereert.</div>' : "";
  var foutmelding = state.error ? '<div class="error-msg">' + esc(state.error) + '</div>' : "";
  var btnTekst = state.loading
    ? '<span class="spinner"></span>Rapportage genereren...'
    : 'Genereer rapportage \u2192';

  return apiBar
    + '<div class="hero">'
    + '<div class="hero-badge">&#128232; Siilo &middot; Rapportage</div>'
    + '<div class="hero-ring">&#129360;</div>'
    + '<h1>Schouderrapportage</h1>'
    + '<p>UMOOOVE-conform &middot; Informeel &middot; Klaar voor Siilo</p>'
    + '<span class="hero-pill">Fyzio Totaal</span>'
    + '</div>'
    + '<div class="body">'
    + '<div class="section"><span class="section-label">Rapportagetype</span>'
    + '<div class="card"><select onchange="setType(this.value)">' + typeOpties + '</select></div></div>'
    + '<div class="section"><span class="section-label">Outputformaat</span>' + formaatToggle + '</div>'
    + '<div class="section"><span class="section-label">Basisgegevens</span>'
    + '<div class="card" style="display:flex;flex-direction:column;gap:14px">'
    + veld("leeftijd", "Leeftijd", state.leeftijd, "bijv. 42 jaar", false, misLeeftijd)
    + veld("start", "Startdatum traject", state.start, "bijv. maart 2025", false, misStart)
    + veld("vraag", "Vraag / reden van contact", state.vraag, "Wat is de concrete vraag aan de ontvanger?", true, false, 54)
    + '</div></div>'
    + '<div class="section"><span class="section-label">Klinische informatie</span>'
    + invoerToggle + klinisch + '</div>'
    + '<div class="section"><span class="section-label">Aanvullend</span>'
    + '<div class="card">'
    + '<div class="field-label opt" style="margin-bottom:8px">Extra context <span class="tag-opt">Optioneel</span></div>'
    + '<div class="field-input"><textarea rows="3" oninput="setState(\'extra\',this.value)" placeholder="PROMs, 3S-score, specifieke wensen voor de ontvanger...">' + esc(state.extra) + '</textarea></div>'
    + '</div></div>'
    + waarschuwing + foutmelding
    + '<button class="btn-primary" onclick="genereer()" ' + (state.loading ? "disabled" : "") + '>' + btnTekst + '</button>'
    + '</div>';
}

function veld(key, label, waarde, placeholder, optioneel, mis, hoogte) {
  var tagHTML = mis
    ? '<span class="tag-mis">Vereist \u2014 vul in</span>'
    : (optioneel ? '<span class="tag-opt">Optioneel</span>' : '<span class="tag-req">Verplicht</span>');
  var labelClass = optioneel ? "field-label opt" : "field-label";
  var inputClass = "field-input" + (mis ? " missing" : "");
  var inputHTML;
  if (hoogte) {
    inputHTML = '<textarea style="min-height:' + hoogte + 'px" oninput="setState(\'' + key + '\',this.value)" placeholder="' + esc(placeholder) + '">' + esc(waarde) + '</textarea>';
  } else {
    inputHTML = '<input type="text" value="' + esc(waarde) + '" oninput="setState(\'' + key + '\',this.value)" placeholder="' + esc(placeholder) + '">';
  }
  return '<div class="field"><div class="' + labelClass + '">' + label + ' ' + tagHTML + '</div><div class="' + inputClass + '">' + inputHTML + '</div></div>';
}

function buildResultaat() {
  var regels = state.resultaat.split("\n");
  var bodyHTML = regels.map(function(r, i) {
    var kopjes = ["Vraag:", "Pati\u00ebnt:", "Werkdiagnose:", "Objectief:", "Functie/ADL:", "Behandeling:", "Aanvullend:"];
    var isKopje = kopjes.indexOf(r.trim()) !== -1;
    return isKopje ? '<span class="kopje">' + esc(r) + '</span>' : esc(r) + (i < regels.length - 1 ? "\n" : "");
  }).join("");

  var resultaatInhoud = state.bewerk
    ? '<textarea class="result-edit" oninput="setState(\'resultaat\',this.value)">' + esc(state.resultaat) + '</textarea>'
    : '<div class="result-body">' + bodyHTML + '</div>';

  return '<div class="hero">'
    + '<div class="hero-badge">&#128232; Siilo &middot; Rapportage</div>'
    + '<div class="hero-ring">&#129360;</div>'
    + '<h1>Schouderrapportage</h1>'
    + '<p>UMOOOVE-conform &middot; Informeel &middot; Klaar voor Siilo</p>'
    + '<span class="hero-pill">Fyzio Totaal</span>'
    + '</div>'
    + '<div class="body">'
    + '<span class="badge-ready">&#10003; Siilo-ready</span>'
    + '<div class="result-card">'
    + '<div class="result-header"><span>' + esc(TYPEN[state.type].split("\u2013")[0].trim()) + '</span>'
    + '<div class="result-btns">'
    + '<button class="result-btn ' + (state.bewerk ? "editing" : "") + '" onclick="toggleBewerk()">' + (state.bewerk ? "&#10003; Klaar" : "Bewerken") + '</button>'
    + '<button class="result-btn" onclick="kopieer()">' + (state.copied ? "&#10003; Gekopieerd" : "Kopieer") + '</button>'
    + '</div></div>'
    + resultaatInhoud
    + '</div>'
    + '<div class="divider"></div>'
    + '<button class="btn-secondary" onclick="reset()">+ Nieuwe rapportage</button>'
    + '</div>';
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Events ────────────────────────────────────────────────────────────────
function bindEvents() {
  var pdfInput = document.getElementById("pdfInput");
  if (pdfInput) {
    pdfInput.addEventListener("change", function(e) {
      var file = e.target.files[0];
      if (!file) return;
      state.pdfNaam = file.name;
      var reader = new FileReader();
      reader.onload = function() {
        state.pdfData = reader.result.split(",")[1];
        render();
      };
      reader.readAsDataURL(file);
    });
  }
  var apiInput = document.getElementById("apiInput");
  if (apiInput) {
    apiInput.addEventListener("keydown", function(e) { if (e.key === "Enter") slaKeyOp(); });
    apiInput.addEventListener("input", function(e) { state.apiInput = e.target.value; });
  }
}

function setState(key, val) { state[key] = val; }
function setType(val) { state.type = parseInt(val); render(); }
function setFormaat(val) { state.formaat = val; render(); }
function setInvoer(val) {
  state.invoer = val;
  if (val === "pdf") { state.klacht = ""; state.onderzoek = ""; state.behandeling = ""; }
  else { state.pdfData = null; state.pdfNaam = ""; }
  render();
}
function slaKeyOp() {
  state.apiKey = state.apiInput;
  localStorage.setItem("ft_apikey", state.apiKey);
  state.apiInput = "";
  render();
}
function wijzigKey() {
  localStorage.removeItem("ft_apikey");
  state.apiKey = "";
  render();
}
function toggleBewerk() { state.bewerk = !state.bewerk; render(); }
function kopieer() {
  var el = document.createElement("textarea");
  el.value = state.resultaat;
  document.body.appendChild(el);
  el.select();
  document.execCommand("copy");
  document.body.removeChild(el);
  state.copied = true;
  render();
  setTimeout(function() { state.copied = false; render(); }, 2000);
}
function reset() {
  state.fase = "invoer"; state.resultaat = ""; state.error = ""; state.geprobeerd = false;
  state.type = 0; state.formaat = "opsommend"; state.invoer = "pdf";
  state.pdfData = null; state.pdfNaam = "";
  state.leeftijd = ""; state.start = ""; state.vraag = "";
  state.klacht = ""; state.onderzoek = ""; state.behandeling = ""; state.extra = "";
  state.bewerk = false;
  render();
}

// ── API aanroep ───────────────────────────────────────────────────────────
function genereer() {
  state.geprobeerd = true;
  var misLeeftijd = !state.leeftijd.trim();
  var misStart    = !state.start.trim();
  var misPdf      = state.invoer === "pdf" && !state.pdfData;
  if (misLeeftijd || misStart || misPdf) { render(); return; }
  if (!state.apiKey) { state.error = "Sla eerst je API-sleutel op."; render(); return; }

  state.error = ""; state.resultaat = ""; state.loading = true; render();

  var formatInstr = state.formaat === "opsommend"
    ? "Gebruik het OPSOMMEND format met kopjes en bullets (\u2022)."
    : "Gebruik het VERHALEND format met kopjes en vloeiende zinnen zonder bullets.";

  var messages;
  if (state.pdfData) {
    var pdfTekst = "Rapportagetype: " + TYPEN[state.type] + "\n" + formatInstr + "\nLeeftijd: " + state.leeftijd + "\nStart traject: " + state.start;
    if (state.vraag) pdfTekst += "\nVraag/reden contact: " + state.vraag;
    if (state.extra) pdfTekst += "\nAanvullend: " + state.extra;
    pdfTekst += "\nHaal klacht, anamnese, lichamelijk onderzoek en behandeling uit het bijgevoegde dossier. Geen echo- of röntgenbevindingen. Geen naam onder de afsluiting, sluit af met alleen Groet,";
    messages = [{ role: "user", content: [
      { type: "document", source: { type: "base64", media_type: "application/pdf", data: state.pdfData } },
      { type: "text", text: pdfTekst }
    ]}];
  } else {
    var tekst = "Rapportagetype: " + TYPEN[state.type] + "\n" + formatInstr + "\nLeeftijd: " + state.leeftijd + "\nStart traject: " + state.start;
    if (state.vraag)       tekst += "\nVraag/reden contact: " + state.vraag;
    if (state.klacht)      tekst += "\nKlacht/anamnese: " + state.klacht;
    if (state.onderzoek)   tekst += "\nLichamelijk onderzoek: " + state.onderzoek;
    if (state.behandeling) tekst += "\nBehandeling: " + state.behandeling;
    if (state.extra)       tekst += "\nAanvullend: " + state.extra;
    tekst += "\nSchrijf de rapportage. Geen naam onder de afsluiting, sluit af met alleen Groet,";
    messages = [{ role: "user", content: tekst }];
  }

  var requestBody = JSON.stringify({
    model: "claude-sonnet-4-5",
    max_tokens: 1000,
    temperature: 0,
    system: SYSTEM,
    messages: messages
  });

  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": state.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: requestBody
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.error) throw new Error(data.error.message);
    var tekst = "";
    for (var i = 0; i < (data.content || []).length; i++) {
      tekst += data.content[i].text || "";
    }
    if (!tekst) throw new Error("Geen resultaat ontvangen.");
    state.resultaat = TYPEN[state.type] + "\n\n" + tekst;
    state.fase = "resultaat";
    state.loading = false;
    render();
  })
  .catch(function(e) {
    state.error = "Er ging iets mis: " + e.message;
    state.loading = false;
    render();
  });
}

// Start
render();
</script>
</body>
</html>
