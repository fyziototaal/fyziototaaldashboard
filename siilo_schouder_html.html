  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .hero p { font-size: 13px; color: rgba(255,255,255,0.78); margin-bottom: 16px; }
    .hero-pill { display: inline-block; background: #00B6E8; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 7px 18px; border-radius: 20px; }

    .api-bar { background: #fff; border-bottom: 1px solid #e2d5df; padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
    .api-bar label { font-size: 12px; font-weight: 600; color: #82176D; white-space: nowrap; }
    .api-bar input { flex: 1; font-family: 'Poppins', sans-serif; font-size: 13px; border: 1px solid #d8c7d4; border-radius: 8px; padding: 6px 10px; outline: none; }
    .api-bar input:focus { border-color: #82176D; }
    .save-btn { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: none; background: linear-gradient(120deg, #4a0f42, #82176D); color: #fff; cursor: pointer; }
    .api-saved { font-size: 12px; color: #aaa; }

    .body { padding: 24px 20px 48px; background: #f3eef2; }
    .section { margin-bottom: 18px; }
    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: #82176D; margin-bottom: 10px; display: block; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 14px rgba(130,23,109,0.07); padding: 16px 18px; }

    select, textarea, input[type=text], input[type=date] {
      width: 100%; font-family: 'Poppins', sans-serif; font-size: 13.5px; color: #1a1a1a;
      background: transparent; border: none; outline: none; line-height: 1.6;
    }
    select { cursor: pointer; }
    textarea { resize: vertical; }
    input[type=date] { cursor: pointer; }

    .toggle { display: flex; gap: 6px; }
    .toggle-btn { flex: 1; padding: 9px 0; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; border-radius: 10px; border: 1.5px solid transparent; cursor: pointer; transition: all 0.15s; }
    .toggle-btn.active { background: linear-gradient(120deg, #4a0f42, #82176D); color: #fff; }
    .toggle-btn.inactive { background: #fff; color: #82176D; border-color: #d8c7d4; }

    .pdf-zone { border: 2px dashed #d8c7d4; border-radius: 12px; padding: 28px 16px; text-align: center; cursor: pointer; background: #faf7fb; transition: border-color 0.15s; }
    .pdf-zone:hover { border-color: #82176D; background: #f8f0f6; }
    .pdf-zone.has-file { border-color: #82176D; border-style: solid; background: #f8f0f6; }
    .pdf-zone.missing { border-color: #f5b8d8; }
    .pdf-icon { font-size: 30px; margin-bottom: 8px; }
    .pdf-name { font-size: 14px; font-weight: 600; color: #82176D; margin-bottom: 4px; }
    .pdf-hint { font-size: 12px; color: #aaa; }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field-label { font-size: 11.5px; font-weight: 600; color: #82176D; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
    .field-label.opt { color: #999; }
    .tag-req { font-size: 10px; background: #f3e3ef; color: #82176D; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .tag-mis { font-size: 10px; background: #fde8f4; color: #c0328a; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .tag-opt { font-size: 10px; background: #f0f0f0; color: #999; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .field-input { background: #faf7fb; border-radius: 10px; border: 1px solid #e2d5df; padding: 9px 13px; }
    .field-input.missing { border-color: #f5b8d8; background: #fdf5fa; }

    .warning { font-size: 13px; color: #7a4f00; margin-bottom: 14px; padding: 10px 14px; background: #fff8e6; border-radius: 10px; border: 1px solid #f0d080; }
    .error-msg { font-size: 13px; color: #82176D; margin-bottom: 12px; padding: 10px 14px; background: #fdf0f7; border-radius: 10px; border: 1px solid #e8c2da; }

    .btn-primary { width: 100%; padding: 13px 0; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; border: none; border-radius: 12px; background: linear-gradient(120deg, #4a0f42 0%, #82176D 100%); color: #fff; cursor: pointer; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.91; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 11px 0; font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 600; border: 1.5px solid #d8c7d4; border-radius: 12px; background: #fff; color: #82176D; cursor: pointer; }
    .btn-secondary:hover { background: #f8f0f6; }

    .result-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 14px rgba(130,23,109,0.08); overflow: hidden; margin-bottom: 18px; }
    .result-header { background: linear-gradient(120deg, #4a0f42 0%, #82176D 100%); padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; }
    .result-header span { font-size: 13px; font-weight: 600; color: #fff; }
    .result-btns { display: flex; gap: 6px; }
    .result-btn { font-family: 'Poppins', sans-serif; font-size: 11.5px; font-weight: 600; padding: 5px 14px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.13); color: #fff; cursor: pointer; }
    .result-btn:hover { background: rgba(255,255,255,0.25); }
    .result-btn.editing { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.85); }
    .result-body { padding: 18px 20px; font-size: 13.5px; line-height: 1.85; color: #1a1a1a; white-space: pre-wrap; font-family: 'Poppins', sans-serif; }
    .result-edit { width: 100%; min-height: 230px; font-size: 13.5px; line-height: 1.85; color: #1a1a1a; font-family: 'Poppins', sans-serif; padding: 18px 20px; border: none; outline: none; resize: vertical; background: #faf7fb; display: block; }

    .badge-ready { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; background: #dcf4fb; color: #00728e; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px; }
    .divider { height: 1px; background: #e2d5df; margin: 18px 0; }
    .spinner { display: inline-block; width: 15px; height: 15px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ft-footer { background: #4a0f42; color: rgba(255,255,255,0.45); text-align: center; padding: 14px 1rem; font-size: 11.5px; font-family: 'Poppins', sans-serif; }
    .ver { color: #00B6E8; font-weight: 600; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
var APP_VERSION = "2026-09-23.1";

var state = {
  apiKey: localStorage.getItem("ft_apikey") || "",
  fase: "invoer",
  type: 0,
  formaat: "opsommend",
  invoer: "pdf",
  pdfData: null,
  pdfNaam: "",
  leeftijd: "",
  start: "",
  vraag: "",
  klacht: "",
  onderzoek: "",
  behandeling: "",
  extra: "",
  resultaat: "",
  loading: false,
  error: "",
  copied: false,
  bewerk: false,
  geprobeerd: false
};

var TYPEN = [
  "Huisarts – vraag over mogelijke medische interventie",
  "Huisarts – verzoek beoordeling/verwijzing orthopeed",
  "Orthopeed – vraag indicatie doorverwijzing",
  "Orthopeed – evaluatie na conservatief traject",
  "Orthopeed – postoperatief voortgangsverslag",
  "Tussenevaluatie langdurig traject",
  "Spoed / afwijkend beloop"
];

var SYSTEM = "Je bent een medische rapportage-assistent voor fysiotherapeuten in Nederland.\n\n"
  + "Je schrijft Siilo-berichten in de stijl van een ervaren fysiotherapeut: zakelijk, bondig, professioneel — maar niet formeel als een brief. "
  + "Denk aan hoe een collega een beknopte, klinisch inhoudelijke vraag stelt aan een huisarts of orthopeed.\n\n"
  + "STIJL & OPBOUW (volg dit strikt):\n"
  + "- 3 compacte alinea’s, totaal maximaal 8–10 zinnen\n"
  + "- Alinea 1: reden van contact + leeftijd + startdatum + hoofdklacht/ontstaanswijze (1–2 zinnen)\n"
  + "- Alinea 2: beloop + meest relevante bevindingen LO + eventueel relevante scores (SPADI, NRS) (2–3 zinnen)\n"
  + "- Alinea 3: klinische redenering in één zin + concrete vraag aan ontvanger\n"
  + "- Afsluiting: alleen ‘Groet,’ op een nieuwe regel (geen naam)\n"
  + "- Geen kopjes, geen bullets, geen alineatitels\n"
  + "- Gebruik medische vakterm als die kort en duidelijk is (bijv. ‘subscapularistest afwijkend’, ‘SPADI 65’)\n\n"
  + "TOON:\n"
  + "- Professioneel maar collegiaal — niet te formeel, niet te informeel\n"
  + "- Directe, actieve zinsbouw\n"
  + "- Gebruik gewone Nederlandse fysiotherapeutische vaktaal\n"
  + "- Het mag klinken als een fysiotherapeut die een collega-specialist aanspreekt\n\n"
  + "VOORBEELD (gebruik als stijlreferentie voor structuur en toon — kopieer nooit letterlijk):\n"
  + "Graag je beoordeling of insturen van belang is voor dhr. X i.v.m. aanhoudende traumatische klachten aan de linker schouder.\n\n"
  + "Patiënt is 1,5 week geleden op de schouder gevallen tijdens een schermutseling op het werk (meneer is beveiliger). Direct daarna veel pijn, duizeligheid en misselijkheid (inmiddels geweken, overige rode vlaggen/neurologie negatief). Het herstel stagneert; hij houdt veel pijn bij heffen/roteren en heeft ook in rust en ‘s nachts klachten (SPADI-score 65).\n\n"
  + "Lichamelijk onderzoek: actief/passief beperkt en pijnlijk. Bicepsprovocaties en subscapularistesten zijn pijnlijk/afwijkend. Gezien het trauma, het beloop en het vermoeden van een structureel letsel wil ik hem graag insturen. Acht jij dit ook verstandig?\n\n"
  + "Groet,\n\n"
  + "STRIKTE REGELS:\n"
  + "- Gebruik ALLEEN informatie die letterlijk in de tekst of het dossier staat\n"
  + "- Geen diagnoses stellen — gebruik ‘beeld passend bij’ of ‘vermoeden van’\n"
  + "- Geen echografische of radiologische bevindingen vermelden tenzij dit letterlijk in het dossier staat als fysiotherapeutisch relevant\n"
  + "- Geen naam onder de afsluiting — alleen ‘Groet,’\n"
  + "- Geen markdown, geen sterretjes, geen vetgedrukte tekst\n"
  + "- Schrijf in de derde persoon over de patiënt (hij/zij/dhr./mevr.)";

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function datumNaarDisplay(iso) {
  if (!iso) return "";
  var d = iso.split("-");
  if (d.length !== 3) return iso;
  return d[2] + "-" + d[1] + "-" + d[0];
}

function render() {
  var html = "";

  if (state.apiKey) {
    html += '<div class="api-bar" style="justify-content:flex-end;gap:8px">'
      + '<span class="api-saved">API-sleutel opgeslagen</span>'
      + '<button class="api-change" onclick="wijzigKey()">Wijzigen</button></div>';
  } else {
    html += '<div class="api-bar"><label>API-sleutel</label>'
      + '<input type="password" id="apiInput" placeholder="sk-ant-..." value="">'
      + '<button class="save-btn" onclick="slaKeyOp()">Opslaan</button></div>';
  }

  html += '<div class="hero">'
    + '<div class="hero-badge">&#128232; Siilo &middot; Rapportage</div>'
    + '<div class="hero-ring">&#128232;</div>'
    + '<h1>Schouderrapportage</h1>'
    + '<p>UMOOOVE-conform &middot; Informeel &middot; Klaar voor Siilo</p>'
    + '<span class="hero-pill">Fyzio Totaal</span>'
    + '</div>';

  html += state.fase === "invoer" ? buildInvoer() : buildResultaat();

  html += '<div class="ft-footer"><strong>Fyzio Totaal</strong> &middot; Schouderrapportage &middot; <span class="ver">v2026-09-23.1</span></div>';

  document.getElementById("app").innerHTML = html;
  bindEvents();
}

function buildInvoer() {
  var misLeeftijd = state.geprobeerd && !state.leeftijd.trim();
  var misStart    = state.geprobeerd && !state.start.trim();
  var misPdf      = state.geprobeerd && state.invoer === "pdf" && !state.pdfData;

  var typeOpties = "";
  for (var i = 0; i < TYPEN.length; i++) {
    typeOpties += '<option value="' + i + '"' + (state.type === i ? " selected" : "") + '>' + esc(TYPEN[i]) + '</option>';
  }

  var klinisch = "";
  if (state.invoer === "pdf") {
    var pdfClass = "pdf-zone" + (state.pdfNaam ? " has-file" : "") + (misPdf ? " missing" : "");
    klinisch = '<div class="' + pdfClass + '" onclick="document.getElementById(\'pdfInput\').click()">'
      + '<input type="file" id="pdfInput" accept="application/pdf" style="display:none">'
      + '<div class="pdf-icon">' + (state.pdfNaam ? "&#128196;" : "&#11014;") + '</div>';
    if (state.pdfNaam) {
      klinisch += '<div class="pdf-name">' + esc(state.pdfNaam) + '</div><div class="pdf-hint">Klik om een ander bestand te kiezen</div>';
    } else {
      klinisch += '<div class="pdf-name" style="color:' + (misPdf ? "#c0328a" : "#82176D") + '">'
        + (misPdf ? "Vereist — upload een PDF" : "Klik om dossier te uploaden") + '</div>'
        + '<div class="pdf-hint">EPD-export of brief als PDF</div>';
    }
    klinisch += '</div>';
  } else {
    klinisch = '<div class="card" style="display:flex;flex-direction:column;gap:14px">'
      + maakVeld("klacht", "Klacht &amp; anamnese", state.klacht, "Ontstaanswijze, beloop, pijnscore, ADL-beperkingen...", true, false, 88)
      + maakVeld("onderzoek", "Bevindingen lichamelijk onderzoek", state.onderzoek, "ROM, kracht, klinische tests (geen echo/röntgen)...", true, false, 88)
      + maakVeld("behandeling", "Behandeling tot nu toe", state.behandeling, "Type, frequentie, duur, effect, aantal sessies...", true, false, 66)
      + '</div>';
  }

  var h = '<div class="body">';

  h += '<div class="section"><span class="section-label">Rapportagetype</span>'
    + '<div class="card"><select onchange="setType(this.value)">' + typeOpties + '</select></div></div>';

  h += '<div class="section"><span class="section-label">Outputformaat</span>'
    + '<div class="toggle">'
    + '<button class="toggle-btn ' + (state.formaat==="opsommend"?"active":"inactive") + '" onclick="setFormaat(\'opsommend\')">Opsommend</button>'
    + '<button class="toggle-btn ' + (state.formaat==="verhalend"?"active":"inactive") + '" onclick="setFormaat(\'verhalend\')">Verhalend</button>'
    + '</div></div>';

  // Basisgegevens
  h += '<div class="section"><span class="section-label">Basisgegevens</span>'
    + '<div class="card" style="display:flex;flex-direction:column;gap:14px">';

  // Leeftijd
  var lTag = misLeeftijd ? '<span class="tag-mis">Vereist — vul in</span>' : '<span class="tag-req">Verplicht</span>';
  h += '<div class="field"><div class="field-label">Leeftijd ' + lTag + '</div>'
    + '<div class="field-input' + (misLeeftijd ? " missing" : "") + '">'
    + '<input type="text" value="' + esc(state.leeftijd) + '" oninput="state.leeftijd=this.value" placeholder="bijv. 42 jaar">'
    + '</div></div>';

  // Startdatum als echte datepicker (DD-MM-JJJJ)
  var sTag = misStart ? '<span class="tag-mis">Vereist — vul in</span>' : '<span class="tag-req">Verplicht</span>';
  h += '<div class="field"><div class="field-label">Startdatum traject ' + sTag + '</div>'
    + '<div class="field-input' + (misStart ? " missing" : "") + '">'
    + '<input type="date" value="' + esc(state.start) + '" onchange="state.start=this.value">'
    + '</div></div>';

  // Vraag
  h += maakVeld("vraag", "Vraag / reden van contact", state.vraag, "Wat wil je concreet vragen aan de ontvanger?", true, false, 54);
  h += '</div></div>';

  h += '<div class="section"><span class="section-label">Klinische informatie</span>'
    + '<div class="toggle" style="margin-bottom:12px">'
    + '<button class="toggle-btn ' + (state.invoer==="pdf"?"active":"inactive") + '" onclick="setInvoer(\'pdf\')">&#128196; PDF uploaden</button>'
    + '<button class="toggle-btn ' + (state.invoer==="tekst"?"active":"inactive") + '" onclick="setInvoer(\'tekst\')">&#9999; Zelf invullen</button>'
    + '</div>' + klinisch + '</div>';

  h += '<div class="section"><span class="section-label">Aanvullend</span>'
    + '<div class="card">'
    + '<div class="field-label opt" style="margin-bottom:8px">Extra context <span class="tag-opt">Optioneel</span></div>'
    + '<div class="field-input"><textarea rows="3" oninput="state.extra=this.value" placeholder="PROMs, 3S-score, specifieke context...">' + esc(state.extra) + '</textarea></div>'
    + '</div></div>';

  if (state.geprobeerd && (misLeeftijd || misStart || misPdf)) {
    h += '<div class="warning">Vul de verplichte velden in voordat je de rapportage genereert.</div>';
  }
  if (state.error) h += '<div class="error-msg">' + esc(state.error) + '</div>';

  h += '<button class="btn-primary" onclick="genereer()"' + (state.loading ? " disabled" : "") + '>'
    + (state.loading ? '<span class="spinner"></span>Rapportage genereren...' : 'Genereer rapportage →')
    + '</button>';
  h += '</div>';
  return h;
}

function maakVeld(key, label, waarde, placeholder, optioneel, mis, hoogte) {
  var tag = mis
    ? '<span class="tag-mis">Vereist — vul in</span>'
    : (optioneel ? '<span class="tag-opt">Optioneel</span>' : '<span class="tag-req">Verplicht</span>');
  var lClass = optioneel ? "field-label opt" : "field-label";
  var iClass = "field-input" + (mis ? " missing" : "");
  var input = hoogte
    ? '<textarea style="min-height:' + hoogte + 'px" oninput="state.' + key + '=this.value" placeholder="' + esc(placeholder) + '">' + esc(waarde) + '</textarea>'
    : '<input type="text" value="' + esc(waarde) + '" oninput="state.' + key + '=this.value" placeholder="' + esc(placeholder) + '">';
  return '<div class="field"><div class="' + lClass + '">' + label + ' ' + tag + '</div><div class="' + iClass + '">' + input + '</div></div>';
}

function buildResultaat() {
  var inhoud = state.bewerk
    ? '<textarea class="result-edit" oninput="state.resultaat=this.value">' + esc(state.resultaat) + '</textarea>'
    : '<div class="result-body">' + esc(state.resultaat) + '</div>';

  var h = '<div class="body">';
  h += '<span class="badge-ready">&#10003; Siilo-ready</span>';
  h += '<div class="result-card">'
    + '<div class="result-header">'
    + '<span>' + esc(TYPEN[state.type].split("–")[0].trim()) + '</span>'
    + '<div class="result-btns">'
    + '<button class="result-btn ' + (state.bewerk ? "editing" : "") + '" onclick="toggleBewerk()">'
    + (state.bewerk ? "&#10003; Klaar" : "Bewerken") + '</button>'
    + '<button class="result-btn" onclick="kopieer()">' + (state.copied ? "&#10003; Gekopieerd" : "Kopieer") + '</button>'
    + '</div></div>' + inhoud + '</div>';
  h += '<div class="divider"></div><button class="btn-secondary" onclick="reset()">+ Nieuwe rapportage</button>';
  h += '</div>';
  return h;
}

function bindEvents() {
  var pdfInput = document.getElementById("pdfInput");
  if (pdfInput) {
    pdfInput.addEventListener("change", function(e) {
      var file = e.target.files[0];
      if (!file) return;
      state.pdfNaam = file.name;
      var reader = new FileReader();
      reader.onload = function() { state.pdfData = reader.result.split(",")[1]; render(); };
      reader.readAsDataURL(file);
    });
  }
}

function setType(v) { state.type = parseInt(v); }
function setFormaat(v) { state.formaat = v; render(); }
function setInvoer(v) {
  state.invoer = v;
  if (v === "pdf") { state.klacht = ""; state.onderzoek = ""; state.behandeling = ""; }
  else { state.pdfData = null; state.pdfNaam = ""; }
  render();
}
function slaKeyOp() {
  var el = document.getElementById("apiInput");
  if (el && el.value) { state.apiKey = el.value; localStorage.setItem("ft_apikey", state.apiKey); render(); }
}
function wijzigKey() { localStorage.removeItem("ft_apikey"); state.apiKey = ""; render(); }
function toggleBewerk() { state.bewerk = !state.bewerk; render(); }
function kopieer() {
  var el = document.createElement("textarea");
  el.value = state.resultaat;
  document.body.appendChild(el); el.select(); document.execCommand("copy"); document.body.removeChild(el);
  state.copied = true; render();
  setTimeout(function() { state.copied = false; render(); }, 2000);
}
function reset() {
  state.fase = "invoer"; state.resultaat = ""; state.error = ""; state.geprobeerd = false;
  state.type = 0; state.formaat = "opsommend"; state.invoer = "pdf";
  state.pdfData = null; state.pdfNaam = "";
  state.leeftijd = ""; state.start = ""; state.vraag = "";
  state.klacht = ""; state.onderzoek = ""; state.behandeling = ""; state.extra = "";
  state.bewerk = false; render();
}

function genereer() {
  state.geprobeerd = true;
  if (!state.leeftijd.trim() || !state.start.trim() || (state.invoer === "pdf" && !state.pdfData)) {
    render(); return;
  }
  if (!state.apiKey) { state.error = "Sla eerst je API-sleutel op."; render(); return; }

  state.error = ""; state.resultaat = ""; state.loading = true; render();

  var startDisplay = datumNaarDisplay(state.start);

  var formatInstr = state.formaat === "opsommend"
    ? "Schrijf het bericht als vloeiende tekst zonder bullets of kopjes. Je mag de meest relevante meetwaarden (zoals SPADI, NRS) tussendoor compact noemen."
    : "Schrijf het bericht als vloeiende lopende tekst in korte alinea’s.";

  var messages;
  if (state.pdfData) {
    var pt = "Rapportagetype: " + TYPEN[state.type] + "\n"
      + formatInstr + "\n"
      + "Leeftijd patient: " + state.leeftijd + "\n"
      + "Startdatum traject: " + startDisplay + "\n"
      + (state.vraag ? "Concrete vraag aan ontvanger: " + state.vraag + "\n" : "")
      + (state.extra ? "Extra context: " + state.extra + "\n" : "")
      + "Haal de klinische informatie uit het bijgevoegde dossier. "
      + "Geen echo- of rontgenbevindingen. "
      + "Schrijf een kort informeel Siilo-berichtje van maximaal 6-8 zinnen. "
      + "Eindig met de concrete vraag aan de ontvanger gevolgd door alleen 'Groet,'";
    messages = [{ role: "user", content: [
      { type: "document", source: { type: "base64", media_type: "application/pdf", data: state.pdfData } },
      { type: "text", text: pt }
    ]}];
  } else {
    var tt = "Rapportagetype: " + TYPEN[state.type] + "\n"
      + formatInstr + "\n"
      + "Leeftijd patient: " + state.leeftijd + "\n"
      + "Startdatum traject: " + startDisplay + "\n"
      + (state.vraag       ? "Concrete vraag aan ontvanger: " + state.vraag + "\n" : "")
      + (state.klacht      ? "Klacht/anamnese: " + state.klacht + "\n" : "")
      + (state.onderzoek   ? "Lichamelijk onderzoek: " + state.onderzoek + "\n" : "")
      + (state.behandeling ? "Behandeling: " + state.behandeling + "\n" : "")
      + (state.extra       ? "Extra context: " + state.extra + "\n" : "")
      + "Schrijf een kort informeel Siilo-berichtje van maximaal 6-8 zinnen. "
      + "Eindig met de concrete vraag aan de ontvanger gevolgd door alleen 'Groet,'";
    messages = [{ role: "user", content: tt }];
  }

  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": state.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-5",
      max_tokens: 600,
      temperature: 0,
      system: SYSTEM,
      messages: messages
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.error) throw new Error(data.error.message);
    var tekst = "";
    for (var i = 0; i < (data.content || []).length; i++) tekst += data.content[i].text || "";
    if (!tekst) throw new Error("Geen resultaat ontvangen.");
    state.resultaat = tekst;
    state.fase = "resultaat"; state.loading = false; render();
  })
  .catch(function(e) {
    state.error = "Er ging iets mis: " + e.message;
    state.loading = false; render();
  });
}

render();
</script>
</body>
</html>
