<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
  // ===== Versiecheck — VERHOOG BIJ ELKE WIJZIGING (hier én in de comment op regel 1) =====
  const APP_VERSION = "2026-10-07.6";
  (function(){
    function check(){
      fetch(location.pathname + "?_check=" + Date.now(), { cache: "no-store" })
        .then(function(r){ return r.ok ? r.text() : null; })
        .then(function(html){
          if(!html) return;
          var m = html.match(/<!--\s*APP_VERSION:\s*([^\s]+)\s*-->/);
          if(!m || m[1] === APP_VERSION) return;
          // Maximaal één automatische herlaad per nieuwe versie, zodat er nooit een lus ontstaat.
          var key = "tm_reload_" + m[1], done = false;
          try{ done = sessionStorage.getItem(key) === "1"; }catch(e){ done = new URLSearchParams(location.search).has("_v"); }
          if(done){ console.warn("Versiecheck: live " + m[1] + ", geladen " + APP_VERSION + " — niet opnieuw herladen."); return; }
          // Nooit herladen terwijl iemand een testmoment aan het invullen is: dan eerst een melding.
          if(window.tmCanReload && !window.tmCanReload()){ if(window.tmShowUpdate) window.tmShowUpdate(m[1]); return; }
          try{ sessionStorage.setItem(key, "1"); }catch(e){}
          location.replace(location.pathname + "?_v=" + Date.now() + location.hash);
        })
        .catch(function(){ /* offline of fout: doorgaan met de geladen versie */ });
    }
    check();
    // Op de telefoon blijft een tabblad vaak dagen open: check opnieuw zodra de tool weer in beeld komt.
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") check(); });
    window.tmCheckVersion = check;
  })();
</script>
<title>Testen & meten — Fyzio Totaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#f3eef2; --surface:#fff; --surface-2:#f8f3f7; --text:#2A1626; --muted:#7A6478; --border:#e2d5df;
    --accent:#82176D; --accent-dark:#4a0f42; --accent-light:#a8368f; --accent-strong:#6b1259; --accent-hover-light:#8f2d78;
    --accent-soft:#f3e3ef; --cyan:#00B6E8; --cyan-strong:#00728e; --cyan-soft:#dcf4fb;
    --good:#2E8B57; --good-soft:#E5F4EB; --warn:#B4711F; --warn-soft:#FBEEDE; --bad:#B8433A; --bad-soft:#FBE7E5;
    --shadow:0 2px 14px rgba(130,23,109,0.08); --shadow-lg:0 8px 30px rgba(130,23,109,0.16);
    --header-gradient:linear-gradient(120deg,#4a0f42 0%,#82176D 45%,#a8368f 100%);
    --btn-gradient:linear-gradient(135deg,#82176D 0%,#a8368f 100%);
    --btn-gradient-hover:linear-gradient(135deg,#6b1259 0%,#8f2d78 100%);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1220; --surface:#241A29; --surface-2:#2C1F31; --text:#F3EAF1; --muted:#B79CB3; --border:#3C2C3A;
      --accent:#d063b6; --accent-soft:#3A2438; --cyan:#3FD1F0; --cyan-strong:#7FE3F7; --cyan-soft:#123B44;
      --good:#7BCB98; --good-soft:#183625; --warn:#E0A85C; --warn-soft:#332615; --bad:#E58E86; --bad-soft:#3A1E1B;
      --shadow:0 2px 14px rgba(0,0,0,0.35); --shadow-lg:0 8px 30px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1220; --surface:#241A29; --surface-2:#2C1F31; --text:#F3EAF1; --muted:#B79CB3; --border:#3C2C3A;
    --accent:#d063b6; --accent-soft:#3A2438; --cyan:#3FD1F0; --cyan-strong:#7FE3F7; --cyan-soft:#123B44;
    --good:#7BCB98; --good-soft:#183625; --warn:#E0A85C; --warn-soft:#332615; --bad:#E58E86; --bad-soft:#3A1E1B;
    --shadow:0 2px 14px rgba(0,0,0,0.35); --shadow-lg:0 8px 30px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:'Poppins','Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}

  /* Header */
  header.top{position:sticky;top:0;z-index:30;background:var(--header-gradient);border-bottom:4px solid var(--cyan);color:#fff}
  .top-inner{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
  .logo-ring{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:13px;color:#82176D}
  .brand h1{font-size:17px;color:#fff;line-height:1.2}
  .brand small{display:block;color:rgba(255,255,255,.75);font-size:12px;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;min-height:38px}
  .hbtn:hover{background:rgba(255,255,255,.24)}

  main{flex:1 0 auto;width:100%;max-width:1180px;margin:0 auto;padding:22px 16px 60px}
  footer.app-footer{background:#4a0f42;color:rgba(255,255,255,.5);text-align:center;padding:16px;font-size:12.5px}
  footer.app-footer strong{color:rgba(255,255,255,.85)}

  /* Cards & layout */
  .card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px;border:1px solid transparent}
  .card + .card{margin-top:16px}
  .card h2{font-size:17px;margin-bottom:4px}
  .card h3{font-size:15px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:40px;transition:background .15s,box-shadow .15s,transform .05s;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--btn-gradient);color:#fff;border:none;box-shadow:0 2px 8px rgba(130,23,109,.25)}
  .btn.primary:hover{background:var(--btn-gradient-hover);box-shadow:0 4px 14px rgba(130,23,109,.32)}
  .btn.primary:focus-visible{outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
  .btn.danger{color:var(--bad)}
  .btn.small{padding:5px 10px;min-height:32px;font-size:12.5px;border-radius:10px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 2px}
  .linkbtn:hover{text-decoration:underline}
  .iconbtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:6px;border-radius:8px;min-width:32px;min-height:32px}
  .iconbtn:hover{background:var(--surface-2);color:var(--bad)}

  /* Forms */
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .inp,select.inp,textarea.inp{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:40px;font-weight:500;color:var(--text);width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  textarea.inp{min-height:70px;resize:vertical}
  input[type=checkbox]{accent-color:#82176D;width:17px;height:17px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}

  /* Tags & badges */
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .tag.purple{background:var(--accent-soft);color:var(--accent)}
  .tag.blue{background:var(--cyan-soft);color:var(--cyan-strong)}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .badge.good{background:var(--good-soft);color:var(--good)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.bad{background:var(--bad-soft);color:var(--bad)}
  .badge.neutral{background:var(--cyan-soft);color:var(--cyan-strong)}
  .badge.grey{background:var(--surface-2);color:var(--muted)}

  /* Start */
  .hero{background:var(--header-gradient);border-radius:24px;color:#fff;padding:28px 24px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(0,182,232,.18)}
  .hero h2{font-size:24px;margin-bottom:6px}
  .hero p{margin:0;color:rgba(255,255,255,.82);max-width:560px}
  .start-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}
  @media(max-width:820px){.start-grid{grid-template-columns:1fr}}
  .recent{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .recent button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:9px 12px;cursor:pointer}
  .recent button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}

  /* Patient header */
  .phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .phead .avatar{width:52px;height:52px;font-size:20px}
  .phead h2{font-size:22px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .stat{background:var(--surface-2);border-radius:12px;padding:6px 12px;font-size:12.5px}
  .stat b{font-size:15px;color:var(--accent)}

  .tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
  .tab{background:none;border:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
  .chip.active,.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  /* Tables */
  .tbl-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--border);border-radius:14px}
  table.tbl{border-collapse:collapse;width:100%;font-size:13px}
  .tbl th{background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;white-space:nowrap}
  .tbl td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
  .tbl td.date{white-space:nowrap;font-weight:600}
  .cellv{white-space:nowrap}
  .cellv .lr{color:var(--muted);font-size:11px;font-weight:600;margin-right:2px}
  .delta{font-size:11.5px;font-weight:600;margin-left:4px}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.eq{color:var(--muted)}

  .testcard-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .testcard-head h3{flex:1;min-width:180px}
  .chart{margin-top:12px;background:var(--surface-2);border-radius:14px;padding:10px}
  .chart svg{display:block;width:100%;max-width:760px;height:auto}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 4px 0}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

  /* Moment editor */
  .editor{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
  .picker{position:sticky;top:84px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
  .picker .scroll{overflow-y:auto;margin:0 -6px;padding:0 6px}
  .only-mobile{display:none}
  @media(max-width:980px){
    .editor{grid-template-columns:1fr}
    .picker{display:none}
    body.picker-open{overflow:hidden}
    body.picker-open .picker{display:flex;position:fixed;inset:0;z-index:150;border-radius:0;max-height:none;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
    .picker .scroll{flex:1;max-height:none;-webkit-overflow-scrolling:touch}
    .only-mobile{display:inline-flex}
  }
  @media(max-width:600px){
    .inp,select.inp,textarea.inp,#pq{font-size:16px}
    main{padding:14px 12px 40px}
    .card{padding:16px;border-radius:18px}
    .pill{display:none}
    .hbtn .lbl{display:none}
    .top-inner{padding:10px 12px;flex-wrap:nowrap}
    .brand h1{font-size:16px}
    .phead .row{width:100%}
    .phead .row .btn.primary{flex:1 1 100%}
    .savebar{margin:16px -12px 0;border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
    .savebar #save-info{width:100%}
    .savebar .btn{flex:1}
    .tiles{grid-template-columns:1fr 1fr}
    .hero{padding:22px 18px}.hero h2{font-size:21px}
    .phead{align-items:flex-start;gap:12px}.phead > .avatar{width:40px;height:40px;font-size:16px}.phead h2{font-size:19px}
    .stats{gap:6px}.stat{padding:4px 10px;font-size:12px}
  }
  .update-bar{position:fixed;left:12px;right:12px;top:84px;z-index:180;background:#2A1626;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-lg);font-size:13px;max-width:560px;margin:0 auto}
  .update-bar .btn{min-height:34px}
  @media(max-width:980px){#toast{bottom:110px}}
  .search{position:relative}
  .search .inp{padding-left:38px}
  .search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
  .crumbs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12.5px;margin:12px 0 8px}
  .crumbs button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 4px;border-radius:6px}
  .crumbs button:hover{background:var(--accent-soft)}
  .crumbs span.sep{color:var(--muted)}
  .crumbs span.cur{font-weight:700}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .tile:hover{border-color:var(--accent);background:var(--accent-soft)}
  .tile .ic{font-size:20px}
  .tile b{font-size:13.5px}
  .tile small{color:var(--muted);font-size:11.5px}
  .tlist{display:flex;flex-direction:column;gap:6px}
  .titem{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
  .titem:hover{border-color:var(--accent)}
  .titem .tn{flex:1;min-width:0}
  .titem .tn b{display:block;font-size:13px;font-weight:600}
  .titem .tn small{color:var(--muted);font-size:11.5px}
  .titem .add{color:var(--accent);font-weight:700;font-size:12.5px;white-space:nowrap}
  .titem.added{background:var(--accent-soft);border-color:transparent}
  .titem.added .add{color:var(--good)}
  .quick{background:var(--surface-2);border-radius:14px;padding:10px;margin-top:12px}
  .quick .chips{margin:6px 0 0}

  .rcard{border:1px solid var(--border);border-radius:16px;padding:14px;background:var(--surface)}
  .rcard + .rcard{margin-top:12px}
  .rcard-head{display:flex;gap:8px;align-items:flex-start}
  .rcard-head h4{font-size:14.5px;flex:1}
  .info{background:var(--cyan-soft);color:var(--text);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;white-space:pre-line}
  .sidegrid{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 1fr;gap:8px;align-items:center;margin-top:10px}
  .sidegrid .h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .sidegrid .lbl{font-size:13px;font-weight:600}
  .sidegrid .lbl small{color:var(--muted);font-weight:500}
  @media(max-width:520px){.sidegrid{grid-template-columns:1fr 1fr}.sidegrid .lbl{grid-column:1/-1;margin-top:4px}.sidegrid .h.first{display:none}}
  .sgn{display:flex;gap:6px;min-width:0}.sgn select{flex:0 0 auto;width:auto;padding-right:26px}.sgn input{flex:1;min-width:0}
  .mailbox{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .calc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:0}
  .calc:empty{display:none}
  .items{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .item{display:grid;grid-template-columns:28px 1fr minmax(160px,260px);gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--border)}
  .item:first-child{border-top:none}
  .item .nr{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .item .nm{font-size:13px;font-weight:500}
  .item .grp{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
  @media(max-width:620px){.item{grid-template-columns:28px 1fr}.item select{grid-column:1/-1}}
  .empty{text-align:center;padding:30px 16px;color:var(--muted)}
  .empty .big{font-size:34px}

  .moment-list .mcard{border:1px solid var(--border);border-radius:16px;padding:14px 16px;background:var(--surface)}
  .moment-list .mcard + .mcard{margin-top:10px}
  .mres{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
  .mres .r{background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:12.5px}
  .mres .r b{display:block;font-size:12.5px;margin-bottom:2px}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(42,22,38,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
  .modal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;padding:22px}
  .modal.wide{max-width:860px}
  .modal h2{font-size:18px;margin-bottom:6px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .checklist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:8px}
  .checklist label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;cursor:pointer;font-size:13px}
  .checklist label:hover{background:var(--surface-2)}
  .ai-text{white-space:pre-wrap;font-size:13.5px;line-height:1.6}
  .ai-text .h{font-weight:700;color:var(--accent);display:block;margin-top:10px}

  .banner{border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:14px}
  .banner.err{background:var(--bad-soft);color:var(--bad)}
  .banner.info{background:var(--cyan-soft);color:var(--cyan-strong)}

<script>
/* =====================================================================
   TESTBIBLIOTHEEK

const DOMAINS = [

  {id:'mob',    n:'Mobiliteit & ROM', ic:'🔄', kw:'mobiliteit beweeglijkheid rom range of motion bewegingsuitslag lenigheid flexibiliteit stijfheid hoek graden'},

];
const SUBKW = {
  'HHD onderste extremiteit':'hhd handheld dynamometer microfet isometrisch been onderste extremiteit',
  'HHD bovenste extremiteit':'hhd handheld dynamometer microfet isometrisch arm bovenste extremiteit',

  'Goniometrie':'goniometer inclinometer gewricht graden hoek',
  'Functionele mobiliteit':'functioneel',

  'Statische balans':'statisch staan',

/* ---- Norm-helpers ---- */
const NB = (lvl, t) => ({lvl, t});
const LSI_NORM = x => x >= 90 ? NB('good','≥90%') : NB('warn','<90%');

const num  = (k,l,u,x={}) => Object.assign({k,l,u,t:'num'},x);
const mmss = (k,l,x={}) => Object.assign({k,l,u:'min:sec',t:'mmss'},x);
const sel  = (k,l,opts,x={}) => Object.assign({k,l,t:'sel',opts},x);
// Extensie met richting: tekort (deficit) of hyperextensie, zodat niemand met + of − hoeft te puzzelen
const sgn  = (k,l) => ({k,l,u:'°',t:'signed',hint:'Kies tekort of hyper, vul het aantal graden in'});

const HHD_INFO = 'Isometrische meting met handheld dynamometer (kg). Neem per zijde de beste van 2–3 pogingen (3–5 s maximaal aanspannen), start met de niet-aangedane zijde. Gebruik bij herhaalmetingen steeds dezelfde positie, hefboomarm en (bij voorkeur) dezelfde tester.\nLSI ≥90% is de gangbare return-to-sport-grens. Absolute kg-normen zijn zonder hefboomarm en lichaamsgewicht niet bruikbaar, daarom toont de tool alleen de LSI.';
const hhd = (id, n, sub, kw, pos) => ({id, n, d:'kracht', s:sub, kw, side:true, f:[num('kg','Kracht','kg')], info:(pos ? 'Positie: ' + pos + '\n' : '') + HHD_INFO});

const chairNorm = (x, ctx) => {
  if(!ctx.leeftijd || !ctx.geslacht) return NB('grey','Vul leeftijd + geslacht in voor norm');
  if(ctx.leeftijd < 60) return null;
  const T = {60:[14,12],65:[12,11],70:[12,10],75:[11,10],80:[10,9],85:[8,8],90:[7,4]};
  const b = Math.min(90, Math.floor(ctx.leeftijd/5)*5);
  const cut = T[b][ctx.geslacht === 'M' ? 0 : 1];
  return x < cut ? NB('bad','Onder gemiddeld (<'+cut+')') : NB('good','Gemiddeld of beter');
};
const gripNorm = (x, ctx) => {
  if(!ctx.geslacht) return NB('grey','Vul geslacht in voor norm');
  const cut = ctx.geslacht === 'M' ? 27 : 16;
  return x < cut ? NB('bad','Laag (<'+cut+' kg, EWGSOP2)') : NB('good','Boven afkappunt');
};
const plankNorm = (x, ctx, v) => {
  if(v.var === 'RKC plank') return x > 45 ? NB('good','Goed (>45 s)') : x >= 30 ? NB('warn','Matig (30–45 s)') : NB('bad','Zwak (<30 s)');
  if(v.var === 'Gewone plank'){
    if(!ctx.leeftijd || !ctx.geslacht) return NB('grey','Vul leeftijd + geslacht in voor norm');
    // [t/m leeftijd, ondergrens gemiddeld, bovengrens gemiddeld, uitstekend vanaf] — gelijk aan de Fitheidstest
    const M = [[29,45,75,99],[39,40,65,80],[49,35,55,70],[59,30,50,65],[200,25,45,60]], V = [[29,30,60,85],[39,25,50,75],[49,20,45,65],[59,15,40,55],[200,10,35,50]];
    const r = (ctx.geslacht === 'M' ? M : V).find(a => ctx.leeftijd <= a[0]);
    return x >= r[3] ? NB('good','Uitstekend (≥'+r[3]+' s)') : x >= r[1] ? NB('neutral','Gemiddeld ('+r[1]+'–'+r[2]+' s)') : NB('warn','Ondergemiddeld (<'+r[1]+' s)');
  }

};

/* ---- Itemschalen ---- */
const generic = (max, labels) => Array.from({length:max+1}, (_,i) => [max-i, labels[i]]);
const BBS_ITEMS = [

};

const SCALE_NOTE = '\nScore per item; het totaal wordt automatisch berekend. Raadpleeg bij twijfel de officiële handleiding voor de exacte scoringscriteria.';

/* ---- De tests ---- */

  {id:'bbs', n:'Berg Balance Scale (BBS)', d:'bal', s:'Schalen (per item)', kw:'berg bbs ouderen valrisico evenwicht cva neurologie', items:BBS_ITEMS,

  {id:'sppb', n:'Short Physical Performance Battery (SPPB)', d:'bal', s:'Mobiliteit & lopen', kw:'sppb short physical performance battery ouderen kwetsbaarheid balans loopsnelheid opstaan valrisico geriatrie',

    calc: v => { const p = ['bal','loop','stoel'].map(k => v[k] === undefined || v[k] === '' ? null : +v[k]); if(p.some(x => x == null)) return []; const t = p[0] + p[1] + p[2];

    info:'Drie onderdelen, elk 0–4 punten: balans (voeten naast elkaar, semi-tandem, tandem), loopsnelheid over 4 m en 5× opstaan uit een stoel. Totaal 0–12.\nIndeling: 0–3 ernstige beperkingen, 4–9 hoog risico op nieuwe beperkingen (o.a. in ADL), 10–12 laag risico. Let op het plafondeffect bij goed functionerende ouderen.'},
  {id:'ols', n:'Eenbeensstand', d:'bal', s:'Statische balans', kw:'one leg stance staan op een been evenwicht statisch propriocepsis enkel', side:true,

      const a = c.leeftijd, open = v.var === 'Ogen open';

function toNum(x){ if(x === null || x === undefined || x === '') return null; if(typeof x === 'number') return isFinite(x) ? x : null; const n = parseFloat(String(x).replace(',','.')); return isFinite(n) ? n : null; }
function parseMMSS(x){ if(x == null || x === '') return null; const s = String(x).trim(); if(s.includes(':')){ const [m, sec] = s.split(':'); const a = toNum(m), b = toNum(sec); return a == null || b == null ? null : a*60 + b; } return toNum(s); }
function fmtMMSS(sec){ if(sec == null) return ''; const m = Math.floor(sec/60), s = Math.round(sec - m*60); return m + ':' + String(s).padStart(2,'0'); }
function fmt(x, u){ if(x == null) return '–'; if(u === 'min:sec') return fmtMMSS(x); const d = Math.abs(x) >= 100 || Number.isInteger(x) ? 0 : (u === '' && Math.abs(x) < 10 ? 2 : 1); let s = x.toFixed(d).replace('.', ','); if(d === 2) s = s.replace(/,?0+$/,''); return s; }
const fmtR = x => x == null ? '–' : x.toFixed(2).replace('.', ',');
const fmtU = (x, u) => fmt(x, u) + (x != null && u && u !== 'min:sec' ? (u === '°' ? '°' : ' ' + u) : '');
function signedVal(v, k, s){

  const n = toNum(raw); if(n == null) return null;
  if(!dir) return n;                      // oud formaat: getal met teken

}

async function sb(path, opt = {}){
  const headers = {apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json'};
  if(opt.prefer) headers.Prefer = opt.prefer;
  const r = await fetch(SB_URL + '/rest/v1/' + path, {method:opt.method || 'GET', headers, body:opt.body ? JSON.stringify(opt.body) : undefined, cache:'no-store'});
  if(!r.ok){ const t = await r.text(); const e = new Error(r.status + ' ' + t); e.status = r.status; e.body = t; throw e; }
  if(r.status === 204) return null;
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
async function getRow(id){ const rows = await sb(TABLE + '?id=eq.' + encodeURIComponent(id) + '&select=id,data,updated_at'); return rows && rows[0] ? rows[0] : null; }
async function putRow(id, data){ await sb(TABLE + '?on_conflict=id', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{id, data, updated_at:new Date().toISOString()}}); }
async function delRow(id){ await sb(TABLE + '?id=eq.' + encodeURIComponent(id), {method:'DELETE'}); }
function isMissingTable(e){ return e && (e.status === 404 || /PGRST205|does not exist|Could not find the table/i.test(e.body || e.message || '')); }

/* ---- Metrics: alle numerieke uitkomsten van één resultaat ---- */
function metrics(t, r, ctx){
  const v = (r && r.v) || {}; const out = [];
  if(t.items){
    const vals = t.items.map((_, i) => v.items ? v.items[i] : undefined);
    const ans = vals.filter(x => x !== undefined && x !== null && x !== '').length;
    const max = t.items.reduce((a, it) => a + Math.max(...it.o.map(o => o[0])), 0);
    const sum = vals.reduce((a, x) => a + (x === undefined || x === null || x === '' ? 0 : +x), 0);
    if(ans){
      const m = {k:'totaal', l:'Totaal', u:'/ ' + max, V:sum, partial: ans < t.items.length ? ans + '/' + t.items.length + ' items' : ''};
      if(!m.partial && t.totNorm) m.norm = t.totNorm(sum);
      out.push(m);
      const groups = [...new Set(t.items.map(it => it.g).filter(Boolean))];
      groups.forEach(g => { const idx = t.items.map((it,i) => it.g === g ? i : -1).filter(i => i >= 0); const gm = idx.reduce((a,i) => a + Math.max(...t.items[i].o.map(o=>o[0])), 0); out.push({k:'g_' + g, l:g, u:'/ ' + gm, V:idx.reduce((a,i) => a + (vals[i] === undefined || vals[i] === '' ? 0 : +vals[i]), 0)}); });
    }
  }
  (t.f || []).forEach(f => {
    if(f.t === 'sel') return;
    const p = f.t === 'mmss' ? parseMMSS : f.t === 'signed' ? (x, s) => signedVal(v, f.k, s) : toNum;
    const m = {k:f.k, l:f.l, u:f.u, t:f.t, better:f.better};
    if(t.side){ m.L = f.t === 'signed' ? p(null, 'L') : p(v[f.k]?.L); m.R = f.t === 'signed' ? p(null, 'R') : p(v[f.k]?.R); if(m.L == null && m.R == null) return; if(f.norm){ m.normL = m.L != null ? f.norm(m.L, ctx, v) : null; m.normR = m.R != null ? f.norm(m.R, ctx, v) : null; } }
    else { m.V = f.t === 'signed' ? p(null, '') : p(v[f.k]); if(m.V == null) return; if(f.norm) m.norm = f.norm(m.V, ctx, v); }
    out.push(m);
  });
  if(t.calc){ (t.calc(v, ctx) || []).forEach(m => { if(t.side && m.V === undefined){ m.isSide = true; } out.push(m); }); }
  const useDiff = t.d === 'mob' || t.diff;
  out.forEach(m => { m.side = m.L !== undefined || m.R !== undefined; if(m.side){
    if(useDiff){ if(m.L != null && m.R != null) m.lsi = {diff:true, v:Math.abs(m.L - m.R), label:'Verschil'}; }
    else { const l = lsi(t, m, ctx); if(l) m.lsi = l; } } });
  return out;
}
function lsi(t, m, ctx){
  if(m.L == null || m.R == null || m.L === 0 || m.R === 0) return null;
  const better = m.better || t.better || 'hoog';
  const z = ctx.zijde;
  let val, label;
  if(z === 'L' || z === 'R'){
    const inv = z === 'L' ? m.L : m.R, un = z === 'L' ? m.R : m.L;
    val = better === 'laag' ? un/inv*100 : inv/un*100; label = 'LSI';
  } else { val = Math.min(m.L, m.R)/Math.max(m.L, m.R)*100; label = 'Symmetrie'; }
  return {v:val, label, norm:(t.lsiNorm || LSI_NORM)(val)};
}
function selTexts(t, r){ const v = (r && r.v) || {}; return (t.f || []).filter(f => f.t === 'sel').map(f => { if(t.side){ const L = v[f.k]?.L, R = v[f.k]?.R; return L || R ? {l:f.l, L, R} : null; } return v[f.k] ? {l:f.l, V:v[f.k]} : null; }).filter(Boolean); }
function hasValue(r){ const walk = x => x == null ? false : typeof x === 'object' ? Object.values(x).some(walk) : String(x).trim() !== ''; return walk(r.v) ; }
function ctxOf(moment){ return {geslacht:S.patient?.geslacht || '', leeftijd:toNum(moment?.leeftijd), zijde:moment?.zijde || ''}; }
function ratiosFor(moment){
  const out = [];
  RATIOS.forEach(R => {
    const a = moment.results.find(r => r.t === R.a), b = moment.results.find(r => r.t === R.b);
    if(!a || !b) return; const res = {l:R.l};
    ['L','R'].forEach(s => { const x = toNum(a.v?.kg?.[s]), y = toNum(b.v?.kg?.[s]); res[s] = x != null && y ? x/y : null; if(res[s] != null && R.norm) res['n' + s] = R.norm(res[s]); });
    if(res.L != null || res.R != null) out.push(res);
  });
  return out;
}
const badge = (n) => n ? '<span class="badge ' + n.lvl + '">' + esc(n.t) + '</span>' : '';
function primaryMetric(t, ms){ if(!ms.length) return null; if(t.main){ const m = ms.find(x => x.k === t.main); if(m) return m; } if(t.lsiKey){ const m = ms.find(x => x.k === t.lsiKey); if(m) return m; } return ms.find(m => m.k === 'totaal') || ms.find(m => m.side) || ms[ms.length-1]; }

/* =====================================================================

   ===================================================================== */
function haystack(t){ const d = domainOf(t.d); return norm([t.n, t.kw, t.s, SUBKW[t.s] || '', d.n, d.kw, t.custom ? 'eigen test' : ''].join(' ')); }
function searchTests(q){
  const words = norm(q).split(/[\s,]+/).filter(w => w.length > 0); if(!words.length) return [];
  return allTests().filter(t => !t.archived).map(t => {
    const h = haystack(t), name = norm(t.n);
    if(!words.every(w => h.includes(w))) return null;
    let score = 0; words.forEach(w => { if(name.includes(w)) score += 10; if(name.startsWith(w)) score += 5; if(norm(t.kw).includes(w)) score += 3; });
    return {t, score};
  }).filter(Boolean).sort((a,b) => b.score - a.score || a.t.n.localeCompare(b.t.n)).map(x => x.t);
}

function cellHTML(m){

function deltaHTML(t, m, prev){
  if(!m || !prev) return '';

  const a = m.V, b = prev.V; if(a == null || b == null) return '';

  return `<span class="delta ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d), m.u)}</span>`;
}

function chartSVG(series, unit){
  const W = 640, H = 200, pl = 46, pr = 34, pt = 14, pb = 34;
  const dates = [...new Set(series.flatMap(s => s.pts.map(p => p[0])))].sort();
  const ys = series.flatMap(s => s.pts.map(p => p[1])).filter(y => y != null);
  if(!ys.length) return '';
  let min = Math.min(...ys), max = Math.max(...ys);
  if(min === max){ min -= 1; max += 1; }
  const pad = (max - min) * 0.12; min -= pad; max += pad;
  if(min > 0 && Math.min(...ys) >= 0 && min < (max-min)*0.3) min = Math.max(0, min);
  const x = i => dates.length === 1 ? pl + (W-pl-pr)/2 : pl + i*(W-pl-pr)/(dates.length-1);
  const y = v => pt + (1 - (v-min)/(max-min))*(H-pt-pb);
  const ticks = 4; let grid = '';
  for(let i = 0; i <= ticks; i++){ const v = min + (max-min)*i/ticks; const yy = y(v); grid += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".6">${fmt(v, unit === 'min:sec' ? 'min:sec' : (Math.abs(max-min) < 5 ? 'x' : ''))}</text>`; }
  const xl = dates.map((d,i) => `<text x="${x(i)}" y="${H-10}" text-anchor="${dates.length > 1 && i === dates.length-1 ? 'end' : dates.length > 1 && i === 0 ? 'start' : 'middle'}" font-size="11" fill="currentColor" fill-opacity=".6">${fmtDate(d).slice(0,6) + fmtDate(d).slice(8)}</text>`).join('');
  const lines = series.map(s => {
    const pts = s.pts.filter(p => p[1] != null).map(p => [x(dates.indexOf(p[0])), y(p[1]), p[1]]);
    return `<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}"/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="1.5"><title>${fmt(p[2], unit)}</title></circle>`).join('');
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verloop">${grid}${xl}${lines}</svg>`;
}
function resultSummary(t, r, m){
  const ms = metrics(t, r, ctxOf(m)), sl = selTexts(t, r);
  const parts = sl.map(s => s.V !== undefined ? esc(s.l) + ': ' + esc(s.V) : esc(s.l) + ': L ' + esc(s.L || '–') + ' / R ' + esc(s.R || '–'));
  ms.forEach(x => {

  });
  return parts.join('<br>');
}

      content = crumbs + '<div class="tlist">' + subs.map(s => { const n = tests.filter(t => t.d === dom && t.s === s).length; return `<button class="titem" data-act="psub" data-s="${esc(s)}"><span class="tn"><b>${esc(s)}</b><small>${n} test${n === 1 ? '' : 'en'}</small></span><span class="add">›</span></button>`; }).join('') + '</div>';
    } else {

    }
  }
  // snel toevoegen
  const prevIds = []; sortedMoments().forEach(m => (m.results || []).forEach(r => { if(!prevIds.includes(r.t) && testById(r.t)) prevIds.push(r.t); }));
  const quick = prevIds.length ? `<div class="quick"><div class="row"><b class="small">Eerder bij ${esc(S.patient.voornaam)}</b><span class="spacer"></span><button class="linkbtn small" data-act="repeatLast">Zelfde als vorige keer</button></div>

  return `<div class="row"><h3>Test toevoegen</h3><span class="spacer"></span><button class="btn small primary only-mobile" data-act="closePicker">Klaar${S.draft.results.length ? ' (' + S.draft.results.length + ')' : ''}</button></div>

    <div class="scroll">${quick}${content}</div>`;
}

function getApiKey(){ try{ return localStorage.getItem('ft_apikey') || ''; } catch(e){ return ''; } }
function resultLines(t, r, m){
  const ms = metrics(t, r, ctxOf(m)), sl = selTexts(t, r), parts = [];
  sl.forEach(s => parts.push(s.V !== undefined ? s.l + ': ' + s.V : s.l + ': links ' + (s.L || '-') + ', rechts ' + (s.R || '-')));
  ms.forEach(x => {
    const u = x.u && x.u !== 'min:sec' ? ' ' + x.u : '';
    if(x.side){
      let s = x.l + ': links ' + fv(x, x.L) + (x.normL ? ' (' + x.normL.t + ')' : '') + ', rechts ' + fv(x, x.R) + (x.normR ? ' (' + x.normR.t + ')' : '');
      if(x.lsi) s += '; ' + (x.lsi.diff ? 'verschil links-rechts ' + fmtU(x.lsi.v, x.u) : (x.lsi.label === 'LSI' ? 'LSI (aangedaan t.o.v. niet-aangedaan)' : 'symmetrie (zwakste t.o.v. sterkste zijde)') + ' ' + fmt(x.lsi.v,'%') + '%');
      parts.push(s);
    } else parts.push(x.l + ': ' + fv(x, x.V) + (x.norm ? ' (' + x.norm.t + ')' : '') + (x.partial ? ' [onvolledig: ' + x.partial + ']' : ''));
  });
  if(t.items && r.v?.items){ const low = t.items.map((it,k) => ({it, s:r.v.items[k]})).filter(x => x.s !== undefined && x.s !== '' && +x.s < Math.max(...x.it.o.map(o => o[0]))); if(low.length) parts.push('Items met puntverlies: ' + low.map(x => x.it.n + ' (' + x.s + ')').join('; ')); }
  if(r.o) parts.push('Opmerking tester: ' + r.o);
  return '- ' + patName(t) + (patName(t) !== t.n ? ' (vaknaam: ' + t.n + ')' : '') + ' [' + domainOf(t.d).n + ']: ' + parts.join(' | ');
}
function buildPrompt(moments, context){
  const p = S.patient;
  const data = moments.map(m => {
    const lines = (m.results || []).map(r => { const t = testById(r.t); return t ? resultLines(t, r, m) : null; }).filter(Boolean);
    ratiosFor(m).forEach(x => lines.push('- ' + x.l + ': links ' + fmtR(x.L) + ', rechts ' + fmtR(x.R)));
    return 'TESTMOMENT ' + fmtDate(m.datum) + (m.leeftijd ? ' | leeftijd ' + m.leeftijd : '') + (m.zijde ? ' | aangedane zijde: ' + (m.zijde === 'L' ? 'links' : 'rechts') : '') + (m.notitie ? ' | notitie: ' + m.notitie : '') + '\n' + lines.join('\n');
  }).join('\n\n');
  const latest = moments[moments.length-1];
  return `Je bent een fysiotherapeut bij Fyzio Totaal en schrijft een persoonlijk testverslag voor een patiënt, op basis van vrij gekozen testen.

HARDE REGEL - GEEN VERZONNEN RESULTATEN:
Gebruik uitsluitend de testresultaten die hieronder bij TESTRESULTATEN staan. Verzin NOOIT een score, tijd, aantal herhalingen, cm-waarde of observatie voor een test die daar niet in staat. Schrijf alleen over onderdelen die daadwerkelijk getest zijn; noem niet-geteste onderdelen niet. Dit is de belangrijkste regel en gaat boven alle stijlvoorkeuren.

TAAL EN STIJL:
- Zou een fysiotherapeut dit hardop zo tegen een patiënt zeggen, en bestaat het woord echt in het Nederlands? "Benedenlichaam" bestaat niet; gebruik "onderlichaam" of beter het concrete lichaamsdeel (heupen, enkels, benen).
- Correct Nederlands, geen Engelse woorden waar een goed Nederlands alternatief bestaat (niet "overall" maar "over het algemeen", niet "feedback" maar "terugkoppeling").
- Informeel, jij-vorm ("je/jij"), nooit "u".
- Warm maar nuchter en compact. Geen zweverige of omslachtige zinnen.
- Geen medische diagnoses. Geen nocebo-taal.
- Geen gedachtestreepjes als opsommingsteken of als leesteken in de lopende tekst.
- Geen markdown-hekjes of sterretjes voor kopjes. Kopjes zijn gewone losse regels zonder leesteken aan het eind.
- Begrijpelijke taal, maar behoud correcte medische termen waar dat gepast is (bijv. "hamstrings", "quadriceps", "rotator cuff", "voorste kruisbandreconstructie"). Vertaal alleen termen die echt niets zeggen (niet "valgus" maar "knieën zakken naar binnen").
- TESTNAMEN: noem een test altijd bij de naam die vóór de haakjes in de testresultaten staat (bijv. "kuitkrachttest", "opstaan en lopen"), of omschrijf gewoon wat je hebt gedaan ("de test waarbij je zo vaak mogelijk op je tenen ging staan"). De vaknaam tussen haakjes mag je hooguit één keer erbij noemen.
- VERZIN NOOIT ZELF WOORDEN. Gebruik geen zelfbedachte samenstellingen of namen voor testen, meetinstrumenten of lichaamsdelen, zoals "kuitmeter", "beenmeter", "kniekrachtmeting", "evenwichtsmeter" of "krachtwaarde". Gebruik alleen woorden die een fysiotherapeut ook echt hardop tegen een patiënt zou zeggen en die in een gewoon Nederlands woordenboek staan. Twijfel je over een woord, kies dan een eenvoudige omschrijving.
- Wees ANATOMISCH SECUUR: benoem steeds het lichaamsdeel dat de test daadwerkelijk meet, en verwissel links en rechts nooit.
- Leg LSI of symmetrie kort en eenvoudig uit als je het noemt (bijv. "je rechterbeen haalt 85% van de kracht van je linkerbeen").
- Bij een balansschaal (zoals Berg Balance Scale): benoem de totaalscore en vat de items met puntverlies samen in gewone woorden.
- Let op grammatica, ook bij meervoud.

ADVIESTOON:
- Als een score goed is, benoem dat positief en geef geen vervolgadvies voor dat onderdeel. Goed is goed.
- Aandachtspunten formuleer je als kansen met een concrete richting, nooit als tekortkomingen.
- Bij meerdere testmomenten: beschrijf het verloop concreet (wat is vooruitgegaan, wat is gelijk gebleven) en wees eerlijk maar bemoedigend.
- Als de context een oude blessure of operatie noemt: alleen als mogelijke achtergrondfactor, nooit als rechtvaardiging voor een lagere score. Bij een huidige of recente blessure mag het verband directer worden gelegd.

PATIËNT:
Voornaam: ${p.voornaam} | Geslacht: ${p.geslacht === 'M' ? 'man' : p.geslacht === 'V' ? 'vrouw' : 'onbekend'}
${context ? 'Context van de therapeut: ' + context : ''}

TESTRESULTATEN (dit zijn de ENIGE gegevens die je mag gebruiken; tussen haakjes staat de normduiding van de tool):
${data}

STRUCTUUR - volg dit patroon:

Testverslag ${p.voornaam} ${'— ' + fmtDate(latest.datum)}

Maak daarna per getest domein (bijvoorbeeld Kracht, Mobiliteit, Balans, Sport en sprong, Uithoudingsvermogen, Lichaamsmaten) een eigen kopje, alleen voor domeinen die in de testresultaten voorkomen. Beschrijf per domein de scores feitelijk, met conclusie en eventueel advies in dezelfde alinea.
${moments.length > 1 ? '\nVerloop\n[Vat in 2 tot 4 zinnen samen hoe de resultaten zich tussen de testmomenten hebben ontwikkeld.]\n' : ''}
Belangrijkste punten
Opsomming waarbij elke regel begint met een asterisk en een spatie (* ). 3 tot 5 volledige zinnen, een mix van sterke punten en aandachtspunten als kansen.

Aan de slag
Concrete actielijst, elke actie begint met een asterisk en een spatie (* ). 2 tot 4 uitvoerbare acties op basis van de testresultaten. Geen vage adviezen.

Maximaal 500 woorden. Schrijf in het Nederlands. Zorg dat elke sectie volledig is afgerond.`;
}

  const ids = [...document.querySelectorAll('input[data-g="am"]:checked')].map(x => x.value);
  if(!ids.length){ toast('Kies minimaal één testmoment', true); return; }
  let key = getApiKey();
  if(!key){ key = prompt('Voer de Anthropic API-key in (begint met sk-ant-). Deze wordt alleen in deze browser bewaard, gedeeld met de andere Fyzio-tools.'); if(!key) return; key = key.trim(); if(!key.startsWith('sk-ant-')){ toast('Ongeldige key', true); return; } try{ localStorage.setItem('ft_apikey', key); } catch(e){} }
  const moments = sortedMoments().filter(m => ids.includes(m.id));
  const context = $('#ai-ctx').value.trim();
  const out = $('#ai-out'), act = $('#ai-actions');
  out.innerHTML = '<div class="banner info" style="margin-top:12px"><span class="spinner"></span> Het verslag wordt geschreven…</div>';

const pu = m => m && m.u === 'hh' ? Object.assign({}, m, {u:'×'}) : m;
const fvp = (m, x) => { const r = fv(pu(m), x); return r.replace(/ ×$/, '×'); };
const pdText = t => PD[t.id] || (t.custom ? (t.info || '').split('\n')[0] : '');
const PCOL = {
  good:{f:[46,139,87], b:[229,244,235], t:'Goed'},
  neutral:{f:[0,114,142], b:[220,244,251], t:'Gemiddeld'},
  warn:{f:[180,113,31], b:[251,238,222], t:'Aandachtspunt'},
  bad:{f:[184,67,58], b:[251,231,229], t:'Aandachtspunt'},
  info:{f:[122,100,120], b:[243,238,242], t:'Ter info'}
};
const RANK = {good:1, neutral:2, warn:3, bad:4};
const SELLVL = {Goed:'good', Matig:'warn', Slecht:'bad', Negatief:'good'};
function testStatus(ms, sel){
  const ns = [];
  ms.forEach(m => {
    [m.norm, m.normL, m.normR].forEach(n => { if(n && RANK[n.lvl]) ns.push(n); });
    if(m.lsi && m.lsi.norm) ns.push({lvl:m.lsi.norm.lvl, t:'Verschil tussen links en rechts'});
  });
  sel.forEach(s => [s.V, s.L, s.R].forEach(v => { if(!v) return; const l = SELLVL[v] || (/^Positief/.test(v) ? 'warn' : null); if(l) ns.push({lvl:l, t:''}); }));
  if(!ns.length) return {lvl:'info', t:''};
  return ns.reduce((a, b) => RANK[b.lvl] > RANK[a.lvl] ? b : a);
}
function resultText(t, ms, sel){
  const pm = primaryMetric(t, ms);
  if(pm){ if(pm.side) return 'L ' + fvp(pm, pm.L) + '   R ' + fvp(pm, pm.R); return fvp(pm, pm.V); }
  if(sel.length){ const s = sel[0]; return s.V !== undefined ? s.V : 'L ' + (s.L || '-') + '   R ' + (s.R || '-'); }
  return '-';
}
function trendOf(t, cur, prev, zijde){
  if(!prev) return null;
  const pm = primaryMetric(t, cur); if(!pm) return null;
  const pp = prev.find(x => x.k === pm.k); if(!pp) return null;
  const val = m => !m.side ? m.V : (zijde === 'L' || zijde === 'R') ? m[zijde] : (m.L != null && m.R != null ? (m.L + m.R) / 2 : (m.L ?? m.R));
  const a = val(pm), b = val(pp); if(a == null || b == null) return null;
  const d = a - b; if(Math.abs(d) <= Math.max(Math.abs(b) * 0.03, 1e-9)) return 'eq';
  return ((pm.better || t.better || 'hoog') === 'laag' ? d < 0 : d > 0) ? 'up' : 'down';
}

async function buildPdf(o){
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:'mm', format:'a4'});
  // Standaard-PDF-fonts kennen sommige tekens niet: vervang ze overal
  const ps = x => String(x).replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/→/g,'->').replace(/−/g,'-').replace(/[“”]/g,'"');
  const _text = doc.text.bind(doc); doc.text = (t, ...a) => _text(Array.isArray(t) ? t.map(ps) : ps(t), ...a);
  const _split = doc.splitTextToSize.bind(doc); doc.splitTextToSize = (t, ...a) => _split(ps(t), ...a);
  const _gtw = doc.getTextWidth.bind(doc); doc.getTextWidth = t => _gtw(ps(t));

  const W = 210, H = 297, M = 16, CW = W - 2*M, BOTTOM = H - 18;
  const PUR = [130,23,109], CY = [0,182,232], TXT = [42,22,38], MUT = [122,100,120], LINE = [226,213,223], SOFT = [248,243,247];
  const p = S.patient, logo = await loadLogo();
  const moments = sortedMoments().filter(m => o.mids.includes(m.id));
  const lastM = moments[moments.length-1];
  const font = (st, sz, col) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(...(col || TXT)); };
  const pill = (x, y, label, lvl, align, draw = true) => { // y = tekstbasislijn
    const c = PCOL[lvl] || PCOL.info; font('bold', 7.5); const w = doc.getTextWidth(label) + 6; const x0 = align === 'right' ? x - w : x;
    if(draw){ doc.setFillColor(...c.b); doc.roundedRect(x0, y - 3.6, w, 5, 2.5, 2.5, 'F'); doc.setTextColor(...c.f); doc.text(label, x0 + 3, y); }
    return w;
  };
  let y = 0;
  const newPage = () => { doc.addPage(); y = 24; };
  const ensure = h => { if(y + h > BOTTOM) newPage(); };
  const heading = (title, sub) => {
    ensure(sub ? 18 : 14);
    doc.setFillColor(...PUR); doc.rect(M, y - 4.6, 1.6, 6, 'F');
    font('bold', 13, PUR); doc.text(title, M + 4, y);
    y += 3.5;
    if(sub){ font('normal', 8.5, MUT); const l = doc.splitTextToSize(sub, CW); doc.text(l, M, y + 1.5); y += l.length * 3.8 + 1.5; }
    y += 3;
  };

  /* --- Kop --- */
  if(logo){ const h = 11; try{ doc.addImage(logo.data, 'PNG', M, 12, h * logo.ar, h); } catch(e){} }
  else { font('bold', 17, PUR); doc.text('Fyzio', M, 20); const fw = doc.getTextWidth('Fyzio'); doc.setTextColor(...CY); doc.text('Totaal', M + fw, 20); }
  font('bold', 17, PUR); doc.text('Testoverzicht', W - M, 18, {align:'right'});
  font('normal', 9, MUT); doc.text(moments.length > 1 ? fmtDate(moments[0].datum) + ' t/m ' + fmtDate(lastM.datum) : fmtDate(lastM.datum), W - M, 23.5, {align:'right'});
  doc.setFillColor(...PUR); doc.rect(M, 29, CW * 0.72, 1.1, 'F'); doc.setFillColor(...CY); doc.rect(M + CW * 0.72, 29, CW * 0.28, 1.1, 'F');
  y = 36;

  /* --- Patiëntblok --- */
  doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, 17, 3, 3, 'F');
  const testers = [...new Set(moments.map(m => m.tester).filter(Boolean))].join(', ') || '-';
  [['Naam', p.voornaam], ['Patiëntnummer', p.nr], [moments.length > 1 ? 'Laatste testdatum' : 'Testdatum', fmtDate(lastM.datum)], ['Getest door', testers]].forEach(([l, v], i) => {
    const x = M + 6 + i * (CW - 8) / 4;
    font('bold', 7, MUT); doc.text(l.toUpperCase(), x, y + 6.5);
    font('bold', 10.5); doc.text(doc.splitTextToSize(String(v), (CW - 8) / 4 - 4)[0], x, y + 12.5);
  });
  y += 26;

  /* --- In één oogopslag --- */
  const hist = testHistory();
  const tests = o.tids.map(testById).filter(Boolean)
    .sort((a, b) => DOMAINS.findIndex(d => d.id === a.d) - DOMAINS.findIndex(d => d.id === b.d) || a.n.localeCompare(b.n))
    .map(t => {
      const rows = (hist[t.id] || []).filter(x => o.mids.includes(x.m.id)).map(({m, r}) => ({m, r, ms:metrics(t, r, ctxOf(m)), sel:selTexts(t, r)}));
      return rows.length ? {t, rows} : null;
    }).filter(Boolean);
  heading('In één oogopslag', 'Per test je meest recente resultaat. De kleur laat zien hoe je scoort; verderop in dit overzicht vind je per test meer uitleg.');
  const sumRows = tests.map(({t, rows}) => {
    const last = rows[rows.length-1], prev = rows[rows.length-2];
    const st = testStatus(last.ms, last.sel);
    const tr = trendOf(t, last.ms, prev && prev.ms, last.m.zijde);
    return {t, st, res:resultText(t, last.ms, last.sel), tr};
  });
  const TRTXT = {up:'Vooruit', eq:'Gelijk', down:'Achteruit'};
  const anyTrend = sumRows.some(r => r.tr);
  doc.autoTable({
    startY:y, margin:{left:M, right:M, top:24, bottom:20},
    head:[['Test', 'Resultaat', 'Beoordeling'].concat(anyTrend ? ['Verloop'] : [])],
    body:sumRows.map(r => [patName(r.t), r.res, PCOL[r.st.lvl].t].concat(anyTrend ? [r.tr ? TRTXT[r.tr] : '-'] : [])),
    theme:'plain',
    styles:{font:'helvetica', fontSize:9, textColor:TXT, cellPadding:{top:2.6, bottom:2.6, left:3, right:3}, valign:'middle'},
    headStyles:{fillColor:PUR, textColor:255, fontStyle:'bold', fontSize:8.5},
    columnStyles:{0:{cellWidth:CW * 0.4, fontStyle:'bold'}, 1:{cellWidth:CW * (anyTrend ? 0.26 : 0.36)}, 2:{cellWidth:CW * 0.22}, 3:{cellWidth:CW * 0.12}},
    alternateRowStyles:{fillColor:[252,249,251]},
    didParseCell:d => { if(d.section === 'body' && (d.column.index === 2 || d.column.index === 3)) d.cell.text = ['']; },
    didDrawCell:d => {
      if(d.section !== 'body') return;
      const r = sumRows[d.row.index], cy = d.cell.y + d.cell.height/2 + 1.3;
      if(d.column.index === 2) pill(d.cell.x + 3, cy, PCOL[r.st.lvl].t, r.st.lvl);
      if(d.column.index === 3 && r.tr){
        const col = r.tr === 'up' ? PCOL.good.f : r.tr === 'down' ? PCOL.bad.f : MUT, x = d.cell.x + 3.5, c = d.cell.y + d.cell.height/2;
        doc.setFillColor(...col);
        if(r.tr === 'up') doc.triangle(x, c + 1.4, x + 3, c + 1.4, x + 1.5, c - 1.4, 'F');
        else if(r.tr === 'down') doc.triangle(x, c - 1.4, x + 3, c - 1.4, x + 1.5, c + 1.4, 'F');
        else doc.rect(x, c - 0.5, 3, 1, 'F');
        font('normal', 8.5, col); doc.text(TRTXT[r.tr], x + 4.5, c + 1.2);
      }
      if(d.column.index === 3 && !r.tr){ font('normal', 8.5, MUT); doc.text('-', d.cell.x + 3, cy); }
    },
  });
  y = doc.lastAutoTable.finalY + 5;
  // legenda
  font('normal', 7.5, MUT); let lx = M;
  [['good','Goed'], ['neutral','Gemiddeld'], ['warn','Aandachtspunt'], ['info','Ter info (geen normwaarde)']].forEach(([l, t]) => {
    doc.setFillColor(...PCOL[l].f); doc.circle(lx + 1.3, y - 1, 1.3, 'F'); doc.setTextColor(...MUT); doc.text(t, lx + 3.8, y); lx += doc.getTextWidth(t) + 10;
  });
  y += 9;

  /* --- AI-toelichting --- */
  if(o.aiId){
    const s = p.samenvattingen.find(x => x.id === o.aiId);
    if(s){
      heading('Toelichting');
      s.tekst.split('\n').forEach((line, i) => {
        if(i === 0 && /^Testverslag/i.test(line.trim())) return;
        const head = isHeadingLine(line), bullet = /^\*\s/.test(line);
        font(head ? 'bold' : 'normal', head ? 10.5 : 9.5, head ? PUR : TXT);
        if(!line.trim()){ y += 2; return; }
        const wrapped = doc.splitTextToSize(bullet ? line.replace(/^\*\s/, '') : line, CW - (bullet ? 6 : 0));
        if(head) y += 1.5;
        wrapped.forEach((w, k) => { ensure(5); if(bullet && k === 0){ doc.setFillColor(...PUR); doc.circle(M + 1.5, y - 1.2, 0.8, 'F'); } doc.text(w, M + (bullet ? 5 : 0), y); y += 4.6; });
        if(head) y += 0.5;
      });
      y += 5;
    }
  }

  /* --- Per test --- */
  const card = (t, rows, y0, draw) => {
    const x = M, w = CW, pad = 5, IW = w - 2*pad; let cy = y0 + 6.5;
    const last = rows[rows.length-1], ms = last.ms, sel = last.sel, zijde = last.m.zijde;

    if(desc){ font('normal', 8.5, MUT); const l = doc.splitTextToSize(desc, IW - 30); if(draw) doc.text(l, x + pad, cy); cy += l.length * 3.7; }
    const METHOD = ['var', 'oef', 'zijde'];
    const methodTxt = (t.f || []).filter(f => f.t === 'sel' && METHOD.includes(f.k)).map(f => last.r.v?.[f.k]).filter(Boolean).join(', ');
    font('normal', 7.5, MUT);
    if(draw) doc.text((patName(t) !== t.n ? t.n + '  ·  ' : '') + 'Gemeten op ' + fmtDate(last.m.datum) + (methodTxt ? '  ·  ' + methodTxt : '') + (rows.length > 1 ? '  ·  ' + rows.length + ' metingen in dit overzicht' : ''), x + pad, cy + 0.6);
    cy += 5.5;

    const nums = ms.filter(m => m.V != null || m.L != null || m.R != null);
    const sideMs = nums.filter(m => m.side), flat = nums.filter(m => !m.side);
    const main = t.lsiKey ? sideMs.find(m => m.k === t.lsiKey) : (sideMs.length === 1 ? sideMs[0] : null);

    // A. Itemschaal: voortgangsbalk + items met puntverlies
    if(t.items){
      const tot = ms.find(m => m.k === 'totaal');
      if(tot){
        const max = parseFloat(tot.u.replace('/', '')), lvl = (tot.norm || {}).lvl || 'info', c = PCOL[lvl];
        const bw = IW - 34;
        if(draw){
          doc.setFillColor(...SOFT); doc.roundedRect(x + pad, cy, bw, 5, 2.5, 2.5, 'F');
          doc.setFillColor(...(lvl === 'info' ? PUR : c.f)); doc.roundedRect(x + pad, cy, Math.max(5, bw * tot.V / max), 5, 2.5, 2.5, 'F');
          font('bold', 12); doc.text(String(tot.V), x + pad + bw + 4, cy + 4.3); const vw = doc.getTextWidth(String(tot.V)); font('normal', 9, MUT); doc.text('/ ' + max, x + pad + bw + 5 + vw, cy + 4.3);
        }
        cy += 8;
        if(tot.norm){ font('normal', 8.5, c.f); if(draw) doc.text(tot.norm.t, x + pad, cy); cy += 4.4; }
        ms.filter(m => m.k.startsWith('g_')).forEach(g => { font('normal', 8.5, TXT); if(draw) doc.text(g.l + ': ' + g.V + ' ' + g.u, x + pad, cy); cy += 4.2; });
        const loss = t.items.map((it, k) => ({it, s:last.r.v?.items?.[k]})).filter(z => z.s !== undefined && z.s !== '' && +z.s < Math.max(...z.it.o.map(o => o[0])));
        if(loss.length){ font('normal', 8.5, MUT); const l = doc.splitTextToSize('Hier zijn punten te winnen: ' + loss.map(z => z.it.n.toLowerCase()).join(', ') + '.', IW); if(draw) doc.text(l, x + pad, cy); cy += l.length * 3.8; }
        cy += 1;
      }
    }
    // B. Links/rechts als balken
    if(main){
      const vals = [main.L, main.R].filter(v => v != null).map(Math.abs), max = Math.max(...vals, 1e-9) * 1.08;
      const lab = 22, valW = 50, bw = IW - lab - valW;
      [['L', 'Links', [130,23,109], main.normL], ['R', 'Rechts', [0,182,232], main.normR]].forEach(([s, name, col, n]) => {
        const v = main[s];
        if(draw){
          font('bold', 9); doc.text(name, x + pad, cy + (zijde === s ? 2.4 : 3.6));
          if(zijde === s){ font('normal', 6.5, MUT); doc.text('aangedaan', x + pad, cy + 5.6); }
          doc.setFillColor(...SOFT); doc.roundedRect(x + pad + lab, cy, bw, 5, 2.5, 2.5, 'F');
          if(v != null){ doc.setFillColor(...col); doc.roundedRect(x + pad + lab, cy, Math.max(5, bw * Math.abs(v) / max), 5, 2.5, 2.5, 'F'); }
          font('bold', 10); const vt = fvp(main, v); doc.text(vt, x + pad + lab + bw + 4, cy + 4);
          if(n && n.lvl !== 'grey') pill(x + pad + lab + bw + 6 + doc.getTextWidth(vt), cy + 3.9, PCOL[n.lvl].t, n.lvl);
        }
        cy += 7.2;
      });
      if(main.lsi){
        let txt;
        if(main.lsi.diff) txt = 'Verschil tussen links en rechts: ' + fmtU(main.lsi.v, main.u) + '.';
        else if(main.lsi.label === 'LSI') txt = 'Je aangedane kant (' + (zijde === 'L' ? 'links' : 'rechts') + ') haalt ' + fmt(main.lsi.v, '%') + '% van je andere kant.';
        else txt = 'Je zwakste kant haalt ' + fmt(main.lsi.v, '%') + '% van je sterkste kant.';
        font('normal', 8.8, TXT); const tw = doc.getTextWidth(txt);
        if(draw){ doc.text(txt, x + pad, cy + 2.5); if(main.lsi.norm) pill(x + pad + tw + 3, cy + 2.5, main.lsi.norm.lvl === 'good' ? 'In balans' : 'Aandachtspunt', main.lsi.norm.lvl); }
        cy += 4.2;
        if(!main.lsi.diff){ font('normal', 7.5, MUT); if(draw) doc.text('Streefwaarde: 90% of meer.', x + pad, cy + 2); cy += 4; }
        cy += 1.5;
      }
    }
    // C. Meerdere metingen per zijde (bijv. bewegingsuitslag): tabel
    const tableMs = main ? sideMs.filter(m => m !== main) : sideMs;
    if(tableMs.length){
      const cols = [x + pad, x + pad + IW * 0.42, x + pad + IW * 0.62, x + pad + IW * 0.82];
      if(draw){ font('bold', 7.5, MUT); ['', 'LINKS', 'RECHTS', tableMs.some(m => m.lsi && m.lsi.diff) ? 'VERSCHIL' : 'LSI'].forEach((h, i) => doc.text(h, cols[i], cy + 2.5)); }
      cy += 4.5;
      tableMs.forEach((m, i) => {
        if(draw){
          if(i % 2 === 0){ doc.setFillColor(...SOFT); doc.rect(x + pad - 1.5, cy - 0.2, IW + 3, 5.6, 'F'); }
          font('normal', 9); doc.text(m.l, cols[0], cy + 3.8);
          font('bold', 9); doc.text(fvp(m, m.L), cols[1], cy + 3.8); doc.text(fvp(m, m.R), cols[2], cy + 3.8);
          if(m.lsi){ const lt = m.lsi.diff ? fmtU(m.lsi.v, m.u) : fmt(m.lsi.v, '%') + '%'; const c = m.lsi.norm ? PCOL[m.lsi.norm.lvl].f : TXT; font('bold', 9, c); doc.text(lt, cols[3], cy + 3.8); }
        }
        cy += 5.6;
      });
      cy += 2;
    }
    // D. Losse waarden en keuzes als tegels
    const tiles = flat.filter(m => !(t.items && (m.k === 'totaal' || m.k.startsWith('g_')))).map(m => ({l:m.l, v:fvp(m, m.V), n:m.norm}))
      .concat(sel.filter(s => !(t.f || []).some(f => METHOD.includes(f.k) && f.l === s.l)).map(s => ({l:s.l, v:s.V !== undefined ? s.V : 'L ' + (s.L || '-') + '  ·  R ' + (s.R || '-'), n:s.V && SELLVL[s.V] ? {lvl:SELLVL[s.V], t:''} : null, txt:true})));
    if(tiles.length){
      const per = Math.min(tiles.length, 3), gap = 3, tw = (IW - gap * (per - 1)) / per, th = 15;
      tiles.forEach((tl, i) => {
        const col = i % per, row = Math.floor(i / per), tx = x + pad + col * (tw + gap), ty = cy + row * (th + gap);
        if(draw){
          doc.setFillColor(...SOFT); doc.roundedRect(tx, ty, tw, th, 2.5, 2.5, 'F');
          const c = tl.n && PCOL[tl.n.lvl] ? PCOL[tl.n.lvl].f : TXT;
          if(tl.n && PCOL[tl.n.lvl]){ doc.setFillColor(...c); doc.roundedRect(tx, ty, 1.4, th, 0.7, 0.7, 'F'); }
          font('normal', 7.5, MUT); doc.text(doc.splitTextToSize(tl.l, tw - 6)[0], tx + 4, ty + 4.6);
          font('bold', tl.txt ? 10.5 : 12.5, c); doc.text(doc.splitTextToSize(String(tl.v), tw - 6)[0], tx + 4, ty + 10.2);
          if(tl.n && tl.n.t && tl.n.lvl !== 'grey'){ font('normal', 6.8, c); doc.text(doc.splitTextToSize(tl.n.t, tw - 6)[0], tx + 4, ty + 13.4); }
        }
      });
      cy += Math.ceil(tiles.length / per) * (th + gap) + 1;
    }
    // E. Verloop
    if(rows.length >= 2){
      const pm = primaryMetric(t, last.ms);
      const pts = pm ? rows.map(x2 => ({d:x2.m.datum, m:x2.ms.find(z => z.k === pm.k)})).filter(z => z.m) : [];
      if(o.withCharts && pts.length >= 2){
        cy += 1;
        cy = pdfChart(doc, x + pad, cy, IW, 32, pts, pm, draw, font);
      } else {
        const prev = rows[rows.length-2];
        font('normal', 8.5, MUT); if(draw) doc.text('Vorige meting (' + fmtDate(prev.m.datum) + '): ' + resultText(t, prev.ms, prev.sel), x + pad, cy + 2); cy += 5;
      }
    }
    // F. Opmerking
    if(o.withNotes && last.r.o){ font('italic', 8.5, MUT); const l = doc.splitTextToSize('Opmerking: ' + last.r.o, IW); if(draw) doc.text(l, x + pad, cy + 2); cy += l.length * 3.8 + 1; }
    cy += 3;
    const h = cy - y0;
    if(draw){
      doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.roundedRect(x, y0, w, h, 3, 3, 'S');
      doc.setFillColor(...PCOL[st.lvl].f); doc.roundedRect(x, y0 + 3, 1.3, h - 6, 0.6, 0.6, 'F');
    }
    return h;
  };

  let lastDom = null;
  tests.forEach(({t, rows}, idx) => {
    const h = card(t, rows, 0, false);

      lastDom = t.d;

    }
    ensure(h);
    card(t, rows, y, true);
    y += h + 4;
  });

  // Krachtratio's (alleen als beide spiergroepen gekozen zijn)
  const rr = moments.map(m => ({m, rs:ratiosFor(m)})).filter(x => x.rs.length);
  if(o.withRatios && rr.length && o.tids.some(id => RATIOS.some(R => R.a === id || R.b === id))){
    ensure(30);
    heading("Krachtverhoudingen", 'De verhouding tussen twee spiergroepen rond hetzelfde gewricht.');
    doc.autoTable({startY:y, margin:{left:M, right:M, top:24, bottom:20}, head:[['Datum','Verhouding','Links','Rechts']],
      body:rr.flatMap(x => x.rs.map(r => [fmtDate(x.m.datum), r.l, fmtR(r.L) + (r.nL ? '  ' + r.nL.t : ''), fmtR(r.R) + (r.nR ? '  ' + r.nR.t : '')])),
      theme:'plain', styles:{font:'helvetica', fontSize:9, textColor:TXT, cellPadding:2.4}, headStyles:{fillColor:[243,227,239], textColor:PUR, fontStyle:'bold'}, alternateRowStyles:{fillColor:[252,249,251]}});
    y = doc.lastAutoTable.finalY + 6;
  }

  // Kop (vervolgpagina's) en voet
  const n = doc.getNumberOfPages();

    doc.setPage(i);
    if(i > 1){
      if(logo){ try{ doc.addImage(logo.data, 'PNG', M, 8, 6.5 * logo.ar, 6.5); } catch(e){} }
      font('normal', 8, MUT); doc.text('Testoverzicht ' + p.voornaam, W - M, 13, {align:'right'});
      doc.setFillColor(...LINE); doc.rect(M, 17, CW, 0.3, 'F');
    }
    doc.setFillColor(...LINE); doc.rect(M, H - 13, CW, 0.3, 'F');
    font('normal', 7.5, MUT);
    doc.text('Fyzio Totaal  ·  Nijverheidsstraat 7, Wierden', M, H - 8.5);
    doc.text('Pagina ' + i + ' van ' + n, W - M, H - 8.5, {align:'right'});
  }
  const name = 'Testoverzicht_' + p.voornaam.replace(/\W+/g, '_') + '_' + fmtDate(lastM.datum) + '.pdf';
  return {doc, name};
}

function pdfChart(doc, x0, y0, w, h, pts, m, draw, font){
  const side = pts.some(p => p.m.side);
  const series = side
    ? [{c:[130,23,109], v:pts.map(p => p.m.L), n:'Links'}, {c:[0,182,232], v:pts.map(p => p.m.R), n:'Rechts'}]
    : [{c:[130,23,109], v:pts.map(p => p.m.V), n:m.l}];
  const ys = series.flatMap(s => s.v).filter(v => v != null); if(!ys.length) return y0;
  if(!draw) return y0 + h + 6;
  let min = Math.min(...ys), max = Math.max(...ys); if(min === max){ min -= 1; max += 1; }
  const pad = (max - min) * 0.25; min -= pad; max += pad;
  const top = y0 + 7, bot = y0 + h - 6, pl = 4, pr = 4;
  const X = i => pts.length === 1 ? x0 + w/2 : x0 + pl + 8 + i * (w - pl - pr - 16) / (pts.length - 1);
  const Y = v => top + (1 - (v - min) / (max - min)) * (bot - top);
  doc.setFillColor(252,249,251); doc.roundedRect(x0, y0, w, h, 2.5, 2.5, 'F');
  font('bold', 7.5, [122,100,120]); doc.text('Verloop: ' + (m.k === 'totaal' ? 'totaalscore' : m.l.toLowerCase()) + (m.u && !m.u.startsWith('/') && m.u !== 'min:sec' && m.u !== 'hh' ? ' (' + m.u + ')' : ''), x0 + 3, y0 + 4.5);
  if(side){ let lx = x0 + w - 3; [...series].reverse().forEach(s => { font('normal', 7.5, [122,100,120]); const tw = doc.getTextWidth(s.n); lx -= tw; doc.text(s.n, lx, y0 + 4.5); doc.setFillColor(...s.c); doc.circle(lx - 2.2, y0 + 3.4, 1, 'F'); lx -= 7; }); }
  doc.setDrawColor(226,213,223); doc.setLineWidth(0.2); doc.line(x0 + 3, bot, x0 + w - 3, bot);
  font('normal', 7, [122,100,120]); pts.forEach((p, i) => doc.text(fmtDate(p.d), X(i), y0 + h - 1.8, {align:'center'}));
  series.forEach((s, si) => {
    doc.setDrawColor(...s.c); doc.setFillColor(...s.c); doc.setLineWidth(0.7); let prev = null;
    s.v.forEach((v, i) => {
      if(v == null) return; const pt = [X(i), Y(v)];
      if(prev) doc.line(prev[0], prev[1], pt[0], pt[1]);
      doc.circle(pt[0], pt[1], 1.1, 'F');
      const other = side ? series[1 - si].v[i] : null, below = other != null && v < other || (other === v && si === 1);
      font('bold', 7, s.c); doc.text(fvp(m, v), pt[0], pt[1] + (below ? 4.2 : -2.2), {align:'center'});
      prev = pt;
    });
  });
  return y0 + h + 4;
}

async function doPdf(mode){
  const o = readPdfOpts(); if(!o) return;
  const btn = document.querySelector('[data-act="' + (mode === 'mail' ? 'mailPdf' : 'makePdf') + '"]');
  const isMobile = window.matchMedia('(pointer: coarse)').matches;
  // Op de computer: open het mailvenster meteen (anders blokkeert de browser de pop-up)
  const win = mode === 'mail' && !isMobile ? window.open('', '_blank') : null;
  try{
    if(btn){ btn.disabled = true; btn.dataset.lbl = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span> Bezig…'; }
    const {doc, name} = await buildPdf(o);
    if(mode !== 'mail'){ doc.save(name); closeModal(); toast('PDF gedownload'); return; }
    const to = $('#mail-to').value.trim(), su = $('#mail-su').value.trim(), body = $('#mail-body').value;
    const blob = doc.output('blob'), file = new File([blob], name, {type:'application/pdf'});
    if(isMobile && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:su, text:body}); closeModal(); toast('Verstuurd via je mail-app'); }
      catch(e){ if(e.name !== 'AbortError') toast('Delen mislukt: ' + e.message, true); }
      return;
    }
    doc.save(name);
    const gmail = 'https://mail.google.com/mail/?view=cm&fs=1' + (to ? '&to=' + encodeURIComponent(to) : '') + '&su=' + encodeURIComponent(su) + '&body=' + encodeURIComponent(body);
    const mailto = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(su) + '&body=' + encodeURIComponent(body);
    if(win) win.location.href = gmail; else window.open(gmail, '_blank');
    openModal(`<h2>📧 Bijna klaar</h2><p>De PDF <b>${esc(name)}</b> is gedownload en er staat een concept-mail klaar in Gmail${to ? ' aan <b>' + esc(to) + '</b>' : ''}.</p>
      <p><b>Laatste stap:</b> sleep het PDF-bestand uit je downloads in de mail (of klik op de paperclip) en verstuur.</p>
      <p class="muted small">Gmail opent niet of gebruik je een ander mailprogramma? <a href="${esc(mailto)}">Open in je standaard mail-app</a>.</p>
      <div class="actions"><button class="btn primary" data-act="closeModal">Sluiten</button></div>`);
  } catch(e){
    console.error(e); if(win) win.close(); toast('PDF maken mislukt: ' + e.message, true);
  } finally {
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = btn.dataset.lbl; }
  }
}

  closePicker(){ document.body.classList.remove('picker-open'); const n = S.draft.results.length - 1; const c = document.getElementById('rc-' + n); if(c) setTimeout(() => c.scrollIntoView({behavior:'smooth', block:'center'}), 50); },
  pnav(el){ S.ppath = S.ppath.slice(0, +el.dataset.lvl); refreshPicker(); },
  pdom(el){ S.ppath = [el.dataset.id]; refreshPicker(); },
  psub(el){ S.ppath = [S.ppath[0], el.dataset.s]; refreshPicker(); },
  async delTeam(el){ const n = el.dataset.n; if(!confirm(n + ' verwijderen uit de testerslijst? Eerdere testmomenten behouden de naam.')) return; try{ await saveConfig(c => { c.team = c.team.filter(x => x !== n); }); render(); toast(n + ' verwijderd'); } catch(e){ toast('Opslaan mislukt: ' + e.message, true); } },
  editCustom(el){ customForm(el.dataset.id ? S.config.customTests.find(c => c.id === el.dataset.id) : null); },
  async archCustom(el){ const c = S.config.customTests.find(x => x.id === el.dataset.id); if(!c || !confirm('“' + c.n + '” verwijderen? De test is daarna niet meer te kiezen; eerdere resultaten blijven zichtbaar.')) return; try{ await saveConfig(cf => { const x = cf.customTests.find(z => z.id === c.id); if(x) x.archived = true; }); render(); } catch(e){ toast('Opslaan mislukt: ' + e.message, true); } },
  async restoreCustom(el){ try{ await saveConfig(cf => { const x = cf.customTests.find(z => z.id === el.dataset.id); if(x) x.archived = false; }); render(); } catch(e){ toast('Opslaan mislukt: ' + e.message, true); } },
  pdfModal(){ pdfModal(); }, aiModal, runAi,
  makePdf(){ doPdf('download'); }, mailPdf(){ doPdf('mail'); },
  mailAi(el){ pdfModal(el.dataset.id); },
  checkAll(el){ const bx = [...document.querySelectorAll('input[data-g="' + el.dataset.g + '"]')]; const all = bx.every(b => b.checked); bx.forEach(b => b.checked = !all); },
  resetKey(){ try{ localStorage.removeItem('ft_apikey'); } catch(e){} toast('Key verwijderd, klik opnieuw op Genereren'); const b = document.querySelector('[data-act="runAi"]'); if(b) b.disabled = false; },
  copyAiDraft(){ copyText($('#ai-result').value); },
  async saveAi(el){
    const tekst = $('#ai-result').value.trim(); if(!tekst) return;
    const s = {id:uid('s'), created:new Date().toISOString(), momenten:el.dataset.ids.split(',').map(id => S.patient.momenten.find(m => m.id === id)?.datum).filter(Boolean), momentIds:el.dataset.ids.split(','), tekst};
    try{ await savePatient(p => { p.samenvattingen.push(s); }); closeModal(); S.dashTab = 'ai'; render(); toast('Samenvatting opgeslagen'); } catch(e){ toast('Opslaan mislukt: ' + e.message, true); }
  },
  copyAi(el){ const s = S.patient.samenvattingen.find(x => x.id === el.dataset.id); if(s) copyText(s.tekst); },
  editAi(el){ const s = S.patient.samenvattingen.find(x => x.id === el.dataset.id); if(!s) return;
    openModal(`<h2>Samenvatting bewerken</h2><textarea class="inp" id="ai-edit" style="min-height:380px;margin-top:10px;font-size:13.5px;line-height:1.6">${esc(s.tekst)}</textarea><div class="actions"><button class="btn" data-act="closeModal">Annuleren</button><button class="btn primary" data-act="saveAiEdit" data-id="${s.id}">Opslaan</button></div>`, true); },
  async saveAiEdit(el){ const t = $('#ai-edit').value; try{ await savePatient(p => { const s = p.samenvattingen.find(x => x.id === el.dataset.id); if(s){ s.tekst = t; s.edited = new Date().toISOString(); } }); closeModal(); render(); toast('Opgeslagen'); } catch(e){ toast('Opslaan mislukt: ' + e.message, true); } },
  async delAi(el){ if(!confirm('Deze samenvatting verwijderen?')) return; try{ await savePatient(p => { p.samenvattingen = p.samenvattingen.filter(x => x.id !== el.dataset.id); }); render(); } catch(e){ toast('Verwijderen mislukt: ' + e.message, true); } }
};
function copyText(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Gekopieerd'), () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Gekopieerd'); }); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.dataset.act === 'bgClose'){ fn(el, e); return; }
  e.preventDefault(); fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'pq'){ S.pq = el.value; refreshPicker(); return; }
  if(S.view !== 'moment' || !S.draft) return;
  if(el.dataset.draft){ S.draft[el.dataset.draft] = el.value; S.dirty = true; if(el.dataset.draft === 'leeftijd' || el.dataset.draft === 'zijde') refreshCalcs(); return; }
  if(el.dataset.r !== undefined){
    const i = +el.dataset.r, r = S.draft.results[i]; if(!r) return; r.v = r.v || {};
    if(el.dataset.note){ r.o = el.value; }
    else if(el.dataset.item !== undefined){ r.v.items = r.v.items || {}; if(el.value === '') delete r.v.items[el.dataset.item]; else r.v.items[el.dataset.item] = +el.value; }
    else if(el.dataset.s){ r.v[el.dataset.k] = r.v[el.dataset.k] || {}; r.v[el.dataset.k][el.dataset.s] = el.value;
      if(el.dataset.sg){ const dk = el.dataset.k + '_dir'; r.v[dk] = r.v[dk] || {}; if(!r.v[dk][el.dataset.s]) r.v[dk][el.dataset.s] = el.previousElementSibling.value; } }
    else { r.v[el.dataset.k] = el.value; if(el.dataset.sg && !r.v[el.dataset.k + '_dir']) r.v[el.dataset.k + '_dir'] = el.previousElementSibling.value; }
    S.dirty = true;
    const t = testById(r.t), c = document.getElementById('calc-' + i); if(c && t) c.innerHTML = calcHTML(t, r);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'mail-ai' || el.id === 'pdf-ai'){
    const id = $('#pdf-ai') ? $('#pdf-ai').value : '', on = $('#mail-ai') && $('#mail-ai').checked;
    const ms = sortedMoments(); $('#mail-body').value = mailBody(ms[ms.length-1], on && id ? S.patient.samenvattingen.find(x => x.id === id) : null);
    return;
  }
  if(el.dataset.chartsel){ S.chartSel[el.dataset.chartsel] = el.value; render(); return; }

});
function refreshCalcs(){ S.draft.results.forEach((r, i) => { const t = testById(r.t), c = document.getElementById('calc-' + i); if(c && t) c.innerHTML = calcHTML(t, r); }); }
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target;
  if(f.id === 'start-form'){
    const nr = $('#in-nr').value.trim().replace(/\s/g,''), naam = $('#in-naam').value.trim();
    if(!/^\d{1,12}$/.test(nr)){ $('#start-msg').textContent = 'Voer een geldig patiëntnummer in (alleen cijfers).'; return; }
    openPatient(nr, naam, false);
  }
  if(f.id === 'patient-form'){
    const fd = new FormData(f), vn = fd.get('voornaam').trim(), g = fd.get('geslacht'); if(!vn) return;
    try{ await savePatient(p => { p.voornaam = vn; p.geslacht = g; }); closeModal(); render(); toast('Gegevens opgeslagen'); } catch(err){ toast('Opslaan mislukt: ' + err.message, true); }
  }
  if(f.id === 'team-form'){
    const n = $('#team-in').value.trim(); if(!n) return;
    if((S.config.team || []).some(x => norm(x) === norm(n))){ toast(n + ' staat al in de lijst', true); return; }
    try{ await saveConfig(c => { if(!c.team.some(x => norm(x) === norm(n))) c.team.push(n); }); render(); toast(n + ' toegevoegd'); $('#team-in')?.focus(); } catch(err){ toast('Opslaan mislukt: ' + err.message, true); }
  }
  if(f.id === 'custom-form'){
    const fd = new FormData(f), id = f.dataset.id;
    const c = {n:fd.get('n').trim(), d:fd.get('d'), s:fd.get('s').trim() || 'Eigen testen', kw:fd.get('kw').trim(), type:fd.get('type'), label:fd.get('label').trim(), unit:fd.get('unit').trim(), opts:fd.get('opts').trim(), side:fd.get('side') === '1', better:fd.get('better'), info:fd.get('info').trim()};
    if(!c.n) return;
    if(c.type === 'keuze' && c.opts.split(',').filter(s => s.trim()).length < 2){ toast('Geef minimaal twee keuzeopties, gescheiden door komma’s', true); return; }
    try{
      await saveConfig(cf => { if(id){ const x = cf.customTests.find(z => z.id === id); if(x) Object.assign(x, c, {edited:new Date().toISOString()}); } else cf.customTests.push(Object.assign({id:uid('c_'), created:new Date().toISOString()}, c)); });
      closeModal(); render(); toast('Eigen test opgeslagen');
    } catch(err){ toast('Opslaan mislukt: ' + err.message, true); }
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
window.addEventListener('beforeunload', e => { if(S.view === 'moment' && S.dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ===== INIT ===== */
window.tmCanReload = () => !(S.view === 'moment' && S.dirty);
window.tmShowUpdate = (v) => {
  if(document.querySelector('.update-bar')) return;
  const b = document.createElement('div'); b.className = 'update-bar';
  b.innerHTML = '<span style="flex:1">Er staat een nieuwe versie van de tool klaar. Sla eerst je testmoment op; daarna wordt hij automatisch geladen.</span><button class="btn small">Nu herladen</button>';
  b.querySelector('button').onclick = () => { if(!window.tmCanReload() && !confirm('Niet-opgeslagen invoer gaat verloren. Toch herladen?')) return; S.dirty = false; location.replace(location.pathname + '?_v=' + Date.now() + location.hash); };
  document.body.appendChild(b);
};
document.getElementById('app-version').textContent = APP_VERSION;
render();
loadConfig().then(() => { if(S.view === 'beheer' || S.view === 'start') render(); });
loadRecent();
// Na een (automatische) herlaad of verversen: dezelfde patiënt weer openen
(function(){ const m = location.hash.match(/^#p=(\d+)$/); if(m) openPatient(m[1], '', true); })();
</script>
</body>
