<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Zorgverzekeraars — Fyzio Totaal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paars:#82176D; --paars-donker:#4a0f42; --paars-licht:#a8368f; --paars-hover:#6b1259;
    --cyaan:#00B6E8; --blauw-tekst:#00728e; --tag-paars:#f3e3ef; --tag-blauw:#dcf4fb;
    --rand:#e2d5df; --pagina:#f3eef2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins','Segoe UI',sans-serif;background:var(--pagina);color:#2b2230;}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  .app{display:flex;flex-direction:column;min-height:100vh}
  main{flex:1}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  header{background:linear-gradient(120deg,#4a0f42 0%,#82176D 45%,#a8368f 100%);border-bottom:4px solid var(--cyaan);color:#fff;padding:26px 0 24px}
  .badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
  .head-row{display:flex;align-items:center;gap:14px}
  .logo{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--cyaan);color:var(--paars);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  h1{margin:0;font-size:24px;font-weight:700}
  .sub{margin:2px 0 0;font-size:13px;opacity:.85}

  .tabs{display:flex;gap:6px;margin:22px 0 16px;flex-wrap:wrap}
  .tab{border:1px solid var(--rand);background:#fff;color:#5b4b57;padding:9px 18px;border-radius:12px;font-size:14px;font-weight:600}
  .tab.active{background:var(--paars);border-color:var(--paars);color:#fff}
  .topic{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#6b5a67}
  .topic b{background:var(--tag-paars);color:var(--paars);padding:5px 12px;border-radius:999px;font-weight:600}

  .card{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(130,23,109,.08);padding:18px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:200px;border:1px solid #d9cfd6;border-radius:12px;padding:10px 14px;background:#fff}
  .search:focus,.field:focus{outline:none;border-color:var(--paars);box-shadow:0 0 0 3px var(--tag-paars)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--rand);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;color:#5b4b57}
  .chip.on{background:var(--tag-paars);border-color:var(--paars);color:var(--paars);font-weight:600}
  .btn{background:linear-gradient(90deg,#82176D,#a8368f);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;font-size:14px}
  .btn:hover{background:linear-gradient(90deg,#6b1259,#8f2d78);box-shadow:0 4px 14px rgba(130,23,109,.25)}
  .btn2{background:#fff;color:#555;border:1px solid #d5d5d5;border-radius:12px;padding:10px 16px;font-weight:500;font-size:14px}
  .btn2:hover{background:#f7f7f7}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:10px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .ins h3{margin:0 0 2px;font-size:17px;color:var(--paars-donker)}
  .alias{font-size:12px;color:#7a6a76;margin-bottom:12px;min-height:16px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #f0e8ee;font-size:14px}
  .tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600}
  .tag.p{background:var(--tag-paars);color:var(--paars)}
  .tag.b{background:var(--tag-blauw);color:var(--blauw-tekst)}
  .note{font-size:12.5px;color:#5b4b57;background:#faf6f9;border-left:3px solid var(--cyaan);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:8px}
  .foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#8a7a86}
  .unchecked{color:#b45309}
  .empty{text-align:center;padding:40px;color:#8a7a86}

  .banner{border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13.5px}
  .banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
  .banner.info{background:var(--tag-blauw);color:var(--blauw-tekst)}

  .block{border:1px solid var(--rand);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
  .block h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--paars)}
  .block p{margin:0 0 10px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
  .field{width:100%;border:1px solid #d9cfd6;border-radius:12px;padding:10px 12px;background:#fff}
  label.l{display:block;font-size:12.5px;font-weight:600;color:#5b4b57;margin:12px 0 5px}
  .hint{font-size:12px;color:#8a7a86;margin-top:4px}

  .overlay{position:fixed;inset:0;background:rgba(40,10,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:560px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal.wide{max-width:760px}
  .modal h2{margin:0 0 4px;font-size:19px;color:var(--paars-donker)}
  .seg{display:flex;border:1px solid var(--rand);border-radius:12px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fff;padding:10px;font-size:14px;color:#5b4b57}
  .seg button.on{background:var(--paars);color:#fff;font-weight:600}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .del{margin-right:auto;background:#fff;color:#be123c;border:1px solid #fecdd3;border-radius:12px;padding:10px 16px;font-size:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--paars-donker);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 4px 18px rgba(0,0,0,.25)}
  .toast.err{background:#be123c}

  footer{background:var(--paars-donker);color:rgba(255,255,255,.5);font-size:12.5px;text-align:center;padding:16px}
  footer b{color:rgba(255,255,255,.85)}
  @media(max-width:600px){h1{font-size:20px}.topic{margin-left:0;width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

// v1.0.0 — verhoog dit nummer bij elke wijziging (zichtbaar in de footer, handig om GitHub Pages-deploys te checken)
const VERSION = "1.0.0";
const SB_URL = "https://szunargvsmtzbbnmnghc.supabase.co/rest/v1/fyzio_zorgverzekeraars";
const SB_KEY = "sb_publishable_EiIt1zJuqgjj-2FJ4mXTlg__kmUrPu5";
const HDR = { apikey: SB_KEY, "Content-Type": "application/json" };
const SETTINGS_ID = "_instellingen";
const JAAR = new Date().getFullYear();

// Onderwerpen per verzekeraar. Nu alleen artrose; later hier meer onderwerpen aan toevoegen.
const TOPIC = { id: "artrose", label: "Artrose knie & heup" };

const mk = (name, aliases, verwijzing, eigenRisico, gecontroleerd) => ({
  id: "ins_" + name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, ""),
  name, aliases,
  topics: { [TOPIC.id]: { verwijzing, eigenRisico, opmerking: "", gecontroleerd: gecontroleerd || null } },
});
const CHECKED = "2026-09-21"; // op basis van het overzicht dat Lonneke heeft aangeleverd
// Verzekeraars die niet expliciet zijn aangeleverd: standaard wel-verwijzing/wel-eigen-risico, en gemarkeerd als "nog niet gecontroleerd".
const SEED = [
  mk("VGZ", ["IZZ", "IZA Zorgverzekering", "UMC Zorgverzekering", "Univé", "Bewuzt"], false, false, CHECKED),
  mk("CZ", ["CZdirect", "OHRA", "Nationale-Nederlanden", "OZF"], true, true, CHECKED),
  mk("Menzis", ["Anderzorg", "HEMA"], false, true, CHECKED),
  mk("Zilveren Kruis", ["FBTO", "Interpolis", "Avéro Achmea", "De Friesland", "Pro Life"], false, false, CHECKED),
  mk("Zorg en Zekerheid", [], true, false, CHECKED),
  mk("Salland", [], true, false, CHECKED),
  mk("a.s.r.", ["Ditzo"], true, true),
  mk("ONVZ", ["PNOzorg", "VvAA"], true, true),
  mk("DSW", ["Stad Holland", "inTwente"], true, true),
  mk("Eno", ["Salland Verzekeringen", "HollandZorg"], true, true),
];

const DEFAULT_TEMPLATES = {
  verwijzing_ja: "Voor artrosezorg aan je knie of heup heb je bij {verzekeraar} een verwijzing nodig van je huisarts of specialist. Regel die dus voordat we starten met je traject.",
  verwijzing_nee: "Bij {verzekeraar} heb je geen verwijzing nodig voor artrosezorg. Je kunt dus gewoon direct bij ons terecht.",
  verwijzing_algemeen: "Of je een verwijzing nodig hebt voor artrosezorg aan je knie of heup, hangt af van je zorgverzekeraar. Sommige verzekeraars vragen om een verwijzing van je huisarts of specialist, andere niet. Laat ons weten bij welke verzekeraar je zit, dan vertellen we je precies wat je moet regelen.",
  er_ja: "De behandelingen voor artrosezorg vallen bij {verzekeraar} onder je eigen risico. Dat betekent dat je de kosten eerst zelf betaalt, totdat je eigen risico van dit jaar (maximaal €{bedrag}) op is. De rekening krijg je overigens niet van ons, maar van je zorgverzekeraar. Heb je je eigen risico dit jaar al (deels) gebruikt voor andere zorg? Dan betaal je voor onze behandelingen minder of niks meer.",
  er_nee: "Bij {verzekeraar} vallen de behandelingen voor artrosezorg niet onder je eigen risico. Je betaalt hiervoor dus niks van je eigen risico, en het gaat er ook niet vanaf.",
  er_algemeen: "Je eigen risico is het bedrag dat je elk jaar eerst zelf betaalt, voordat je zorgverzekeraar de zorgkosten vergoedt. In {jaar} is dat maximaal €{bedrag}. Of onze behandelingen voor artrose aan de knie of heup hieronder vallen, hangt af van je zorgverzekeraar: sommige rekenen dit niet mee. Check dit in je polis of vraag het na bij je verzekeraar. De rekening voor je eigen risico krijg je overigens van je zorgverzekeraar, niet van ons.",
  jaar_ja: "Let op: zit je in een chronisch traject dat over de jaarwisseling heen loopt? Dan begint je eigen risico in januari gewoon weer opnieuw. Behandelingen die je in {volgendjaar} krijgt, tellen mee voor het eigen risico van {volgendjaar}, ook als je traject al in {jaar} is gestart. Je kunt in het nieuwe jaar dus opnieuw een rekening van je zorgverzekeraar krijgen.",
  jaar_nee: "Ook als je traject over de jaarwisseling heen loopt, verandert er voor jou niks: bij {verzekeraar} betaal je geen eigen risico voor artrosezorg. Verzekeraars kunnen dit wel jaarlijks aanpassen, dus check bij de jaarwisseling even of dit nog steeds zo is.",
  jaar_algemeen: "Loopt je chronische traject over de jaarwisseling heen? Dan begint je eigen risico in januari gewoon weer opnieuw. Valt artrosezorg bij jouw verzekeraar onder het eigen risico, dan betaal je in het nieuwe jaar dus opnieuw, ook al ben je al in het vorige jaar gestart met je traject. Rekent jouw verzekeraar er geen eigen risico voor, dan verandert er niks.",
};
const TEMPLATE_LABELS = {
  verwijzing_ja: "Verwijzing: wel nodig", verwijzing_nee: "Verwijzing: niet nodig", verwijzing_algemeen: "Verwijzing: algemeen (onbekende verzekeraar)",
  er_ja: "Eigen risico: wel van toepassing", er_nee: "Eigen risico: niet van toepassing", er_algemeen: "Eigen risico: algemeen (onbekende verzekeraar)",
  jaar_ja: "Nieuw jaar: eigen risico begint opnieuw", jaar_nee: "Nieuw jaar: geen eigen risico van toepassing", jaar_algemeen: "Nieuw jaar: algemeen (onbekende verzekeraar)",
};
const DEFAULT_SETTINGS = { bedrag: 385, templates: {} };

const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const slug = (s) => "ins_" + norm(s).replace(/[^a-z0-9]+/g, "").slice(0, 40);
const fill = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => (v[k] !== undefined ? v[k] : "{" + k + "}"));
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" }) : null;

async function sbGet() {
  const r = await fetch(SB_URL + "?select=*", { headers: HDR });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function sbPost(rows) {
  const r = await fetch(SB_URL, {
    method: "POST",
    headers: { ...HDR, Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(rows),
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
}
async function sbDelete(id) {
  const r = await fetch(SB_URL + "?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: HDR });
  if (!r.ok) throw new Error("HTTP " + r.status);
}
const toRow = (i) => ({ id: i.id, data: { name: i.name, aliases: i.aliases, topics: i.topics }, updated_at: new Date().toISOString() });

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand("copy"); document.body.removeChild(ta);
  return Promise.resolve();
}

function Seg({ value, onChange, yes, no }) {
  return (
    <div className="seg">
      <button type="button" className={value === true ? "on" : ""} onClick={() => onChange(true)}>{yes}</button>
      <button type="button" className={value === false ? "on" : ""} onClick={() => onChange(false)}>{no}</button>
    </div>
  );
}

function EditModal({ ins, isNew, onSave, onDelete, onClose }) {
  const t0 = ins.topics[TOPIC.id];
  const [name, setName] = useState(ins.name);
  const [aliases, setAliases] = useState(ins.aliases.join(", "));
  const [verwijzing, setVerwijzing] = useState(t0.verwijzing);
  const [eigenRisico, setEigenRisico] = useState(t0.eigenRisico);
  const [opmerking, setOpmerking] = useState(t0.opmerking || "");
  const [gecontroleerd, setGecontroleerd] = useState(!!t0.gecontroleerd);

  const submit = () => {
    if (!name.trim()) return;
    onSave({
      id: ins.id || slug(name),
      name: name.trim(),
      aliases: aliases.split(",").map((a) => a.trim()).filter(Boolean),
      topics: {
        ...ins.topics,
        [TOPIC.id]: {
          verwijzing, eigenRisico, opmerking: opmerking.trim(),
          gecontroleerd: gecontroleerd ? (t0.gecontroleerd || new Date().toISOString().slice(0, 10)) : null,
        },
      },
    });
  };

  return (
    <div className="overlay" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>{isNew ? "Nieuwe zorgverzekeraar" : ins.name}</h2>
        <div className="hint">Onderwerp: {TOPIC.label}</div>
        <label className="l">Naam (label/concern)</label>
        <input className="field" value={name} onChange={(e) => setName(e.target.value)} />
        <label className="l">Valt hieronder (bijlabels, komma-gescheiden)</label>
        <input className="field" value={aliases} onChange={(e) => setAliases(e.target.value)} placeholder="bijv. IZZ, Univé" />
        <label className="l">Verwijzing nodig?</label>
        <Seg value={verwijzing} onChange={setVerwijzing} yes="Wel verwijzing nodig" no="Geen verwijzing nodig" />
        <label className="l">Eigen risico?</label>
        <Seg value={eigenRisico} onChange={setEigenRisico} yes="Wel eigen risico" no="Geen eigen risico" />
        <label className="l">Opmerking (intern, komt niet in de uitleg)</label>
        <textarea className="field" rows="3" value={opmerking} onChange={(e) => setOpmerking(e.target.value)} />
        <label className="l" style={{ display: "flex", gap: 8, alignItems: "center", fontWeight: 500 }}>
          <input type="checkbox" style={{ accentColor: "#82176D" }} checked={gecontroleerd} onChange={(e) => setGecontroleerd(e.target.checked)} />
          Gegevens gecontroleerd (bijv. bij de verzekeraar of in het contract)
        </label>
        <div className="actions">
          {!isNew && <button className="del" onClick={() => onDelete(ins)}>Verwijderen</button>}
          <button className="btn2" onClick={onClose}>Annuleren</button>
          <button className="btn" onClick={submit}>Opslaan</button>
        </div>
      </div>
    </div>
  );
}

function TemplateModal({ settings, onSave, onClose }) {
  const [bedrag, setBedrag] = useState(settings.bedrag);
  const [tpl, setTpl] = useState({ ...DEFAULT_TEMPLATES, ...settings.templates });
  return (
    <div className="overlay" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal wide">
        <h2>Uitlegteksten aanpassen</h2>
        <div className="hint">Gebruik {"{verzekeraar}"}, {"{bedrag}"}, {"{jaar}"} en {"{volgendjaar}"} als invulvelden — die worden automatisch ingevuld.</div>
        <label className="l">Eigen risico per jaar (€, wettelijk vastgesteld bedrag)</label>
        <input className="field" type="number" style={{ maxWidth: 160 }} value={bedrag} onChange={(e) => setBedrag(e.target.value)} />
        {Object.keys(DEFAULT_TEMPLATES).map((k) => (
          <div key={k}>
            <label className="l">
              {TEMPLATE_LABELS[k]}
              {tpl[k] !== DEFAULT_TEMPLATES[k] && (
                <button type="button" className="btn2 btn-sm" style={{ marginLeft: 10 }} onClick={() => setTpl({ ...tpl, [k]: DEFAULT_TEMPLATES[k] })}>Herstel standaardtekst</button>
              )}
            </label>
            <textarea className="field" rows="4" value={tpl[k]} onChange={(e) => setTpl({ ...tpl, [k]: e.target.value })} />
          </div>
        ))}
        <div className="actions">
          <button className="btn2" onClick={onClose}>Annuleren</button>
          <button className="btn" onClick={() => {
            const templates = {};
            Object.keys(tpl).forEach((k) => { if (tpl[k] !== DEFAULT_TEMPLATES[k]) templates[k] = tpl[k]; });
            onSave({ bedrag: Number(bedrag) || DEFAULT_SETTINGS.bedrag, templates });
          }}>Opslaan</button>
        </div>
      </div>
    </div>
  );
}

function InsCard({ ins, onEdit }) {
  const t = ins.topics[TOPIC.id];
  return (
    <div className="card ins">
      <h3>{ins.name}</h3>
      <div className="alias">{ins.aliases.length ? "Valt hieronder: " + ins.aliases.join(", ") : ""}</div>
      <div className="row"><span>Verwijzing</span><span className={"tag " + (t.verwijzing ? "p" : "b")}>{t.verwijzing ? "Wel nodig" : "Niet nodig"}</span></div>
      <div className="row"><span>Eigen risico</span><span className={"tag " + (t.eigenRisico ? "p" : "b")}>{t.eigenRisico ? "Wel" : "Geen"}</span></div>
      {t.opmerking && <div className="note">{t.opmerking}</div>}
      <div className="foot-row">
        <span className={t.gecontroleerd ? "" : "unchecked"}>{t.gecontroleerd ? "Gecontroleerd " + fmtDate(t.gecontroleerd) : "Nog niet gecontroleerd"}</span>
        <button className="btn2 btn-sm" onClick={() => onEdit(ins)}>Bewerken</button>
      </div>
    </div>
  );
}

function Overzicht({ insurers, onEdit, onNew }) {
  const [q, setQ] = useState("");
  const [f, setF] = useState("alle");
  const filters = [
    ["alle", "Alle"], ["vw_ja", "Wel verwijzing"], ["vw_nee", "Geen verwijzing"],
    ["er_ja", "Wel eigen risico"], ["er_nee", "Geen eigen risico"], ["ongecontroleerd", "Nog te controleren"],
  ];
  const shown = insurers.filter((i) => {
    const t = i.topics[TOPIC.id];
    if (f === "vw_ja" && !t.verwijzing) return false;
    if (f === "vw_nee" && t.verwijzing) return false;
    if (f === "er_ja" && !t.eigenRisico) return false;
    if (f === "er_nee" && t.eigenRisico) return false;
    if (f === "ongecontroleerd" && t.gecontroleerd) return false;
    if (q.trim()) {
      const n = norm(q.trim());
      return norm(i.name).includes(n) || i.aliases.some((a) => norm(a).includes(n));
    }
    return true;
  });
  const q2 = norm(q.trim());
  const hit = q.trim() && shown.length === 1 && !norm(shown[0].name).includes(q2)
    ? shown[0].aliases.find((a) => norm(a).includes(q2)) : null;

  return (
    <div>
      <div className="toolbar">
        <input className="search" placeholder="Zoek op verzekeraar of label (bijv. IZZ)…" value={q} onChange={(e) => setQ(e.target.value)} />
        <button className="btn" onClick={onNew}>+ Verzekeraar</button>
      </div>
      <div className="chips">
        {filters.map(([k, l]) => <button key={k} className={"chip" + (f === k ? " on" : "")} onClick={() => setF(k)}>{l}</button>)}
      </div>
      {hit && <div className="banner info"><b>{hit}</b> valt onder <b>{shown[0].name}</b>.</div>}
      {shown.length ? (
        <div className="grid">{shown.map((i) => <InsCard key={i.id} ins={i} onEdit={onEdit} />)}</div>
      ) : <div className="card empty">Geen zorgverzekeraars gevonden.</div>}
    </div>
  );
}

function Uitleg({ insurers, settings, onEditTemplates, toast }) {
  const [sel, setSel] = useState("");
  const ins = insurers.find((i) => i.id === sel);
  const tpl = { ...DEFAULT_TEMPLATES, ...settings.templates };
  const vars = { verzekeraar: ins ? ins.name : "", bedrag: String(settings.bedrag), jaar: String(JAAR), volgendjaar: String(JAAR + 1) };
  const t = ins ? ins.topics[TOPIC.id] : null;
  const blocks = ins ? [
    ["Verwijzing", tpl[t.verwijzing ? "verwijzing_ja" : "verwijzing_nee"]],
    ["Eigen risico", tpl[t.eigenRisico ? "er_ja" : "er_nee"]],
    ["Chronisch traject & nieuw jaar", tpl[t.eigenRisico ? "jaar_ja" : "jaar_nee"]],
  ] : [
    ["Verwijzing", tpl.verwijzing_algemeen],
    ["Eigen risico", tpl.er_algemeen],
    ["Chronisch traject & nieuw jaar", tpl.jaar_algemeen],
  ];
  const texts = blocks.map(([h, x]) => [h, fill(x, vars)]);
  const copy = (txt, msg) => copyText(txt).then(() => toast(msg));

  return (
    <div className="card">
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
        <div style={{ flex: 1, minWidth: 220 }}>
          <label className="l" style={{ marginTop: 0 }}>Uitleg voor</label>
          <select className="field" value={sel} onChange={(e) => setSel(e.target.value)}>
            <option value="">Algemeen (verzekeraar onbekend)</option>
            {insurers.map((i) => <option key={i.id} value={i.id}>{i.name}{i.aliases.length ? " (" + i.aliases.join(", ") + ")" : ""}</option>)}
          </select>
        </div>
        <button className="btn2" onClick={onEditTemplates}>Teksten aanpassen</button>
        <button className="btn" onClick={() => copy(texts.map(([, x]) => x).join("\n\n"), "Alles gekopieerd")}>Kopieer alles</button>
      </div>
      <div style={{ height: 16 }} />
      {texts.map(([h, x]) => (
        <div className="block" key={h}>
          <h4>{h}</h4>
          <p>{x}</p>
          <button className="btn2 btn-sm" onClick={() => copy(x, "Gekopieerd")}>Kopieer</button>
        </div>
      ))}
      {ins && t.opmerking && <div className="note"><b>Interne opmerking:</b> {t.opmerking}</div>}
      {ins && !t.gecontroleerd && <div className="banner warn" style={{ marginTop: 12, marginBottom: 0 }}>De gegevens van {ins.name} zijn nog niet gecontroleerd. Check ze even voordat je de uitleg deelt met een patiënt.</div>}
    </div>
  );
}

function App() {
  const [insurers, setInsurers] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [status, setStatus] = useState("laden");
  const [tab, setTab] = useState("overzicht");
  const [editing, setEditing] = useState(null);
  const [editTpl, setEditTpl] = useState(false);
  const [msg, setMsg] = useState(null);

  const toast = (text, err) => { setMsg({ text, err }); setTimeout(() => setMsg(null), 2600); };
  const sortIns = (l) => [...l].sort((a, b) => a.name.localeCompare(b.name, "nl"));

  useEffect(() => {
    (async () => {
      try {
        const rows = await sbGet();
        const s = rows.find((r) => r.id === SETTINGS_ID);
        if (s) setSettings({ ...DEFAULT_SETTINGS, ...s.data });
        const list = rows.filter((r) => r.id !== SETTINGS_ID).map((r) => ({ id: r.id, ...r.data }));
        if (!list.length) {
          await sbPost(SEED.map(toRow));
          setInsurers(sortIns(SEED));
          toast("Startlijst opgeslagen");
        } else setInsurers(sortIns(list));
        setStatus("ok");
      } catch (e) {
        setInsurers(sortIns(SEED));
        setStatus("fout");
      }
    })();
  }, []);

  const save = async (ins) => {
    const isEdit = insurers.some((i) => i.id === ins.id);
    setInsurers((l) => sortIns(isEdit ? l.map((i) => (i.id === ins.id ? ins : i)) : [...l, ins]));
    setEditing(null);
    try { await sbPost([toRow(ins)]); toast("Opgeslagen"); }
    catch (e) { toast("Opslaan mislukt — check je internetverbinding", true); }
  };
  const remove = async (ins) => {
    if (!window.confirm("Weet je zeker dat je " + ins.name + " wilt verwijderen?")) return;
    setInsurers((l) => l.filter((i) => i.id !== ins.id));
    setEditing(null);
    try { await sbDelete(ins.id); toast("Verwijderd"); }
    catch (e) { toast("Verwijderen mislukt", true); }
  };
  const saveSettings = async (s) => {
    setSettings(s); setEditTpl(false);
    try { await sbPost([{ id: SETTINGS_ID, data: s, updated_at: new Date().toISOString() }]); toast("Opgeslagen"); }
    catch (e) { toast("Opslaan mislukt", true); }
  };
  const blank = { id: "", name: "", aliases: [], topics: { [TOPIC.id]: { verwijzing: true, eigenRisico: true, opmerking: "", gecontroleerd: null } } };

  return (
    <div className="app">
      <header>
        <div className="wrap">
          <span className="badge">🔒 Alleen voor intern gebruik</span>
          <div className="head-row">
            <div className="logo">🩺</div>
            <div>
              <h1>Zorgverzekeraars</h1>
              <p className="sub">Wat vraagt elke verzekeraar? Verwijzing, eigen risico en een kant-en-klare uitleg voor patiënten.</p>
            </div>
          </div>
        </div>
      </header>
      <main>
        <div className="wrap">
          <div className="tabs">
            <button className={"tab" + (tab === "overzicht" ? " active" : "")} onClick={() => setTab("overzicht")}>Overzicht</button>
            <button className={"tab" + (tab === "uitleg" ? " active" : "")} onClick={() => setTab("uitleg")}>Uitleg genereren</button>
            <div className="topic">Onderwerp: <b>{TOPIC.label}</b></div>
          </div>
          {status === "fout" && (
            <div className="banner warn">Geen verbinding met de gedeelde opslag. Je ziet nu de standaardlijst en wijzigingen worden niet gedeeld met je collega's. Is de tabel <b>fyzio_zorgverzekeraars</b> al aangemaakt in Supabase?</div>
          )}
          {status === "laden" ? <div className="card empty">Laden…</div> :
            tab === "overzicht"
              ? <Overzicht insurers={insurers} onEdit={setEditing} onNew={() => setEditing({ ...blank, __new: true })} />
              : <Uitleg insurers={insurers} settings={settings} onEditTemplates={() => setEditTpl(true)} toast={toast} />}
          <div style={{ height: 32 }} />
        </div>
      </main>
      <footer><b>Fyzio Totaal</b> · Zorgverzekeraars · v{VERSION}</footer>
      {editing && <EditModal ins={editing} isNew={!!editing.__new} onSave={save} onDelete={remove} onClose={() => setEditing(null)} />}
      {editTpl && <TemplateModal settings={settings} onSave={saveSettings} onClose={() => setEditTpl(false)} />}
      {msg && <div className={"toast" + (msg.err ? " err" : "")}>{msg.text}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
