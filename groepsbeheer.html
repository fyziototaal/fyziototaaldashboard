const SUPABASE_URL="https://szunargvsmtzbbnmnghc.supabase.co";
const SUPABASE_KEY="sb_publishable_EiIt1zJuqgjj-2FJ4mXTlg__kmUrPu5";

async function dbGet(key){
  try{
    var r=await fetch(SUPABASE_URL+"/rest/v1/storage?key=eq."+encodeURIComponent(key)+"&select=value",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
    var d=await r.json();
    return d&&d.length>0?d[0].value:null;
  }catch(e){return null;}
}
async function dbSet(key,value){
  var H={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
  try{
    // 1) Probeer een echte upsert (één stap, geen moment waarop de data weg is)
    var up=await fetch(SUPABASE_URL+"/rest/v1/storage?on_conflict=key",{method:"POST",headers:Object.assign({"Prefer":"resolution=merge-duplicates,return=minimal"},H),body:JSON.stringify({key:key,value:value})});
    if(up.ok)return true;
    // 2) Fallback als 'key' geen unieke kolom is: bijwerken, en alleen invoegen als er nog niets was
    var pa=await fetch(SUPABASE_URL+"/rest/v1/storage?key=eq."+encodeURIComponent(key),{method:"PATCH",headers:Object.assign({"Prefer":"return=representation"},H),body:JSON.stringify({value:value})});
    if(!pa.ok)return false;
    var rows=await pa.json();
    if(rows&&rows.length>0)return true;
    var ins=await fetch(SUPABASE_URL+"/rest/v1/storage",{method:"POST",headers:Object.assign({"Prefer":"return=minimal"},H),body:JSON.stringify({key:key,value:value})});
    return ins.ok;
  }catch(e){return false;}
}

function stamp(){return Date.now()+Math.random();}
function dateStr(ts){return new Date(ts).toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit",year:"numeric"});}
function fmtDate(s){if(!s)return null;var p=s.split("-");return p[2]+"-"+p[1]+"-"+p[0];}
function sortG(a){return a.slice().sort(function(a,b){var d=DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day);return d!==0?d:a.time.localeCompare(b.time);});}

function mergeG(saved,init){
  var seen={};
  var dd=saved.filter(function(g){var k=g.day+"|"+g.time;if(seen[k])return false;seen[k]=true;return true;});
  var ids=dd.map(function(g){return g.id;});
  var miss=init.filter(function(g){return ids.indexOf(g.id)===-1;});
  var result=sortG(dd.concat(miss));
  result=result.map(function(g){
    var match=null;
    for(var i=0;i<init.length;i++){if(init[i].id===g.id){match=init[i];break;}}
    if(match)return Object.assign({},g,{niveau:match.niveau||""});
    return g;
  });
  return result;
}

function render(){
  var root=document.getElementById("root");
  // Vangnet: onthoud welk veld actief was (en de cursorpositie) en zet dat na het opnieuw opbouwen terug
  var ae=document.activeElement,fi=-1,ss=null,se=null;
  if(ae&&root.contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)){
    fi=Array.prototype.indexOf.call(root.querySelectorAll("input,select,textarea"),ae);
    try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){}
  }
  root.innerHTML="";root.appendChild(buildApp());
  if(fi>-1){
    var nf=root.querySelectorAll("input,select,textarea")[fi];
    if(nf){nf.focus({preventScroll:true});try{if(ss!=null)nf.setSelectionRange(ss,se);}catch(e){}}
  }
  scheduleAutosave();
}

/* ── AUTOSAVE ──
   Na elke render wordt gekeken of groepen/wachtlijst veranderd zijn t.o.v. de laatst opgeslagen stand.
   Zo ja: pas na 3 seconden zonder nieuwe wijziging wordt automatisch opgeslagen.
   De opslagstatus wordt ter plekke bijgewerkt, zónder de pagina opnieuw op te bouwen,
   zodat een veld waarin je typt nooit zijn focus verliest. */
var AUTOSAVE_DELAY=3000;
var LAST_SAVED={ft:null,ba:null},SAVE_TIMERS={},SAVING={},PENDING={},RETRY_TIMERS={};
function modKeys(mod){return mod==="ft"?{g:KEYS.ftg,w:KEYS.ftw}:{g:KEYS.bag,w:KEYS.baw};}
function snapshot(mod){return JSON.stringify({g:STATE[mod].groups,w:STATE[mod].waitlist});}
function hasUnsaved(mod){return !STATE[mod].loading&&(SAVING[mod]||snapshot(mod)!==LAST_SAVED[mod]);}

function scheduleAutosave(){
  ["ft","ba"].forEach(function(mod){
    if(STATE[mod].loading)return;
    if(snapshot(mod)===LAST_SAVED[mod])return;
    clearTimeout(SAVE_TIMERS[mod]);
    SAVE_TIMERS[mod]=setTimeout(function(){saveModule(mod);},AUTOSAVE_DELAY);
  });
}

async function saveModule(mod){
  if(SAVING[mod]){PENDING[mod]=true;return;}
  clearTimeout(RETRY_TIMERS[mod]);
  var snap=snapshot(mod);
  if(snap===LAST_SAVED[mod])return;
  SAVING[mod]=true;
  LAST_SAVED[mod]=snap;
  STATE[mod].saveStatus="saving";updateSaveBadge(mod);
  var data=JSON.parse(snap),k=modKeys(mod);
  var ok1=await dbSet(k.g,JSON.stringify(data.g));
  var ok2=await dbSet(k.w,JSON.stringify(data.w));
  SAVING[mod]=false;
  if(ok1&&ok2){
    STATE[mod].saveStatus="saved";
  }else{
    LAST_SAVED[mod]=null; // markeer als niet-opgeslagen, zodat het opnieuw geprobeerd wordt
    STATE[mod].saveStatus="error";
    RETRY_TIMERS[mod]=setTimeout(function(){saveModule(mod);},5000);
  }
  if(PENDING[mod]){PENDING[mod]=false;scheduleAutosave();}
  updateSaveBadge(mod);
}

function saveBadgeInfo(mod){
  var S=STATE[mod],dirty=snapshot(mod)!==LAST_SAVED[mod];
  var st=S.saveStatus==="saving"?"saving":S.saveStatus==="error"?"error":dirty?"dirty":"saved";
  var accent=mod==="ft"?G.purple:G.blue;
  return {
    saving:{t:"⏳ Opslaan…",bg:"#fff",c:accent,b:G.border},
    dirty:{t:"✎ Wijzigingen…",bg:"#fff",c:G.textMuted,b:G.border},
    saved:{t:"✓ Automatisch opgeslagen",bg:G.successLight,c:G.successGreen,b:G.successBorder},
    error:{t:"⚠ Opslaan mislukt — probeert opnieuw",bg:G.redLight,c:G.red,b:G.red}
  }[st];
}
function updateSaveBadge(mod){
  var b=document.getElementById("save-badge-"+mod);if(!b)return;
  var i=saveBadgeInfo(mod);
  b.textContent=i.t;b.style.background=i.bg;b.style.color=i.c;b.style.border="1px solid "+i.b;
}
/* Voor typvelden: data is al bijgewerkt, alleen status + timer verversen (geen herbouw) */
function changed(mod){scheduleAutosave();updateSaveBadge(mod);}

window.addEventListener("beforeunload",function(e){

});

async function loadModule(mod,gKey,wKey,init){
  try{
    var gv=await dbGet(gKey);var wv=await dbGet(wKey);
    STATE[mod].groups=gv?mergeG(JSON.parse(gv),init):init.slice();
    STATE[mod].waitlist=wv?JSON.parse(wv):[];
  }catch(e){STATE[mod].groups=init.slice();STATE[mod].waitlist=[];}
  STATE[mod].loading=false;
  LAST_SAVED[mod]=snapshot(mod); // geladen stand geldt als opgeslagen
  render();
}

function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    if(k==="style"&&typeof attrs[k]==="object"){Object.assign(e.style,attrs[k]);}
    else if(k==="className"){e.className=attrs[k];}
    else if(k.startsWith("on")){e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);}
    else if(k==="checked"){e.checked=attrs[k];}
    else if(k==="value"&&(tag==="input"||tag==="select")){e.value=attrs[k];}
    else if(k==="htmlFor"){e.htmlFor=attrs[k];}
    else{e.setAttribute(k,attrs[k]);}
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null||c===false)return;
      e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
    });
  }
  return e;
}

/* Vaste plek = direct en blijvend vrij. Tijdelijke plek = vrij zolang een deelnemer gepauzeerd is. */
function plekParts(ac,sc,rc,MAX){var t=Math.max(0,MAX-ac-rc),tmp=Math.min(sc,t);return{perm:t-tmp,tmp:tmp};}
function txtVast(n){return n+" vaste plek"+(n!==1?"ken":"")+" vrij";}
function txtTijd(n){return n+" tijdelijke plek"+(n!==1?"ken":"")+" vrij";}
function plekLabel(ac,sc,rc,MAX){var p=plekParts(ac,sc,rc,MAX);var a=[];if(p.perm>0)a.push(txtVast(p.perm));if(p.tmp>0)a.push(txtTijd(p.tmp));return a.length?a.join(" + "):"Vol";}
function gStatus(ac,sc,rc,MAX){var t=MAX-ac-rc,tmp=sc>t?t:sc,p=t-tmp;if(ac+rc>=MAX)return"full";if(p>0)return"free";return"temp";}
function calcNotifs(groups,waitlist,MAX){
  var n=[];
  for(var i=0;i<groups.length;i++){
    var g=groups[i],ac=0,sc=0,rc=0;
    for(var j=0;j<g.members.length;j++){var m=g.members[j];if(m.reserved)rc++;else if(m.stopped)sc++;else ac++;}
    if(ac+rc<MAX){
      var matches=[];
      for(var k=0;k<waitlist.length;k++){var w=waitlist[k];if(w.availability&&w.availability[g.day]&&w.availability[g.day][g.time])matches.push(w.naam||"");}
      if(matches.length>0){var pp=plekParts(ac,sc,rc,MAX);n.push({group:g.day+" "+g.time,matches:matches,plekInfo:plekLabel(ac,sc,rc,MAX),onlyTemp:pp.perm===0});}
    }
  }
  return n;
}
function availSummary(av){if(!av)return"";var parts=[];for(var i=0;i<DAY_ORDER.length;i++){var day=DAY_ORDER[i];if(!av[day])continue;var times=Object.keys(av[day]).filter(function(t){return av[day][t];});if(times.length>0)parts.push(day.substring(0,2)+": "+times.join(", "));}return parts.join(" | ");}
